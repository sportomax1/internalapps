<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video Snapshot Extractor</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<div class="app">
<header><div><h1>🎞 Video Snapshot Extractor</h1><p>Extract, compare, edit and export frames locally in your browser.</p></div><div class="privacy">🔒 Local processing</div></header>
<nav class="mobileTabs"><button class="active" data-tab="controls">Controls</button><button data-tab="videoPane">Video</button><button data-tab="photosPane">Photos</button></nav>
<div class="layout">
<aside id="controls" class="panel controls mobilePane active">
<label class="drop" id="drop"><input id="file" type="file" accept="video/*" multiple hidden><b>＋ Choose video(s)</b><small>or drag & drop MP4, MOV, WebM…</small></label>
<div id="queue" class="queue"></div>
<div class="mode"><button class="active" data-mode="interval">Interval</button><button data-mode="scene">Scene</button><button data-mode="manual">Manual</button></div>
<section><div class="sectionHead"><b>Snapshot interval</b><strong><span id="intervalLabel">5</span>s</strong></div>
<div id="presets" class="presets"><button data-v=".5">½s</button><button data-v="1">1s</button><button data-v="2">2s</button><button class="active" data-v="5">5s</button><button data-v="10">10s</button><button data-v="15">15s</button><button data-v="30">30s</button><button data-v="45">45s</button><button data-v="60">60s</button></div>
<input id="interval" type="range" min=".5" max="60" step=".5" value="5"><div id="recommendations" class="recommendations"></div></section>
<section class="range"><label>Start <input id="start" type="number" min="0" step=".01" value="0"></label><label>End <input id="end" type="number" min="0" step=".01" placeholder="Full video"></label></section>
<section class="two"><button id="captureCurrent">📷 Current frame</button><button id="addMarker">＋ Manual time</button></section><div id="manualList" class="muted"></div>
<button id="advancedOpen" class="secondary wide">⚙ Advanced settings</button>
<button id="generate" class="primary wide" disabled>Generate snapshots</button><button id="reset" class="secondary wide">Reset</button>
</aside>
<main>
<section id="videoPane" class="panel videoPane mobilePane"><video id="video" controls playsinline></video><div id="markerTrack" class="markerTrack"></div></section>
<section class="meta"><div><b id="infoName">No video loaded</b><span id="infoDetails">—</span></div><div class="estimate"><b id="estTotal">—</b><span id="estRange">—</span></div></section>
<section id="progressWrap" class="progressWrap"><div><i id="bar"></i></div><span id="progressText"></span></section>
<section id="photosPane" class="panel photosPane mobilePane"><div class="galleryHead"><h2>Snapshots <span id="count">0</span></h2><div class="actions"><button id="downloadAll" disabled>ZIP</button><button id="contact" disabled>Contact Sheet</button><button id="editShot" disabled>Edit</button><button id="compareShots" disabled>Compare</button><button id="timelapse" disabled>Timelapse</button><button id="clear" disabled>Clear</button></div></div><button id="photoPrev" class="rail left">‹</button><div id="gallery" class="gallery"><div class="empty">Generate snapshots to see them here.</div></div><button id="photoNext" class="rail right">›</button></section>
</main></div></div>
<div id="advancedModal" class="modal"><div class="dialog"><div class="modalHead"><h2>Advanced settings</h2><button data-close="advancedModal">×</button></div><label><input id="bestFrame" type="checkbox"> Best-frame / blur optimization</label><label><input id="dedupe" type="checkbox"> Remove near-duplicate frames</label><label>Format <select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><label>Quality <input id="quality" type="range" min=".1" max="1" step=".05" value=".9"><span id="qualityOut">0.90</span></label><label>Resolution <select id="resolution"><option value="original">Original</option><option value="1080">Max 1080p</option><option value="720">Max 720p</option><option value="480">Max 480p</option></select></label><label>Filename <input id="pattern" value="snapshot_{time}"></label></div></div>
<div id="featureModal" class="modal"><div class="dialog feature"><div class="modalHead"><h2 id="featureTitle">Tools</h2><button data-close="featureModal">×</button></div><div id="featureContent"></div></div></div>
<div id="lightbox" class="modal lightbox"><button class="x" data-close="lightbox">×</button><button id="lightPrev" class="lightNav left">‹</button><div class="lightStage"><img id="lightImg" alt="Snapshot"><div id="lightMeta"></div></div><button id="lightNext" class="lightNav right">›</button></div>
</body></html>
