<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA Trade Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243a;--line:#243b57;--text:#f7f9fc;--muted:#9db0c8;--accent:#ff6b35;--good:#39d98a;--danger:#ff5f6d;--shadow:0 18px 45px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142c49 0,#07111f 43%,#050b14 100%);color:var(--text);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:18px}.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.ball{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff9d3d,#e8531e);display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}h1{font-size:clamp(22px,4vw,34px);margin:0}.subtitle{color:var(--muted);font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);background:#14243a;color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{filter:brightness(1.12)}.btn.primary{background:var(--accent);border-color:transparent}.btn.danger{background:#351927;border-color:#6c2a3d}.btn.good{background:#153b31;border-color:#22634e}.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}.panel{background:linear-gradient(180deg,rgba(18,36,58,.98),rgba(10,23,39,.98));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.browser{padding:14px;position:sticky;top:12px;height:calc(100vh - 100px);overflow:hidden;display:flex;flex-direction:column}.control-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}select,input{width:100%;background:#071423;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.team-head{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}.team-head img{width:42px;height:42px;object-fit:contain}.player-list{overflow:auto;display:grid;gap:8px;padding-right:3px}.player-card{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:#0a1727;border:1px solid #1d3450;border-radius:12px;padding:8px}.player-card img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#16263b}.player-name{font-weight:800}.meta{color:var(--muted);font-size:12px}.mini-stats{display:flex;gap:9px;margin-top:5px;font-size:12px}.mini-stats b{color:#fff}.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;cursor:pointer}.workspace{display:grid;gap:14px}.trade-toolbar{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.team-count{display:flex;gap:7px;align-items:center}.pill{border:1px solid var(--line);background:#0b1727;color:#fff;padding:7px 10px;border-radius:999px;cursor:pointer}.pill.active{background:var(--accent);border-color:var(--accent)}.teams-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.trade-team{padding:14px;min-height:285px}.trade-team-header{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;margin-bottom:12px}.trade-team-header img{width:46px;height:46px;object-fit:contain}.trade-team h2{font-size:18px;margin:0}.outgoing{display:grid;gap:8px;min-height:90px}.empty{border:1px dashed #35516f;color:var(--muted);border-radius:12px;padding:24px 12px;text-align:center}.trade-player{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;background:#091522;border:1px solid #1e3652;border-radius:12px;padding:8px}.trade-player img{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#15243a}.remove{border:0;background:#3a1722;color:#ff9daa;border-radius:8px;width:32px;height:32px;cursor:pointer}.totals{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--muted);font-size:12px}.totals b{display:block;color:#fff;font-size:17px}.summary{padding:15px}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.summary-card{background:#091522;border:1px solid #1d3550;border-radius:12px;padding:12px}.summary-card h3{margin:0 0 8px;font-size:15px}.delta{font-size:12px;color:var(--muted)}.positive{color:var(--good)}.negative{color:var(--danger)}.save-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.save-modal.show{display:flex}.modal{width:min(520px,100%);padding:18px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{padding:10px;border-radius:10px;background:#12263d;color:var(--muted);font-size:13px;margin-top:10px}.toast{position:fixed;right:16px;bottom:16px;background:#fff;color:#08111d;padding:11px 14px;border-radius:10px;font-weight:800;box-shadow:var(--shadow);transform:translateY(120px);transition:.25s;z-index:8}.toast.show{transform:translateY(0)}.loading{padding:28px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.browser{position:relative;height:540px;top:auto}.teams-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}@media(min-width:1200px){.teams-grid.cols-3{grid-template-columns:repeat(3,1fr)}.teams-grid.cols-4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="ball">🏀</div><div><h1>NBA Trade Lab</h1><div class="subtitle">Build fictional NBA trades using ESPN roster data</div></div></div><div class="actions"><button class="btn good" id="saveBtn">Save to Supabase</button><button class="btn" id="loadBtn">Load Save</button><button class="btn danger" id="resetBtn">Reset</button></div></header>
<div class="layout">
<aside class="panel browser"><div class="control-row"><select id="browseTeam"></select><button class="btn" id="refreshBtn" title="Refresh ESPN data">↻</button></div><input id="search" placeholder="Search roster…" autocomplete="off"><div id="teamHead" class="team-head"></div><div id="playerList" class="player-list"><div class="loading">Loading NBA teams…</div></div></aside>
<main class="workspace"><section class="panel trade-toolbar"><div><strong>Trade participants</strong><div class="subtitle">Select 2–4 teams, then add outgoing players.</div></div><div class="team-count" id="teamCount"></div></section><section id="teamsGrid" class="teams-grid"></section><section class="panel summary"><h2 style="margin-top:0">Trade Snapshot</h2><div id="summaryGrid" class="summary-grid"></div><div class="notice">This is a fictional roster sandbox, not an NBA salary-cap validator. ESPN endpoints are unofficial and may change.</div></section></main>
</div></div>
<div id="saveModal" class="save-modal"><div class="panel modal"><h2 id="modalTitle">Save Trade</h2><div id="saveFields"></div><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="confirmModal">Continue</button></div></div></div><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://jadyqyrpgcmaixroizov.supabase.co';
const SUPABASE_KEY='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ESPN='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const WEB='https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';
const FALLBACK_HEAD='https://a.espncdn.com/i/headshots/nba/players/full/1.png';
const $=s=>document.querySelector(s);
const state={teams:[],teamCount:2,participants:[],rosters:{},trade:{},query:'',browseTeamId:null,saveCode:null,title:'Untitled Trade'};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function safeImg(img,fallback=''){img.onerror=()=>{img.onerror=null;img.src=fallback||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="%2317283c"/></svg>'}}
function teamLogo(t){return t?.logos?.[0]?.href||`https://a.espncdn.com/i/teamlogos/nba/500/${(t?.abbreviation||'nba').toLowerCase()}.png`}
function normalizeTeam(raw){const t=raw.team||raw;return{id:String(t.id),name:t.displayName||t.name,short:t.shortDisplayName||t.nickname,abbreviation:t.abbreviation||'',color:t.color||'243b57',logos:t.logos||[]}}
function statVal(obj,keys){for(const k of keys){const v=obj?.[k];if(v!==undefined&&v!==null&&!Number.isNaN(Number(v)))return Number(v)}return 0}
function parseStats(raw){const stats=raw?.statistics||raw?.stats||raw?.athlete?.statistics||[];let map={};const scan=x=>{if(!x)return;if(Array.isArray(x)){x.forEach(scan);return}if(typeof x==='object'){if(x.name&&x.value!==undefined)map[x.name]=x.value;if(x.abbreviation&&x.value!==undefined)map[x.abbreviation]=x.value;if(x.displayName&&x.value!==undefined)map[x.displayName]=x.value;Object.values(x).forEach(v=>{if(typeof v==='object')scan(v)})}};scan(stats);return{ppg:statVal(map,['avgPoints','pointsPerGame','PPG','PTS','Points Per Game']),rpg:statVal(map,['avgRebounds','reboundsPerGame','RPG','REB','Rebounds Per Game']),apg:statVal(map,['avgAssists','assistsPerGame','APG','AST','Assists Per Game'])}}
function normalizePlayer(a,teamId){const athlete=a.athlete||a;const stats=parseStats(a);return{id:String(athlete.id),teamId,name:athlete.fullName||athlete.displayName||athlete.shortName||'Unknown Player',position:athlete.position?.abbreviation||athlete.position?.name||'',jersey:athlete.jersey||'',headshot:athlete.headshot?.href||`https://a.espncdn.com/i/headshots/nba/players/full/${athlete.id}.png`,ppg:stats.ppg,rpg:stats.rpg,apg:stats.apg,statsLoaded:stats.ppg+stats.rpg+stats.apg>0}}
async function fetchJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
async function loadTeams(){try{const data=await fetchJSON(`${ESPN}/teams?limit=100`);const items=data?.sports?.[0]?.leagues?.[0]?.teams||data?.teams||[];state.teams=items.map(normalizeTeam).sort((a,b)=>a.name.localeCompare(b.name));if(!state.teams.length)throw new Error('No teams returned');const defaults=['7','13','17','2'];state.participants=defaults.slice(0,state.teamCount).filter(id=>state.teams.some(t=>t.id===id));while(state.participants.length<state.teamCount)state.participants.push(state.teams.find(t=>!state.participants.includes(t.id)).id);state.browseTeamId=state.participants[0];renderAll();await loadRoster(state.browseTeamId)}catch(e){console.error(e);$('#playerList').innerHTML='<div class="empty">Could not load ESPN teams. Try refresh.</div>'}}
async function loadRoster(teamId,force=false){if(state.rosters[teamId]&&!force){renderBrowser();return}$('#playerList').innerHTML='<div class="loading">Loading roster…</div>';try{const data=await fetchJSON(`${ESPN}/teams/${teamId}/roster`);let groups=data?.athletes||data?.team?.athletes||[];let rows=[];if(Array.isArray(groups)){for(const g of groups){if(Array.isArray(g?.items))rows.push(...g.items);else if(g?.athlete||g?.id)rows.push(g)}}state.rosters[teamId]=rows.map(x=>normalizePlayer(x,teamId)).sort((a,b)=>a.name.localeCompare(b.name));renderBrowser()}catch(e){console.error(e);$('#playerList').innerHTML='<div class="empty">Roster unavailable. ESPN may be blocking this request.</div>'}}
async function hydrateStats(player){if(player.statsLoaded)return player;try{const data=await fetchJSON(`${WEB}/athletes/${player.id}/overview`);const s=parseStats(data);player.ppg=s.ppg;player.rpg=s.rpg;player.apg=s.apg;player.statsLoaded=true;renderAll();persistLocal()}catch(e){console.warn('Stats unavailable',player.name,e)}return player}
function renderAll(){renderTeamSelect();renderTeamCount();renderTradeTeams();renderBrowser();renderSummary();persistLocal()}
function renderTeamSelect(){const sel=$('#browseTeam');sel.innerHTML=state.teams.map(t=>`<option value="${t.id}" ${t.id===state.browseTeamId?'selected':''}>${t.name}</option>`).join('')}
function renderTeamCount(){const el=$('#teamCount');el.innerHTML=[2,3,4].map(n=>`<button class="pill ${n===state.teamCount?'active':''}" data-count="${n}">${n} teams</button>`).join('')}
function rosterPlayerById(id){for(const r of Object.values(state.rosters)){const p=r.find(x=>x.id===id);if(p)return p}return null}
function selectedIds(){return new Set(Object.values(state.trade).flat())}
function renderBrowser(){if(!state.teams.length)return;const team=state.teams.find(t=>t.id===state.browseTeamId);$('#teamHead').innerHTML=`<img src="${teamLogo(team)}"><div><strong>${team.name}</strong><div class="meta">Select players to include</div></div>`;const roster=state.rosters[state.browseTeamId]||[];const q=state.query.toLowerCase();const used=selectedIds();const filtered=roster.filter(p=>p.name.toLowerCase().includes(q)||p.position.toLowerCase().includes(q));$('#playerList').innerHTML=filtered.length?filtered.map(p=>`<div class="player-card"><img src="${p.headshot}" onerror="safeImg(this)"><div><div class="player-name">${p.name}</div><div class="meta">${p.position}${p.jersey?' • #'+p.jersey:''}</div><div class="mini-stats"><span><b>${p.ppg.toFixed(1)}</b> PTS</span><span><b>${p.rpg.toFixed(1)}</b> REB</span><span><b>${p.apg.toFixed(1)}</b> AST</span></div></div><button class="add" data-player="${p.id}" ${used.has(p.id)?'disabled style="opacity:.35"':''}>+</button></div>`).join(''):'<div class="empty">No matching players.</div>'}
function ensureTradeKeys(){state.participants.forEach(id=>state.trade[id]??=[]);Object.keys(state.trade).forEach(id=>{if(!state.participants.includes(id))delete state.trade[id]})}
function renderTradeTeams(){ensureTradeKeys();const grid=$('#teamsGrid');grid.className=`teams-grid cols-${state.teamCount}`;grid.innerHTML=state.participants.map((id,index)=>{const t=state.teams.find(x=>x.id===id);const ids=state.trade[id]||[];const players=ids.map(rosterPlayerById).filter(Boolean);const total=players.reduce((a,p)=>({ppg:a.ppg+p.ppg,rpg:a.rpg+p.rpg,apg:a.apg+p.apg}),{ppg:0,rpg:0,apg:0});return`<article class="panel trade-team"><div class="trade-team-header"><img src="${teamLogo(t)}"><div><h2>${t.name}</h2><div class="meta">Sending ${players.length} player${players.length===1?'':'s'}</div></div><select class="participant-select" data-index="${index}">${state.teams.map(opt=>`<option value="${opt.id}" ${opt.id===id?'selected':''} ${state.participants.includes(opt.id)&&opt.id!==id?'disabled':''}>${opt.short}</option>`).join('')}</select></div><div class="outgoing">${players.length?players.map(p=>`<div class="trade-player"><img src="${p.headshot}" onerror="safeImg(this)"><div><strong>${p.name}</strong><div class="meta">${p.position} • ${p.ppg.toFixed(1)} PTS • ${p.rpg.toFixed(1)} REB • ${p.apg.toFixed(1)} AST</div></div><button class="remove" data-team="${id}" data-player="${p.id}">×</button></div>`).join(''):'<div class="empty">Add outgoing players from the roster browser.</div>'}</div><div class="totals"><span><b>${total.ppg.toFixed(1)}</b>PTS out</span><span><b>${total.rpg.toFixed(1)}</b>REB out</span><span><b>${total.apg.toFixed(1)}</b>AST out</span></div></article>`}).join('')}
function renderSummary(){ensureTradeKeys();const incoming={};state.participants.forEach(id=>incoming[id]=[]);state.participants.forEach((from,i)=>{const to=state.participants[(i+1)%state.participants.length];(state.trade[from]||[]).forEach(pid=>{const p=rosterPlayerById(pid);if(p)incoming[to].push(p)})});$('#summaryGrid').innerHTML=state.participants.map(id=>{const t=state.teams.find(x=>x.id===id);const outgoing=(state.trade[id]||[]).map(rosterPlayerById).filter(Boolean);const inc=incoming[id];const sum=arr=>arr.reduce((a,p)=>({p:a.p+p.ppg,r:a.r+p.rpg,a:a.a+p.apg}),{p:0,r:0,a:0});const o=sum(outgoing),n=sum(inc);const d={p:n.p-o.p,r:n.r-o.r,a:n.a-o.a};const fmt=v=>`<span class="${v>=0?'positive':'negative'}">${v>=0?'+':''}${v.toFixed(1)}</span>`;return`<div class="summary-card"><h3>${t.abbreviation}: receives ${inc.length}</h3><div class="meta">${inc.length?inc.map(p=>p.name).join(', '):'No incoming players yet'}</div><div class="delta">Net: ${fmt(d.p)} PTS · ${fmt(d.r)} REB · ${fmt(d.a)} AST</div></div>`}).join('')}
function addPlayer(id){const p=rosterPlayerById(id);if(!p)return;if(!state.participants.includes(p.teamId)){toast('Add that player’s team as a participant first');return}if(selectedIds().has(id))return;state.trade[p.teamId]??=[];state.trade[p.teamId].push(id);hydrateStats(p);renderAll()}
function removePlayer(teamId,id){state.trade[teamId]=(state.trade[teamId]||[]).filter(x=>x!==id);renderAll()}
function setTeamCount(n){state.teamCount=n;while(state.participants.length<n){const next=state.teams.find(t=>!state.participants.includes(t.id));if(next)state.participants.push(next.id)}if(state.participants.length>n)state.participants=state.participants.slice(0,n);renderAll()}
function changeParticipant(index,newId){const old=state.participants[index];state.participants[index]=newId;if(state.trade[old]?.length){state.trade[newId]=(state.trade[newId]||[]).concat(state.trade[old]);delete state.trade[old]}state.browseTeamId=newId;renderAll();loadRoster(newId)}
function snapshot(){return{version:1,teamCount:state.teamCount,participants:state.participants,trade:state.trade,rosters:state.rosters,title:state.title,savedAt:new Date().toISOString()}}
function persistLocal(){localStorage.setItem('nbaTradeLab',JSON.stringify(snapshot()))}
function restoreLocal(){try{const x=JSON.parse(localStorage.getItem('nbaTradeLab'));if(!x)return false;Object.assign(state,{teamCount:x.teamCount||2,participants:x.participants||[],trade:x.trade||{},rosters:x.rosters||{},title:x.title||'Untitled Trade'});return true}catch{return false}}
function reset(){state.teamCount=2;state.participants=state.teams.slice(0,2).map(t=>t.id);state.trade={};state.saveCode=null;state.title='Untitled Trade';state.browseTeamId=state.participants[0];localStorage.removeItem('nbaTradeLab');renderAll();loadRoster(state.browseTeamId);toast('Trade reset')}
function code(){return crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase()}
function showModal(mode){const modal=$('#saveModal'),fields=$('#saveFields');modal.dataset.mode=mode;$('#modalTitle').textContent=mode==='save'?'Save Trade':'Load Trade';fields.innerHTML=mode==='save'?`<label>Trade name</label><input id="tradeTitle" value="${state.title.replaceAll('"','&quot;')}"><label style="display:block;margin-top:10px">Save code</label><input id="tradeCode" value="${state.saveCode||code()}" maxlength="32"><div class="notice">Keep this code to reopen the trade on another device.</div>`:`<label>Save code</label><input id="tradeCode" placeholder="Example: A1B2C3D4E5" maxlength="32">`;modal.classList.add('show');setTimeout(()=>$('#tradeCode')?.focus(),50)}
async function saveTrade(){const title=$('#tradeTitle').value.trim()||'Untitled Trade';const saveCode=$('#tradeCode').value.trim().toUpperCase();if(saveCode.length<6){toast('Save code must be at least 6 characters');return}const payload={save_code:saveCode,title,trade_data:snapshot()};const {error}=await db.from('nba_trade_saves').upsert(payload,{onConflict:'save_code'});if(error){console.error(error);toast('Save failed: '+error.message);return}state.saveCode=saveCode;state.title=title;$('#saveModal').classList.remove('show');toast(`Saved as ${saveCode}`)}
async function loadTrade(){const saveCode=$('#tradeCode').value.trim().toUpperCase();const {data,error}=await db.from('nba_trade_saves').select('*').eq('save_code',saveCode).maybeSingle();if(error||!data){toast(error?.message||'Save not found');return}const x=data.trade_data||{};Object.assign(state,{teamCount:x.teamCount||2,participants:x.participants||[],trade:x.trade||{},rosters:x.rosters||{},title:data.title||x.title||'Untitled Trade',saveCode:data.save_code});state.browseTeamId=state.participants[0];$('#saveModal').classList.remove('show');renderAll();await loadRoster(state.browseTeamId);toast(`Loaded ${data.title}`)}
document.addEventListener('click',e=>{const add=e.target.closest('[data-player].add');if(add)addPlayer(add.dataset.player);const rem=e.target.closest('.remove');if(rem)removePlayer(rem.dataset.team,rem.dataset.player);const count=e.target.closest('[data-count]');if(count)setTeamCount(Number(count.dataset.count))});
$('#browseTeam').addEventListener('change',e=>{state.browseTeamId=e.target.value;renderBrowser();loadRoster(state.browseTeamId)});$('#search').addEventListener('input',e=>{state.query=e.target.value;renderBrowser()});$('#teamsGrid').addEventListener('change',e=>{if(e.target.classList.contains('participant-select'))changeParticipant(Number(e.target.dataset.index),e.target.value)});$('#refreshBtn').onclick=()=>loadRoster(state.browseTeamId,true);$('#resetBtn').onclick=()=>confirm('Reset the entire fictional trade?')&&reset();$('#saveBtn').onclick=()=>showModal('save');$('#loadBtn').onclick=()=>showModal('load');$('#cancelModal').onclick=()=>$('#saveModal').classList.remove('show');$('#confirmModal').onclick=()=>$('#saveModal').dataset.mode==='save'?saveTrade():loadTrade();$('#saveModal').addEventListener('click',e=>{if(e.target.id==='saveModal')e.currentTarget.classList.remove('show')});
(async()=>{const hadLocal=restoreLocal();await loadTeams();if(hadLocal){state.browseTeamId=state.participants[0];renderAll();await loadRoster(state.browseTeamId)}})();
</script>
</body>
</html>
