name: Fix BGA Metadata Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bga-metadata-layout.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix crosswalk layout
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [Path('bga-metadata-media.html'), Path('public/bga-metadata-media.html')]
          for p in paths:
              s = p.read_text()
              s = s.replace(
                  '.crosswalk{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.grid-head,.lane{display:grid;grid-template-columns:minmax(270px,.9fr) 56px minmax(310px,1fr) 56px minmax(360px,1.15fr);align-items:stretch}.grid-head{position:sticky;top:108px;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.headcell{padding:12px 14px}',
                  '.crosswalk{isolation:isolate;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.grid-head,.lane{display:grid;grid-template-columns:minmax(270px,.9fr) 38px minmax(310px,1fr) 38px minmax(360px,1.15fr);align-items:stretch}.grid-head{position:relative;z-index:2;background:#f8fafc;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,23,42,.02)}.headcell{padding:13px 14px}'
              )
              s = s.replace(
                  '.connector-head{background:#fbfcfe}',
                  ".connector-head{background:#f8fafc;position:relative}.connector-head:after{content:'→';position:absolute;inset:0;display:grid;place-items:center;color:#98a7ba;font-size:14px;font-weight:800}"
              )
              s = s.replace(
                  '.lanes{display:grid}.lane{position:relative;min-height:148px;border-bottom:1px solid var(--line)}',
                  '.lanes{display:grid}.lane{position:relative;min-height:156px;border-bottom:1px solid var(--line)}'
              )
              s = s.replace(
                  '.cell{padding:12px 14px;display:flex;align-items:center}',
                  '.cell{padding:14px;display:flex;align-items:center;min-width:0}'
              )
              s = s.replace(
                  '@media(max-width:1100px){.grid-head,.lane{grid-template-columns:minmax(230px,.9fr) 36px minmax(250px,1fr) 36px minmax(300px,1.1fr)}',
                  '@media(max-width:1100px){.grid-head,.lane{grid-template-columns:minmax(230px,.9fr) 30px minmax(250px,1fr) 30px minmax(300px,1.1fr)}'
              )
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bga-metadata-media.html public/bga-metadata-media.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix BGA metadata crosswalk header overlap'
          git push
