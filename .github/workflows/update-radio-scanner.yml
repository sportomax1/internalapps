name: Update radio scanner and station icons

on:
  push:
    paths:
      - '.github/workflows/update-radio-scanner.yml'

permissions:
  contents: write

jobs:
  patch-radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch radio page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/colorado-radio/index.html')
          s = p.read_text()

          def replace(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing patch target: {label}')
              s = s.replace(old, new)

          replace('.station{display:grid;grid-template-columns:72px minmax(0,1fr) auto;', '.station{display:grid;grid-template-columns:88px minmax(0,1fr) auto;', 'station grid')
          replace('.freq{font-size:19px;font-weight:950}', '.stationIdentity{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center}.stationIcon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#69b7ff33,#8ee6c833);border:1px solid var(--line)}.freq{font-size:19px;font-weight:950}', 'station icon CSS')
          replace('.settings{padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}', '.settings{padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.scannerProgress{min-width:240px;display:flex;align-items:center;gap:9px}.scannerBar{width:110px;height:7px;border-radius:999px;background:#ffffff12;overflow:hidden}.scannerFill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .2s linear}', 'scanner CSS')
          replace('<span id="scannerState" class="count">Scanner off</span>', '<div class="scannerProgress"><span id="scannerState" class="count">Scanner off</span><div class="scannerBar"><div id="scannerFill" class="scannerFill"></div></div></div>', 'scanner UI')
          replace('let scannerTimer=null,scannerIndex=-1,lastRandom=-1,audioContext=null,analyserTimer=null,silenceStarted=0;', 'let scannerTimer=null,scannerCountdownTimer=null,scannerRunning=false,scannerIndex=-1,lastRandom=-1,audioContext=null,analyserTimer=null,silenceStarted=0;', 'scanner variables')
          replace("isHls=u=>/\\.m3u8($|\\?)/i.test(u||''),setStatus=t=>$('#status').textContent=t;", "isHls=u=>/\\.m3u8($|\\?)/i.test(u||''),setStatus=t=>$('#status').textContent=t;function iconForStation(s={}){const text=`${s.name||''} ${s.category||''} ${s.description||''}`.toLowerCase();if(/koa|news|talk/.test(text))return '📰';if(/altitude|hockey|avalanche/.test(text))return '🏒';if(/csu|rams/.test(text))return '🐏';if(/sports|fan|football|basketball/.test(text))return '🏈';if(/country|kygo|bull/.test(text))return /bull/.test(text)?'🐂':'🤠';if(/alternative|93\\.3/.test(text))return '🤘';if(/classic rock|fox/.test(text))return '🦊';if(/rock|kbco/.test(text))return '🎸';return '📻'}", 'icon function')
          replace('<div class="station"><div><div class="freq">${esc(s.frequency)}</div><div class="band">${esc(s.band)}</div></div><div><div class="name">${esc(s.name)}</div>', '<div class="station"><div class="stationIdentity"><div class="stationIcon">${iconForStation(s)}</div><div><div class="freq">${esc(s.frequency)}</div><div class="band">${esc(s.band)}</div></div></div><div><div class="name">${esc(s.name)}</div>', 'preset icons')
          replace('async function playSolo(s){active.forEach(stopAndDestroy);active.clear();await addChannel(s,true)}', 'async function playSolo(s){active.forEach(stopAndDestroy);active.clear();return await addChannel(s,true)}', 'playSolo return')
          replace('if(active.has(k)){if(autoplay)await active.get(k).audio.play();return}', 'if(active.has(k)){if(autoplay)await active.get(k).audio.play();return active.get(k)}', 'existing channel return')
          replace('if(autoplay){await audio.play();setStatus(`Playing ${s.name}.`)}}catch(e){setStatus(e.message)}}', 'if(autoplay){await audio.play();setStatus(`Playing ${s.name}.`)}return ch}catch(e){setStatus(e.message);return null}}', 'new channel return')
          replace('<div class="channelName">${esc(ch.station.name)}</div>', '<div class="channelName">${iconForStation(ch.station)} ${esc(ch.station.name)}</div>', 'mixer icon')
          replace("${s.logo?`<img src=\"${esc(s.logo)}\">`:'<div></div>'}", "${s.logo?`<img src=\"${esc(s.logo)}\">`:`<div class=\"stationIcon\">${iconForStation(s)}</div>`}", 'search icon')

          start = s.index('async function scanNext()')
          end = s.index('function startAudioHeuristic', start)
          scanner = """function waitForPlayback(audio,timeout=9000){return new Promise(resolve=>{if(!audio)return resolve(false);if(!audio.paused&&audio.readyState>=2)return resolve(true);let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(timer);audio.removeEventListener('playing',ok);audio.removeEventListener('error',bad);resolve(v)};const ok=()=>finish(true),bad=()=>finish(false),timer=setTimeout(()=>finish(false),timeout);audio.addEventListener('playing',ok,{once:true});audio.addEventListener('error',bad,{once:true})})}function scheduleScannerCountdown(station){clearInterval(scannerCountdownTimer);const total=+$('#scanInterval').value;let left=total;const update=()=>{$('#scannerState').textContent=`${iconForStation(station)} ${scannerIndex+1}/${PRESETS.length} • next in ${left}s`;$('#scannerFill').style.width=`${Math.max(0,(total-left)/total)*100}%`};update();scannerCountdownTimer=setInterval(()=>{left--;update();if(left<=0){clearInterval(scannerCountdownTimer);scannerCountdownTimer=null;scanNext()}},1000)}async function scanNext(){if(!scannerRunning)return;clearTimeout(scannerTimer);clearInterval(scannerCountdownTimer);scannerCountdownTimer=null;scannerIndex=(scannerIndex+1)%PRESETS.length;const station=PRESETS[scannerIndex];$('#scannerState').textContent=`⏳ ${scannerIndex+1}/${PRESETS.length} • connecting ${station.name}`;$('#scannerFill').style.width='0%';setStatus(`Scanner connecting to ${station.name}…`);const ch=await playSolo(station);if(!scannerRunning)return;const started=await waitForPlayback(ch?.audio,9000);if(!scannerRunning)return;if(!started){$('#scannerState').textContent=`⚠️ Skipped ${station.name}`;setStatus(`${station.name} did not begin playing in time. Scanner is skipping it.`);scannerTimer=setTimeout(scanNext,1200);return}setStatus(`Scanner playing ${station.name}.`);scheduleScannerCountdown(station)}function startScanner(){if(scannerRunning)return;scannerRunning=true;$('#scannerBtn').classList.add('active');$('#scannerBtn').textContent='📡 Stop scanner';scannerIndex=-1;scanNext()}function stopScanner(){scannerRunning=false;clearTimeout(scannerTimer);clearInterval(scannerCountdownTimer);scannerTimer=null;scannerCountdownTimer=null;$('#scannerBtn').classList.remove('active');$('#scannerBtn').textContent='📡 Scanner';$('#scannerState').textContent='Scanner off';$('#scannerFill').style.width='0%'}function toggleScanner(){scannerRunning?stopScanner():startScanner()}"""
          s = s[:start] + scanner + s[end:]
          replace("$('#scannerBtn').onclick=()=>scannerTimer?stopScanner():startScanner();", "$('#scannerBtn').onclick=toggleScanner;", 'scanner button')
          replace("$('#nextScanBtn').onclick=scanNext;", "$('#nextScanBtn').onclick=()=>{if(!scannerRunning)startScanner();else scanNext()};", 'next button')
          replace("$('#scanInterval').onchange=()=>{if(scannerTimer){stopScanner();startScanner()}};", "$('#scanInterval').onchange=()=>{if(scannerRunning){const station=PRESETS[scannerIndex];if(station)scheduleScannerCountdown(station)}};", 'interval change')

          p.write_text(s)
          PY
      - name: Commit updated radio page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/colorado-radio/index.html
          git commit -m "Fix radio scanner and add station icons"
          git push
