name: One-time Colorado Radio senior redesign
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-radio-senior-redesign.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Redesign app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/colorado-radio/index.html')
          s=p.read_text()
          css='''
:root{
  --bg:#08111f;--panel:#101b2b;--panel-2:#0d1726;--panel-3:#152238;
  --text:#f5f8fc;--muted:#96a5b8;--line:#223148;--accent:#5aa7ff;
  --accent-2:#7ee2c5;--danger:#ff6f7d;--warning:#ffc857;--success:#63d795;
  --shadow:0 20px 50px rgba(0,0,0,.28);--radius:20px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{background:
  radial-gradient(circle at 85% -10%,rgba(90,167,255,.14),transparent 34rem),
  radial-gradient(circle at 0 15%,rgba(126,226,197,.08),transparent 30rem),
  var(--bg)}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.shell{width:min(1240px,100%);margin:auto;display:grid;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#06111f;box-shadow:0 10px 26px rgba(90,167,255,.22)}
h1{margin:0;font-size:clamp(23px,3.4vw,36px);letter-spacing:-.04em}
.sub{margin-top:3px;color:var(--muted);font-size:13px}
.statusPill{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:var(--muted);font-size:12px;white-space:nowrap}
.statusDot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(99,215,149,.12)}
.card{background:linear-gradient(180deg,rgba(18,31,50,.98),rgba(13,23,38,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.commandBar{padding:12px;display:grid;grid-template-columns:minmax(240px,1fr) auto auto auto auto auto;gap:9px;position:sticky;top:10px;z-index:10;backdrop-filter:blur(18px)}
.searchWrap{position:relative}
.searchIcon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search{width:100%;min-height:46px;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:14px;background:#091321;color:var(--text);outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,167,255,.12)}
.btn{min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#152238;color:var(--text);font-weight:750;cursor:pointer;transition:.18s ease}
.btn:hover{transform:translateY(-1px);background:#1b2b45}
.btn:active{transform:none}
.btn.primary{border-color:transparent;background:var(--accent);color:#07111f}
.btn.danger{color:#ffd9dd;background:rgba(255,111,125,.09);border-color:rgba(255,111,125,.22)}
.btn.active{background:rgba(99,215,149,.14);border-color:rgba(99,215,149,.4);color:#bff4d3}
.settings{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 15px}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.toggle input{accent-color:var(--accent)}
.select{padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#0a1524;color:var(--text)}
.scannerProgress{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:265px}
.scannerBar{flex:1;height:6px;background:#0a1422;border-radius:999px;overflow:hidden}
.scannerFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s linear}
.status{padding:10px 14px;color:var(--muted);font-size:12px;border-left:3px solid var(--accent)}
.nowPlaying{padding:18px;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;align-items:center;overflow:hidden;position:relative}
.nowPlaying:after{content:"";position:absolute;inset:auto -80px -100px auto;width:220px;height:220px;border-radius:50%;background:rgba(90,167,255,.08);pointer-events:none}
.nowArt{width:96px;height:96px;border-radius:22px;display:grid;place-items:center;font-size:42px;background:#0b1625;border:1px solid var(--line);object-fit:cover}
.nowLabel,.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:900}
.nowTitle{font-size:clamp(23px,3.5vw,36px);font-weight:950;line-height:1.08;letter-spacing:-.03em;margin-top:5px}
.nowSub{color:var(--muted);font-size:14px;margin-top:7px}
.metaBadge{align-self:start;padding:7px 10px;border-radius:999px;background:#0b1625;border:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap}
.mainGrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);gap:18px;align-items:start}
.section{padding:16px;display:grid;gap:13px}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px}
.sectionHead h2{margin:0;font-size:18px;letter-spacing:-.02em}
.sectionHead p{margin:3px 0 0;color:var(--muted);font-size:12px}
.count{color:var(--muted);font-size:12px;white-space:nowrap}
.stationGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.station{min-width:0;padding:14px;border:1px solid var(--line);border-radius:18px;background:#0c1726;display:grid;gap:13px;transition:.18s ease}
.station:hover{border-color:#324765;transform:translateY(-1px)}
.stationTop{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center}
.stationIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:#15243a;border:1px solid #2a3a51}
.stationName{font-weight:900;line-height:1.12}
.stationFreq{margin-top:4px;color:var(--muted);font-size:12px}
.liveChip{padding:6px 8px;border-radius:999px;background:rgba(99,215,149,.11);color:#aef0c8;font-size:10px;font-weight:900;letter-spacing:.05em}
.stationMeta{min-height:52px;padding:10px 11px;border-radius:13px;background:#091321;border:1px solid #19283c}
.stationMetaTitle{font-weight:800;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stationMetaSub{margin-top:4px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stationMeta.loading .stationMetaTitle{color:var(--muted);font-weight:650}
.stationActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stationActions .btn{min-height:40px;padding:8px 10px;font-size:12px}
.mixer,.results{display:grid;gap:10px}
.channel{padding:13px;border:1px solid var(--line);border-radius:17px;background:#0c1726;display:grid;gap:11px}
.channelTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.channelName{font-weight:900}
.desc{color:var(--muted);font-size:11px;margin-top:3px}
.live{padding:5px 8px;border-radius:999px;background:rgba(99,215,149,.1);color:#aef0c8;font-size:10px;font-weight:900}
.channelMeta{margin-top:8px;padding:9px 10px;border:1px solid #1a293e;border-radius:12px;background:#091321}
.channelMetaTitle{font-size:13px;font-weight:850}
.channelMetaSub{margin-top:3px;color:var(--muted);font-size:11px}
.channelControls{display:grid;grid-template-columns:auto auto auto 1fr auto auto;gap:7px;align-items:center}
.channelControls .btn{min-height:38px;padding:7px 9px;font-size:11px}
.channelControls input{width:100%;accent-color:var(--accent)}
audio{display:none}
.secondaryStack{display:grid;gap:18px}
.captionTools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.captionTools .btn{min-height:40px;font-size:12px}
.captionBox{min-height:138px;padding:15px;border-radius:15px;background:#07101c;border:1px solid #17263a;font-size:clamp(18px,2.2vw,26px);line-height:1.5}
.captionHint{font-size:11px;color:var(--muted);line-height:1.5}
.result{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:15px;background:#0c1726}
.result img{width:48px;height:48px;border-radius:13px;object-fit:cover}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #2b3c55;border-radius:16px;background:#0a1422}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:2px 8px}
@media(max-width:980px){
  .commandBar{grid-template-columns:1fr repeat(3,auto);position:static}.commandBar .searchWrap{grid-column:1/-1}
  .mainGrid{grid-template-columns:1fr}.stationGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:680px){
  .app{padding:10px 10px calc(18px + env(safe-area-inset-bottom))}
  .topbar{align-items:flex-start}.statusPill{display:none}
  .logo{width:42px;height:42px;border-radius:13px}
  .commandBar{grid-template-columns:repeat(3,1fr);padding:9px;gap:7px}
  .commandBar .searchWrap{grid-column:1/-1}.commandBar .btn{padding:9px 8px;font-size:12px}
  #stopAllBtn{grid-column:span 3}
  .settings{gap:10px}.scannerProgress{order:3;width:100%;min-width:0;margin-left:0}
  .nowPlaying{grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px}
  .nowArt{width:64px;height:64px;border-radius:17px;font-size:30px}.metaBadge{grid-column:1/-1;justify-self:start}
  .stationGrid{grid-template-columns:1fr}
  .section{padding:12px}.station{padding:12px}
  .channelControls{grid-template-columns:repeat(3,1fr)}.channelControls input{grid-column:1/-1}
  .captionTools>*{flex:1 1 auto}
}
'''
          body='''
<body><main class="app"><div class="shell">
<header class="topbar">
  <div class="brand"><div class="logo">📻</div><div><h1>Colorado Radio</h1><div class="sub">Live stations, scanner, mixer, captions and now playing</div></div></div>
  <div class="statusPill"><span class="statusDot"></span><span>Live station directory</span></div>
</header>
<section class="card commandBar">
  <div class="searchWrap"><span class="searchIcon">⌕</span><input id="searchInput" class="search" type="search" placeholder="Search stations, cities, frequencies or genres…"></div>
  <button id="searchBtn" class="btn primary">Search</button>
  <button id="randomBtn" class="btn">🎲 Random</button>
  <button id="scannerBtn" class="btn">📡 Scanner</button>
  <button id="nextScanBtn" class="btn">⏭ Next</button>
  <button id="stopAllBtn" class="btn danger">Stop all</button>
</section>
<section class="card settings">
  <label class="toggle"><input id="autoAdSwitch" type="checkbox"> Auto-skip extended silence</label>
  <label class="toggle">Scanner interval <select id="scanInterval" class="select"><option value="8">8 sec</option><option value="12" selected>12 sec</option><option value="20">20 sec</option><option value="30">30 sec</option></select></label>
  <div class="scannerProgress"><span id="scannerState" class="count">Scanner off</span><div class="scannerBar"><div id="scannerFill" class="scannerFill"></div></div></div>
</section>
<div id="status" class="card status">Choose a station, start the scanner, or search nationwide.</div>
<section id="nowPlayingCard" class="card nowPlaying">
  <div id="nowArt" class="nowArt">📻</div>
  <div><div class="nowLabel">Now playing</div><div id="nowTitle" class="nowTitle">Choose a station</div><div id="nowSub" class="nowSub">Song, artist, show or station information will appear here when available.</div></div>
  <div id="nowSource" class="metaBadge">Waiting</div>
</section>
<section class="mainGrid">
  <div class="card section">
    <div class="sectionHead"><div><h2>Colorado stations</h2><p>Now playing refreshes automatically for every preset.</p></div><span id="presetCount" class="count"></span></div>
    <div id="presetList" class="stationGrid"></div>
  </div>
  <div class="secondaryStack">
    <div class="card section"><div class="sectionHead"><div><h2>Active mixer</h2><p>Play one station or layer multiple streams.</p></div><span id="mixerCount" class="count">0 active</span></div><div id="mixer" class="mixer"><div class="empty">No active streams.</div></div></div>
    <div class="card section"><div class="sectionHead"><div><h2>Live captions</h2><p>Browser-only local transcription.</p></div><span id="captionState" class="count">Off</span></div><div class="captionTools"><button id="tabCaptionBtn" class="btn primary">Share tab audio + captions</button><button id="directCaptionBtn" class="btn">Caption active station</button><label class="toggle">Words <select id="captionLimit" class="select"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label><label class="toggle">Chunk <select id="captionSeconds" class="select"><option value="5">5 sec</option><option value="8" selected>8 sec</option><option value="12">12 sec</option></select></label><button id="clearCaptions" class="btn">Clear</button></div><div id="captionBox" class="captionBox" aria-live="polite">Play a station, then start captions.</div><div class="captionHint">Shared-tab capture is most reliable in desktop Chrome or Edge. No transcript is stored.</div></div>
  </div>
</section>
<section class="card section"><div class="sectionHead"><div><h2>Search results</h2><p>Nationwide iHeart station search.</p></div><span id="resultCount" class="count">Search nationwide</span></div><div id="results" class="results"><div class="empty">Try “Denver”, “sports”, “classic rock” or a call sign.</div></div></section>
<div class="footer">Metadata depends on what each broadcaster exposes. Some talk and sports streams provide only station or program information.</div>
</div></main>
'''
          s=re.sub(r'<style>.*?</style>', '<style>'+css+'</style>', s, count=1, flags=re.S)
          s=re.sub(r'<body>.*?<script>', body+'<script>', s, count=1, flags=re.S)

          start=s.index('function renderPresets(){')
          end=s.index('function stopAndDestroy', start)
          new_render=r'''function presetMetaMarkup(s){
            const m=liveMeta.get(keyFor(s));
            if(m)return `<div class="stationMeta"><div class="stationMetaTitle">${esc(m.title||s.name)}</div><div class="stationMetaSub">${esc([m.artist,m.album,m.source].filter(Boolean).join(' • '))}</div></div>`;
            return `<div class="stationMeta loading"><div class="stationMetaTitle">Checking live metadata…</div><div class="stationMetaSub">${esc([s.category,s.area].filter(Boolean).join(' • '))}</div></div>`;
          }
          function renderPresetMetadata(){
            PRESETS.forEach((s,i)=>{
              const holder=document.querySelector(`[data-preset-meta="${i}"]`);
              if(holder)holder.innerHTML=presetMetaMarkup(s);
            });
          }
          function renderPresets(){
            $('#presetCount').textContent=`${PRESETS.length} stations`;
            $('#presetList').innerHTML=PRESETS.map((s,i)=>`<article class="station"><div class="stationTop"><div class="stationIcon">${iconForStation(s)}</div><div><div class="stationName">${esc(s.name)}</div><div class="stationFreq">${esc(s.frequency)} ${esc(s.band)} • ${esc(s.callSign)} • ${esc(s.area)}</div></div><span class="liveChip">LIVE</span></div><div data-preset-meta="${i}">${presetMetaMarkup(s)}</div><div class="stationActions"><button class="btn primary" data-play="${i}">▶ Play</button><button class="btn" data-add="${i}">＋ Mix</button></div></article>`).join('');
            document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playSolo(PRESETS[+b.dataset.play]));
            document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addChannel(PRESETS[+b.dataset.add],true));
          }
          '''
          s=s[:start]+new_render+s[end:]

          old="liveMeta.set(keyFor(station),clean);renderNowPlaying();renderMixer()"
          s=s.replace(old,"liveMeta.set(keyFor(station),clean);renderNowPlaying();renderMixer();renderPresetMetadata()",1)

          start=s.index('function refreshLiveMetadata(){')
          end=s.index('function presetMetaMarkup', start)
          new_refresh=r'''async function fetchIcyMeta(station){
            if(!station?.stream||station.iheartId)return;
            try{
              const r=await fetch(station.stream,{headers:{'Icy-MetaData':'1'},cache:'no-store'});
              const metaint=Number(r.headers.get('icy-metaint'));
              if(!r.ok||!metaint||!r.body)return;
              const reader=r.body.getReader();let received=0,buf=new Uint8Array(0);
              while(received<metaint+4096){
                const {value,done}=await reader.read();if(done)break;
                const next=new Uint8Array(buf.length+value.length);next.set(buf);next.set(value,buf.length);buf=next;received=buf.length;
              }
              reader.cancel();
              if(buf.length<=metaint)return;
              const len=buf[metaint]*16;
              const text=new TextDecoder().decode(buf.slice(metaint+1,metaint+1+len)).replace(/\0/g,'');
              const m=text.match(/StreamTitle='([^']*)'/i);
              if(!m?.[1])return;
              const parts=m[1].split(/\s+-\s+/);
              setLiveMeta(station,parts.length>1?{artist:parts.shift(),title:parts.join(' - '),source:'Stream metadata'}:{title:m[1],source:'Stream metadata'});
            }catch{}
          }
          function refreshLiveMetadata(){
            clearInterval(metaTimer);
            const run=()=>{
              PRESETS.forEach(station=>station.iheartId?fetchIHeartMeta(station):fetchIcyMeta(station));
              for(const ch of active.values())attachHlsMetadata(ch);
              renderNowPlaying();renderPresetMetadata();
            };
            run();
            metaTimer=setInterval(run,30000);
          }
          '''
          s=s[:start]+new_refresh+s[end:]

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/colorado-radio/index.html').read_text()
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/radio.js').write_text(js)
          PY
          node --check /tmp/radio.js
      - name: Commit result and remove workflow
        run: |
          rm .github/workflows/one-time-radio-senior-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/colorado-radio/index.html .github/workflows/one-time-radio-senior-redesign.yml
          git commit -m "Redesign Colorado radio UI and refresh all station metadata"
          git push
