name: Wire SFTP Download Tools
on:
  push:
    paths:
      - '.github/workflows/inject-sftp-download-tools.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject download tools before main SFTP script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/sftp/index.html')
          s=p.read_text()
          tag='<script src="/sftp/download-tools.js"></script>'
          if tag not in s:
              marker='<script>\n(()=>{\'use strict\';'
              if marker not in s:
                  raise SystemExit('SFTP main script marker not found')
              s=s.replace(marker, tag+'\n\n'+marker, 1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/sftp/index.html
          git commit -m "Enable SFTP folder ZIP and save-location downloads" || exit 0
          git push
