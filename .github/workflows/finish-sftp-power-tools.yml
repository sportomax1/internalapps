name: Finish SFTP Power Tools
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch explorer and API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/sftp/index.html'); s=p.read_text()
          if '/sftp/power-tools.js' not in s:
              s=s.replace('<script src="/sftp/download-tools.js"></script>','<script src="/sftp/download-tools.js"></script>\n<script src="/sftp/power-tools.js"></script>')
          p.write_text(s)
          p=Path('api/sftp.js'); s=p.read_text()
          s=s.replace("const MUTATION_ACTIONS = new Set(['mkdir', 'write', 'rename', 'delete']);","const MUTATION_ACTIONS = new Set(['mkdir', 'write', 'rename', 'delete', 'copy']);")
          marker="    if (action === 'mkdir') {"
          block="""    if (action === 'copy') {
      const from = mutablePath(req.body?.from);
      const to = mutablePath(req.body?.to);
      await withSftp(auth, id, async (client) => {
        const sourceExists = await client.exists(from);
        if (!sourceExists || sourceExists === 'd') throw httpError('Backup source must be an existing file.', 404, 'SFTP_SOURCE_MISSING');
        if (await client.exists(to)) throw httpError('Backup target already exists.', 409, 'SFTP_TARGET_EXISTS');
        await new Promise((resolve, reject) => {
          const input = client.createReadStream(from);
          const output = client.createWriteStream(to);
          input.on('error', reject); output.on('error', reject); output.on('close', resolve); input.pipe(output);
        });
      });
      console.log(`[sftp:${id}] copy from=${from} to=${to}`);
      return res.status(200).json({ ok: true, action, from, to, requestId: id });
    }

"""
          if "if (action === 'copy')" not in s:s=s.replace(marker,block+marker)
          # automatic pre-overwrite backup
          old="""        if (exists === 'd') {
          throw httpError('Cannot write file contents to a directory.', 400, 'SFTP_WRITE_DIRECTORY');
        }
        await client.put(buffer, target);"""
          new="""        if (exists === 'd') {
          throw httpError('Cannot write file contents to a directory.', 400, 'SFTP_WRITE_DIRECTORY');
        }
        if (writeMode === 'update' && exists && req.body?.backupExisting === true) {
          const backup = `${target}.bak-${new Date().toISOString().replace(/[:.]/g, '-')}`;
          await new Promise((resolve, reject) => {
            const input = client.createReadStream(target); const output = client.createWriteStream(backup);
            input.on('error', reject); output.on('error', reject); output.on('close', resolve); input.pipe(output);
          });
        }
        await client.put(buffer, target);"""
          if old in s:s=s.replace(old,new)
          # soft delete into sibling trash folder
          old="""        if (exists === 'd') {
          await client.rmdir(target, recursive);
          return 'directory';
        }
        await client.delete(target, false);
        return exists === 'l' ? 'symlink' : 'file';"""
          new="""        if (req.body?.softDelete === true) {
          const parent = path.posix.dirname(target);
          const trash = path.posix.join(parent, '.sftp-trash');
          if (!(await client.exists(trash))) await client.mkdir(trash, false);
          const dest = path.posix.join(trash, `${path.posix.basename(target)}-${Date.now()}`);
          await client.rename(target, dest);
          return exists === 'd' ? 'directory (trashed)' : 'file (trashed)';
        }
        if (exists === 'd') { await client.rmdir(target, recursive); return 'directory'; }
        await client.delete(target, false);
        return exists === 'l' ? 'symlink' : 'file';"""
          if old in s:s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/sftp/index.html api/sftp.js
          git diff --cached --quiet || git commit -m "Wire SFTP power tools and safety backups"
          git push
