<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101217"><title>Color Swap</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:#101217;touch-action:none;user-select:none;-webkit-user-select:none}main{position:fixed;inset:0;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}#board{display:grid;gap:clamp(2px,.7vmin,8px);width:min(94vw,calc(94dvh * 1.0),900px);aspect-ratio:1;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));touch-action:none}.tile{border:0;border-radius:clamp(3px,.8vmin,10px);width:100%;height:100%;padding:0;cursor:grab;box-shadow:inset 0 1px 1px #ffffff40,0 2px 6px #0004;transition:transform .14s,filter .14s,outline .1s;touch-action:none}.tile:active{cursor:grabbing}.tile.selected{outline:3px solid #fff;outline-offset:-4px;transform:scale(.91);filter:brightness(1.15)}.tile.target{outline:3px solid #fff9;outline-offset:-4px;transform:scale(.94)}.tile:focus-visible{outline:3px solid white;outline-offset:-3px}@media(orientation:landscape){#board{width:min(90dvh,94vw,900px)}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style></head><body><main><div id="board" role="group" aria-label="Color swapping board"></div></main><script>
(()=>{'use strict';const palette=['#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#a3e635','#f8fafc'];const names=['red','orange','yellow','green','cyan','blue','purple','pink','lime','white'];const board=document.getElementById('board');const count=64;const colors=Array.from({length:count},(_,i)=>i%10);for(let i=count-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[colors[i],colors[j]]=[colors[j],colors[i]]}let selected=-1,down=-1,dragging=false,startX=0,startY=0,target=-1;const tiles=[];for(let i=0;i<count;i++){const b=document.createElement('button');b.type='button';b.className='tile';b.dataset.index=i;b.draggable=false;board.append(b);tiles.push(b)}function paint(){tiles.forEach((el,i)=>{el.style.background=palette[colors[i]];el.setAttribute('aria-label',names[colors[i]]+' tile, position '+(i+1));el.classList.toggle('selected',i===selected);el.classList.toggle('target',dragging&&i===target&&i!==down)})}function swap(a,b){if(a<0||b<0||a===b)return;[colors[a],colors[b]]=[colors[b],colors[a]];selected=-1;paint()}function indexAt(x,y){const el=document.elementFromPoint(x,y)?.closest('.tile');return el&&board.contains(el)?Number(el.dataset.index):-1}board.addEventListener('pointerdown',e=>{const el=e.target.closest('.tile');if(!el)return;down=Number(el.dataset.index);startX=e.clientX;startY=e.clientY;dragging=false;target=-1;try{el.setPointerCapture(e.pointerId)}catch{};e.preventDefault()});board.addEventListener('pointermove',e=>{if(down<0)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>8)dragging=true;if(dragging){target=indexAt(e.clientX,e.clientY);paint()}});function finish(e,cancel){if(down<0)return;const from=down,to=indexAt(e.clientX,e.clientY),wasDragging=dragging;down=-1;dragging=false;target=-1;if(!cancel){if(wasDragging&&to>=0&&to!==from)swap(from,to);else if(!wasDragging){if(selected>=0&&selected!==from)swap(selected,from);else selected=selected===from?-1:from}}paint()}board.addEventListener('pointerup',e=>finish(e,false));board.addEventListener('pointercancel',e=>finish(e,true));board.addEventListener('lostpointercapture',e=>{if(down>=0)finish(e,true)});board.addEventListener('keydown',e=>{const el=e.target.closest('.tile');if(!el)return;const i=Number(el.dataset.index);if(e.key==='Escape'){selected=-1;paint()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selected>=0&&selected!==i)swap(selected,i);else{selected=selected===i?-1:i;paint()}}});paint()})();
</script></body></html>
