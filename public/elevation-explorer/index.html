<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>Elevation Explorer</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111d;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
    .boot{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,#183c58 0,transparent 35%),#07111d}
    .loader{width:42px;height:42px;border:3px solid #ffffff22;border-top-color:#5de2c4;border-radius:50%;animation:spin .8s linear infinite}
    .boot b{display:block;margin-top:15px}.boot small{display:block;color:#9db1c0;margin-top:4px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><div><div class="loader"></div><b>Elevation Explorer</b><small>Preparing the terrain…</small></div></div>
  <script>
    const premiumCSS = `
      :root{--accent:#5de2c4;--accent2:#54a8ff;--ink:#f5fbff;--muted:#9fb3c1;--glass:linear-gradient(180deg,rgba(12,30,45,.94),rgba(7,20,32,.88));--line:rgba(255,255,255,.12);--shadow:0 24px 70px rgba(0,0,0,.38)}
      *{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;color:var(--ink)!important;background:#07111d!important}
      .bar{top:max(12px,env(safe-area-inset-top))!important;left:14px!important;right:14px!important}.brand{display:flex!important;align-items:center!important;gap:11px!important;padding:9px 14px 9px 10px!important;border-radius:18px!important;background:var(--glass)!important;border-color:var(--line)!important;box-shadow:var(--shadow)!important}.brand:before{content:'⛰';display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03211c;font-size:22px}.brand small{color:var(--muted)!important}
      .actions button,.btn{border-color:var(--line)!important;background:rgba(9,25,38,.9)!important;border-radius:13px!important;min-height:42px!important}.btn.primary{background:linear-gradient(135deg,var(--accent),#47bce8)!important;color:#03211c!important;border:0!important;font-weight:800}.panel{top:84px!important;left:14px!important;bottom:14px!important;width:390px!important;border-radius:24px!important;background:var(--glass)!important;border-color:var(--line)!important;box-shadow:var(--shadow)!important}.tab.on{color:var(--accent)!important}.scroll{padding:17px!important}.page h2{font-size:11px!important;color:var(--accent)!important;letter-spacing:.14em!important}.muted{color:var(--muted)!important;line-height:1.5!important}input,select{border-color:var(--line)!important;border-radius:13px!important;background:rgba(255,255,255,.045)!important}.profile{right:14px!important;bottom:14px!important;border-radius:24px!important;background:var(--glass)!important;border-color:var(--line)!important;box-shadow:var(--shadow)!important}.maplibregl-ctrl-group{border-radius:14px!important;overflow:hidden}
      .ee-welcome{position:absolute;z-index:4;right:14px;top:84px;width:252px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--glass);box-shadow:var(--shadow)}.ee-welcome h3{font-size:16px;margin:0 0 5px}.ee-welcome p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 12px}.ee-quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ee-quick button{height:38px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer}.ee-quick button:first-child{background:linear-gradient(135deg,var(--accent),#47bce8);color:#03211c;border:0;font-weight:800}
      .ee-center{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}.ee-center:before,.ee-center:after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px #0005}.ee-center:before{width:28px;height:1px;left:-14px}.ee-center:after{height:28px;width:1px;top:-14px}.ee-readout{position:absolute;z-index:3;left:50%;top:calc(50% + 22px);transform:translateX(-50%);padding:7px 10px;border-radius:11px;background:rgba(5,16,26,.82);border:1px solid var(--line);font-size:11px;pointer-events:none}.ee-toast{position:absolute;z-index:30;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;padding:10px 14px;border-radius:13px;background:#0d2636;border:1px solid var(--line);box-shadow:var(--shadow);transition:.22s;pointer-events:none}.ee-toast.show{opacity:1;transform:translate(-50%,0)}
      .shape-tools{margin:0 0 12px;padding:11px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.035)}.shape-tools b{display:block;margin-bottom:7px}.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.shape-grid button{min-height:38px;padding:6px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-size:11px}.shape-grid button.on{background:var(--accent);color:#03211c;font-weight:800}.shape-options{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.shape-options label{font-size:10px;color:var(--muted)}.shape-options input{margin-top:4px}.shape-status{margin-top:8px;font-size:11px;color:var(--accent);line-height:1.4}.draw-crosshair .maplibregl-canvas{cursor:crosshair!important}
      @media(max-width:900px){.ee-welcome{display:none}.panel{width:350px!important}.profile{width:calc(100vw - 392px)!important}}
      @media(max-width:800px){.bar{left:9px!important;right:9px!important}.brand small{display:none!important}.panel{left:8px!important;right:8px!important;width:auto!important;bottom:max(72px,env(safe-area-inset-bottom))!important}.profile{left:8px!important;right:8px!important;width:auto!important;bottom:78px!important}.ee-toast{bottom:84px}.shape-grid{grid-template-columns:repeat(2,1fr)}}
    `;

    const enhancementJS = `
      (()=>{
        const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
        const toast=m=>{let t=q('.ee-toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window.__eet);window.__eet=setTimeout(()=>t.classList.remove('show'),1800)};
        const welcome=document.createElement('section');welcome.className='ee-welcome';welcome.innerHTML='<h3>See the landscape differently</h3><p>Compare elevations or draw an exact area for a printable terrain model.</p><div class="ee-quick"><button id="eeAdd">Add center</button><button id="ee3d">Best 3D</button></div>';document.body.append(welcome);
        const cross=document.createElement('div');cross.className='ee-center';document.body.append(cross);const read=document.createElement('div');read.className='ee-readout';read.textContent='Center elevation —';document.body.append(read);const t=document.createElement('div');t.className='ee-toast';document.body.append(t);
        const update=()=>{try{const c=map.getCenter(),h=map.queryTerrainElevation([c.lng,c.lat],{exaggerated:false});read.textContent='Center '+(Number.isFinite(h)?Math.round(h*3.28084).toLocaleString()+' ft':'elevation —')}catch(e){}};map.on('move',update);map.on('load',update);
        q('#eeAdd').onclick=()=>{const c=map.getCenter();add(c.lng,c.lat,'Map center');qa('.tab').find(x=>x.dataset.tab==='compare')?.click();toast('Center added for comparison')};q('#ee3d').onclick=()=>{map.easeTo({pitch:68,bearing:-24,duration:500});q('#pitch').value=68;q('#pv').value='68°';q('#bearing').value=-24;q('#bv').value='-24°';toast('3D terrain view applied')};

        const printPage=q('[data-page="print"]');
        const tools=document.createElement('div');tools.className='shape-tools';tools.innerHTML='<b>Printable area</b><div class="shape-grid"><button data-shape="view">Visible map</button><button data-shape="square">Center square</button><button data-shape="rect">Center rectangle</button><button data-shape="circle">Center circle</button><button data-shape="drag">Drag box</button><button data-shape="line">Two-click line</button><button data-shape="clear">Clear shape</button></div><div class="shape-options"><label>Preset size (km)<input id="shapeSize" type="number" min="0.1" max="50" step="0.1" value="2"></label><label>Line width (m)<input id="lineWidth" type="number" min="20" max="5000" step="20" value="300"></label></div><div class="shape-status" id="shapeStatus">Using the visible map.</div>';
        printPage.insertBefore(tools,printPage.querySelector('.row'));
        const intro=printPage.querySelector('.muted');if(intro)intro.textContent='Choose a preset or draw an exact boundary. The selected shape becomes the model footprint.';

        const state={mode:'view',geo:null,start:null,dragStart:null};
        const empty={type:'FeatureCollection',features:[]};
        function ensureLayer(){if(map.getSource('print-selection'))return;map.addSource('print-selection',{type:'geojson',data:empty});map.addLayer({id:'print-selection-fill',type:'fill',source:'print-selection',paint:{'fill-color':'#5de2c4','fill-opacity':0.18}});map.addLayer({id:'print-selection-line',type:'line',source:'print-selection',paint:{'line-color':'#5de2c4','line-width':3,'line-dasharray':[2,1]}})}
        function setGeo(geo,label,mode){ensureLayer();state.geo=geo;state.mode=mode;map.getSource('print-selection').setData(geo||empty);q('#shapeStatus').textContent=label;qa('[data-shape]').forEach(b=>b.classList.toggle('on',b.dataset.shape===mode));document.body.classList.toggle('draw-crosshair',mode==='drag'||mode==='line')}
        const ringFeature=coords=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[...coords,coords[0]]]}});
        function boundsFeature(w,s,e,n){return ringFeature([[w,s],[e,s],[e,n],[w,n]])}
        function centerPreset(type){const c=map.getCenter(),km=Math.max(.1,+q('#shapeSize').value||2),latD=km/111.32,lngD=km/(111.32*Math.cos(c.lat*Math.PI/180));if(type==='square'){setGeo(boundsFeature(c.lng-lngD/2,c.lat-latD/2,c.lng+lngD/2,c.lat+latD/2),'Square: '+km.toFixed(1)+' km × '+km.toFixed(1)+' km','square')}else if(type==='rect'){setGeo(boundsFeature(c.lng-lngD*.75,c.lat-latD/2,c.lng+lngD*.75,c.lat+latD/2),'Rectangle: '+(km*1.5).toFixed(1)+' km × '+km.toFixed(1)+' km','rect')}else{let pts=[];for(let i=0;i<64;i++){let a=i/64*Math.PI*2;pts.push([c.lng+Math.cos(a)*lngD/2,c.lat+Math.sin(a)*latD/2])}setGeo(ringFeature(pts),'Circle: '+km.toFixed(1)+' km diameter','circle')}}
        function corridor(a,b,widthM){const midLat=(a.lat+b.lat)/2,dx=(b.lng-a.lng)*111320*Math.cos(midLat*Math.PI/180),dy=(b.lat-a.lat)*111320,len=Math.hypot(dx,dy)||1,nx=-dy/len*widthM/2,ny=dx/len*widthM/2,toLL=(p,x,y)=>[p.lng+x/(111320*Math.cos(midLat*Math.PI/180)),p.lat+y/111320];return ringFeature([toLL(a,nx,ny),toLL(b,nx,ny),toLL(b,-nx,-ny),toLL(a,-nx,-ny)])}
        function geoBounds(geo){const pts=geo.geometry.coordinates[0],xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{w:Math.min(...xs),e:Math.max(...xs),s:Math.min(...ys),n:Math.max(...ys)}}
        function cancelDraw(){state.start=null;state.dragStart=null;map.dragPan.enable()}
        qa('[data-shape]').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.shape;cancelDraw();if(m==='view')setGeo(null,'Using the visible map.','view');else if(m==='clear')setGeo(null,'Selection cleared; using visible map.','view');else if(['square','rect','circle'].includes(m))centerPreset(m);else if(m==='drag'){state.mode='drag';q('#shapeStatus').textContent='Drag across the map to create a box.';qa('[data-shape]').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.add('draw-crosshair')}else if(m==='line'){state.mode='line';state.start=null;q('#shapeStatus').textContent='Click the route start, then click the route end.';qa('[data-shape]').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.add('draw-crosshair')}}));
        map.on('mousedown',e=>{if(state.mode!=='drag')return;state.dragStart=e.lngLat;map.dragPan.disable()});
        map.on('mousemove',e=>{if(state.mode!=='drag'||!state.dragStart)return;const a=state.dragStart,b=e.lngLat;setGeo(boundsFeature(Math.min(a.lng,b.lng),Math.min(a.lat,b.lat),Math.max(a.lng,b.lng),Math.max(a.lat,b.lat)),'Drag box selected. Release to finish.','drag')});
        map.on('mouseup',()=>{if(state.mode==='drag'&&state.dragStart){state.dragStart=null;map.dragPan.enable();q('#shapeStatus').textContent='Custom drag box selected.';toast('Printable drag box selected')}});
        map.on('click',e=>{if(state.mode!=='line')return;if(!state.start){state.start=e.lngLat;q('#shapeStatus').textContent='Start saved. Click the route end.';return}const width=Math.max(20,+q('#lineWidth').value||300);setGeo(corridor(state.start,e.lngLat,width),'Route corridor selected: '+width+' m wide.','line');state.start=null;toast('Printable route corridor selected')});

        function generateScad(){const n=Math.max(8,+q('#grid').value||26),modelW=Math.max(40,+q('#width').value||140),base=Math.max(1,+q('#base').value||3),vz=Math.max(.1,+q('#vertical').value||1.8);let b=state.geo?geoBounds(state.geo):(()=>{const x=map.getBounds();return{w:x.getWest(),e:x.getEast(),s:x.getSouth(),n:x.getNorth()}})();let heights=[],mn=Infinity,mx=-Infinity;for(let y=0;y<n;y++){let row=[];for(let x=0;x<n;x++){const lng=b.w+(b.e-b.w)*x/(n-1),lat=b.s+(b.n-b.s)*y/(n-1),h=map.queryTerrainElevation([lng,lat],{exaggerated:false});h=Number.isFinite(h)?h:0;row.push(h);mn=Math.min(mn,h);mx=Math.max(mx,h)}heights.push(row)}const aspect=Math.max(.15,Math.cos(((b.s+b.n)/2)*Math.PI/180)*(b.e-b.w)/(b.n-b.s||1)),depth=modelW/aspect;let points=[],faces=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)points.push([x*modelW/(n-1),y*depth/(n-1),base+(heights[y][x]-mn)*vz]);const bottom=points.length;points.push([0,0,0],[modelW,0,0],[modelW,depth,0],[0,depth,0]);for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){let a=y*n+x,c=a+1,d=a+n,e=d+1;faces.push([a,c,e,d])}faces.push([bottom,bottom+3,bottom+2,bottom+1]);for(let x=0;x<n-1;x++){faces.push([bottom,x+1,x]);let a=(n-1)*n+x;faces.push([bottom+3,a,a+1])}for(let y=0;y<n-1;y++){let a=y*n;faces.push([bottom,a,(y+1)*n,bottom+3]);a=y*n+n-1;faces.push([bottom+1,bottom+2,(y+1)*n+n-1,a])}const pt=points.map(p=>'['+p.map(v=>+v.toFixed(3)).join(',')+']').join(',\n');const fc=faces.map(f=>'['+f.join(',')+']').join(',\n');let shape='terrain();';if(state.mode==='circle')shape='intersection(){ terrain(); translate(['+(modelW/2).toFixed(3)+','+(depth/2).toFixed(3)+',-1]) cylinder(d='+Math.min(modelW,depth).toFixed(3)+',h='+((mx-mn)*vz+base+2).toFixed(3)+',$fn=96); }';else if(state.mode==='line'&&state.geo){const coords=state.geo.geometry.coordinates[0].slice(0,-1),poly=coords.map(p=>'['+(((p[0]-b.w)/(b.e-b.w))*modelW).toFixed(3)+','+(((p[1]-b.s)/(b.n-b.s))*depth).toFixed(3)+']').join(',');shape='intersection(){ terrain(); linear_extrude(height='+((mx-mn)*vz+base+2).toFixed(3)+') polygon(points=['+poly+']); }'}const code='// Elevation Explorer terrain model\n// Shape: '+state.mode+'\n// Elevation range: '+Math.round(mn)+'m to '+Math.round(mx)+'m\nmodule terrain(){\npolyhedron(points=[\n'+pt+'\n],faces=[\n'+fc+'\n],convexity=10);\n}\n'+shape+'\n';q('#code').textContent=code;q('#code').style.display='block';q('#status').textContent='Generated '+state.mode+' terrain · '+n+'×'+n+' samples · '+modelW+' mm wide';const blob=new Blob([code],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='elevation-'+state.mode+'-'+Date.now()+'.scad';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('OpenSCAD file generated')}
        const make=q('#make');if(make)make.onclick=generateScad;const copy=q('#copy');if(copy)copy.onclick=async()=>{const code=q('#code').textContent;if(!code)return toast('Generate the model first');try{await navigator.clipboard.writeText(code);toast('OpenSCAD copied')}catch(e){toast('Copy unavailable; select the code below')}};
        const clear=q('#clear');if(clear){const old=clear.onclick;clear.onclick=()=>{old?.();toast('Comparison points cleared')}}
        document.addEventListener('keydown',e=>{if(e.key==='Escape'){cancelDraw();setGeo(state.geo,q('#shapeStatus').textContent,state.geo?state.mode:'view')}if(e.key==='/'&&!/input|textarea/i.test(e.target.tagName)){e.preventDefault();q('#search')?.focus()}if(e.key.toLowerCase()==='n')q('#north')?.click();if(e.key.toLowerCase()==='r'&&!/input|textarea/i.test(e.target.tagName))q('#reset')?.click()});
        if(innerWidth<=800){if(q('#tools'))q('#tools').textContent='Explore';q('.panel')?.addEventListener('click',e=>{if(e.target.closest('.tab'))q('.panel').classList.add('open')})}toast('Elevation Explorer ready');
      })();
    `;

    fetch('../topoforge/index.html',{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error('Unable to load app');return response.text()})
      .then(html=>{
        const closingScript='<'+'/script>',escapedClosingScript='<\\/script>';
        const safeEnhancementJS=enhancementJS.split(closingScript).join(escapedClosingScript);
        html=html.replaceAll('TopoForge','Elevation Explorer').replaceAll('topoforge','elevation-explorer').replaceAll('forge printable relief models','explore terrain and create printable relief models').replace('</style>','</style><style>'+premiumCSS+'</style>').replace('</body>','<script>'+safeEnhancementJS+escapedClosingScript+'</body>');
        document.open();document.write(html);document.close();
      })
      .catch(err=>{document.body.innerHTML='<main style="padding:32px"><h1>Elevation Explorer</h1><p>'+err.message+'</p></main>';console.error(err)});
  </script>
</body>
</html>
