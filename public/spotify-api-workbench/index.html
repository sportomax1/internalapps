function showTable(rows){lastRows=rows;$('#rowCount').textContent=rows.length+' rows';if(!rows.length){$('#table').innerHTML='<div class="empty">No tabular rows in this response.</div>';return}const fs=rows.map(x=>flat(x)),keys=[...new Set(fs.flatMap(Object.keys))].slice(0,24);$('#table').innerHTML=`<table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${fs.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function showRaw(data,meta=''){lastRaw=data;$('#raw').textContent=typeof data==='string'?data:JSON.stringify(data,null,2);$('#meta').textContent=meta;showTable(rowsFrom(data))}
async function run(all){const e=E[selected];if(['POST','PUT','DELETE'].includes(e[1])&&!confirm(`Run ${e[1]} ${e[3]}? This can modify your Spotify account or playback.`))return;let url=build(),o=opts();$('#meta').textContent='Running…';$('#raw').textContent='Loading…';try{if(!all){const t0=performance.now(),r=await api(url,o);showRaw(r.data,`${e[1]} · HTTP ${r.status} · ${Math.round(performance.now()-t0)} ms · ${r.url}`);return}if(e[1]!=='GET')throw new Error('Auto pagination is only available for GET calls.');const cap=Math.min(200,Math.max(1,+$('#pageCap').value||20)),delay=Math.max(0,+$('#pageDelay').value||0);let pages=[],rows=[],n=0,next=url;while(next&&n<cap){n++;$('#meta').textContent=`Fetching page ${n}/${cap}… ${rows.length} rows`;const r=await api(next,{method:'GET'});pages.push(r.data);rows.push(...rowsFrom(r.data));const p=pagePayload(r.data);next=p?.next||null;if(next&&next===r.url)next=null;if(next&&delay)await new Promise(res=>setTimeout(res,delay))}lastRaw={pages_fetched:n,total_rows:rows.length,truncated:!!next,pages};$('#raw').textContent=JSON.stringify(lastRaw,null,2);$('#meta').textContent=`Auto pagination complete · ${n} page(s) · ${rows.length} rows${next?' · safety cap reached':''}`;showTable(rows)}catch(err){const d=err.data||{error:err.message};$('#raw').textContent=JSON.stringify(d,null,2);$('#meta').textContent=`ERROR${err.status?' HTTP '+err.status:''}: ${err.message}`;$('#meta').className='muted status-bad';showTable(rowsFrom(d))}}
function clearResults(){lastRaw=null;lastRows=[];$('#raw').textContent='Cleared.';$('#meta').textContent='No request run yet.';$('#meta').className='muted';showTable([])}
async function connect(){const cid=$('#clientId').value.trim();if(!cid)return toast('Client ID required');localStorage.setItem('sp_client',cid);const verifier=base64url(crypto.getRandomValues(new Uint8Array(64)));const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));const challenge=base64url(new Uint8Array(digest));const state=base64url(crypto.getRandomValues(new Uint8Array(24)));sessionStorage.setItem('sp_verifier',verifier);sessionStorage.setItem('sp_state',state);const p=new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:REDIRECT_URI,scope:DEFAULT_SCOPES.join(' '),code_challenge_method:'S256',code_challenge:challenge,state});location.href='https://accounts.spotify.com/authorize?'+p}
function base64url(a){return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function callback(){const p=new URLSearchParams(location.search),code=p.get('code');if(!code)return;if(p.get('state')!==sessionStorage.getItem('sp_state'))throw new Error('OAuth state mismatch');const body=new URLSearchParams({client_id:$('#clientId').value,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:sessionStorage.getItem('sp_verifier')});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw new Error(JSON.stringify(d));sessionStorage.setItem('sp_token',d.access_token);if(d.refresh_token)sessionStorage.setItem('sp_refresh',d.refresh_token);history.replaceState({},'',location.pathname);updateAuth();toast('Spotify connected')}
async function refreshToken(){const rr=refresh();if(!rr)throw new Error('No refresh token');const body=new URLSearchParams({client_id:$('#clientId').value,grant_type:'refresh_token',refresh_token:rr});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw new Error(JSON.stringify(d));sessionStorage.setItem('sp_token',d.access_token);if(d.refresh_token)sessionStorage.setItem('sp_refresh',d.refresh_token);updateAuth()}
$('#copyRedirect').onclick=()=>navigator.clipboard.writeText(REDIRECT_URI).then(()=>toast('Redirect URI copied')).catch(()=>toast('Copy failed: '+REDIRECT_URI));
$('#filter').oninput=renderNav;$('#connect').onclick=()=>connect().catch(e=>toast(e.message));$('#disconnect').onclick=()=>{sessionStorage.removeItem('sp_token');sessionStorage.removeItem('sp_refresh');updateAuth();toast('Disconnected')};$('#clientId').onchange=()=>localStorage.setItem('sp_client',$('#clientId').value.trim());$('#copyRaw').onclick=()=>navigator.clipboard.writeText($('#raw').textContent).then(()=>toast('Copied'));$('#downloadCsv').onclick=()=>{if(!lastRows.length)return toast('Run a call first');const f=lastRows.map(x=>flat(x)),keys=[...new Set(f.flatMap(Object.keys))].slice(0,24);const csv=[keys,...f.map(row=>keys.map(k=>row[k]??''))].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='spotify-api-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#downloadRaw').onclick=()=>{const b=new Blob([$('#raw').textContent],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spotify-api-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#clientId').value=localStorage.getItem('sp_client')||$('#clientId').value;renderNav();renderCall();updateAuth();callback().catch(e=>{toast(e.message);$('#raw').textContent=e.message});

</script></body></html>
