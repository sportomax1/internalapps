<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K2 Map Builder</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
:root{--bg:#eef6fb;--panel:#fff;--ink:#17324d;--muted:#6d8398;--line:#d7e5ef;--brand:#0b9bd7;--good:#17864b;--warn:#b36a00;--bad:#c93b48}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:minmax(0,1fr) 430px;height:100vh}.board{position:relative;min-width:0;background:#9fd8f0}.topbar{position:absolute;z-index:700;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(31,72,103,.14)}.brand{font-weight:900;margin-right:auto}.topbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 12px;text-decoration:none;font-weight:800;cursor:pointer}#map{height:100%;width:100%}.routesOverlay{position:absolute;inset:0;z-index:520;pointer-events:none}.routeCar{position:absolute;height:16px;border-radius:7px;border:2px solid rgba(17,35,52,.28);box-shadow:0 2px 3px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.55);transform-origin:center}.routeLabel{position:absolute;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #b7d3e8;font-size:11px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.16)}.cityIcon{width:23px;height:23px;border-radius:50%;background:#11a9df;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,90,130,.35)}.cityName{font-size:11px;font-weight:900;color:#204d6c;text-shadow:0 1px 1px #fff;white-space:nowrap}.side{height:100vh;overflow:auto;background:linear-gradient(#fff,#f8fbfd);border-left:1px solid var(--line);box-shadow:-12px 0 28px rgba(36,77,108,.12);padding:14px}.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.hero h1{font-size:20px;margin:0}.hero p{margin:3px 0 0;color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}.card h2{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#49677f}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wide{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-bottom:4px}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fbfdff;color:var(--ink)}.btn{border:0;border-radius:10px;padding:10px 11px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.soft{background:#edf5fa;color:var(--ink)}.danger{background:#ffecef;color:#a72232}.packGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pack{border:1px solid var(--line);background:#f8fbfd;border-radius:10px;padding:9px;text-align:left;font-weight:900;cursor:pointer}.pack small{display:block;color:var(--muted);font-weight:700;margin-top:2px}.pack.active{outline:3px solid #beeaff;border-color:var(--brand)}.searchResults,.list{display:grid;gap:6px;max-height:180px;overflow:auto}.searchResult,.loc{border:1px solid var(--line);background:#f9fcfe;border-radius:9px;padding:8px}.searchResult{cursor:pointer}.searchResult small,.loc small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#f3f8fb;border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:9px;color:var(--muted);font-weight:900}.balanceSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.grade{border-radius:11px;padding:10px;text-align:center;background:#f4f8fb}.grade.good{background:#eaf8f0;color:var(--good)}.grade.warn{background:#fff6e8;color:var(--warn)}.grade.bad{background:#ffedf0;color:var(--bad)}.grade b{display:block;font-size:22px}.grade span{font-size:9px;font-weight:900;text-transform:uppercase}.balanceTable{width:100%;border-collapse:collapse;font-size:11px}.balanceTable th,.balanceTable td{padding:6px 4px;border-bottom:1px solid #edf2f5;text-align:right}.balanceTable th:first-child,.balanceTable td:first-child{text-align:left}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}.flags{display:grid;gap:6px}.flag{padding:8px 9px;border-radius:9px;font-size:11px;font-weight:750}.flag.good{background:#eaf8f0;color:#176b40}.flag.warn{background:#fff5e5;color:#8f5700}.flag.bad{background:#ffedf0;color:#a62d3a}.apiStatus{font-size:11px;color:var(--muted);min-height:16px;margin-top:6px}@media(max-width:1050px){.app{display:block;height:auto}.board{height:58vh}.side{height:auto;border-left:0}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <main class="board">
    <div class="topbar"><span>🗺️</span><span id="boardName" class="brand">K2 Map Builder</span><button id="resetCam" class="topbtn">Reset view</button><a href="/" class="topbtn">Home</a></div>
    <div id="map"></div><div id="routesOverlay" class="routesOverlay"></div>
  </main>
  <aside class="side">
    <div class="hero"><div><h1>Custom Route Map</h1><p>Build, test, and balance a Ticket-to-Ride-style network.</p></div><button id="newBoard" class="btn soft">New</button></div>
    <section class="card"><h2>Location packs</h2><div id="packGrid" class="packGrid"></div><div id="apiStatus" class="apiStatus"></div></section>
    <section class="card"><h2>Add a location</h2><div class="grid2"><div class="wide"><label>Search</label><input id="nameInput" placeholder="Parker CO, Coors Field, Grand Canyon..." /></div><button id="searchBtn" class="btn primary">Search</button><button id="quickAddBtn" class="btn soft">Add best match</button><div id="searchResults" class="searchResults wide"></div><div><label>Latitude</label><input id="latInput" type="number" step="any" /></div><div><label>Longitude</label><input id="lngInput" type="number" step="any" /></div><button id="addBtn" class="btn primary">Add pin</button><input id="fileInput" class="wide" type="file" accept=".csv,.gpx,.xml,.txt" /></div></section>
    <section class="card"><h2>Route generator</h2><div class="grid2"><div><label>Total routes</label><input id="routeCount" type="number" min="0" value="72" /></div><div><label>Max per city</label><input id="maxRoutes" type="number" min="1" value="5" /></div><div><label>Min length</label><input id="minLen" type="number" min="1" value="1" /></div><div><label>Max length</label><input id="maxLen" type="number" min="1" value="6" /></div><div><label>Gray share %</label><input id="grayShare" type="number" min="0" max="60" value="30" /></div><div><label>Seed</label><input id="seedInput" value="K2" /></div><div class="wide"><label>Color mode</label><select id="colorMode"><option value="balanced">Balanced to classic-map targets</option><option value="random">Random</option><option value="gray">All gray test</option></select></div><button id="routesBtn" class="btn primary">Generate routes</button><button id="objectivesBtn" class="btn soft">Generate tickets</button><button id="exportBtn" class="btn soft">Export JSON</button><button id="clearBtn" class="btn danger">Clear</button></div></section>
    <section class="card"><h2>Board stats</h2><div class="stats"><div class="stat"><b id="locCount">0</b><span>LOCATIONS</span></div><div class="stat"><b id="routeStat">0</b><span>ROUTES</span></div><div class="stat"><b id="spaceStat">0</b><span>SPACES</span></div><div class="stat"><b id="objStat">0</b><span>TICKETS</span></div></div></section>
    <section class="card"><h2>Balance analyzer</h2><div id="balanceSummary" class="balanceSummary"></div><div id="balanceFlags" class="flags"></div><div style="overflow:auto;margin-top:8px"><table class="balanceTable"><thead><tr><th>Color</th><th>Routes</th><th>Spaces</th><th>Avg</th><th>Pts</th><th>Long</th></tr></thead><tbody id="balanceBody"></tbody></table></div></section>
    <section class="card"><h2>Locations</h2><div id="locationList" class="list"></div></section>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const COLORS={blue:'#3b82f6',green:'#42d86f',yellow:'#ffd94a',orange:'#fb9a0c',red:'#ff6864',purple:'#b66bf0',black:'#2f3a46',white:'#f8fbff',gray:'#9aa9b7'};
const REGULAR=['blue','green','yellow','orange','red','purple','black','white'];
const PAL=[...REGULAR,'gray'];
const SCORE={1:1,2:2,3:4,4:7,5:10,6:15};
const ESPN={nfl:'football/nfl',mlb:'baseball/mlb',nba:'basketball/nba',nhl:'hockey/nhl',mls:'soccer/usa.1'};
const PACKS=[['nfl','🏈 NFL','all teams'],['mlb','⚾ MLB','all teams'],['nba','🏀 NBA','all teams'],['nhl','🏒 NHL','all teams'],['mls','⚽ MLS','all teams'],['custom','📍 Custom','your pins']];
const FALLBACK={custom:[['Parker, CO',39.5186,-104.7614],['Denver, CO',39.7392,-104.9903],['Omaha, NE',41.2565,-95.9345],['Clayton, NY',44.2395,-76.0855]],nfl:[['Denver Broncos',39.7439,-105.0201],['Kansas City Chiefs',39.049,-94.4839],['Dallas Cowboys',32.7473,-97.0945],['Green Bay Packers',44.5013,-88.0622],['Seattle Seahawks',47.5952,-122.3316],['Miami Dolphins',25.958,-80.2389],['New England Patriots',42.0909,-71.2643],['Las Vegas Raiders',36.0908,-115.183]]};
let locations=[],routes=[],objectives=[],activePack='custom',lastSearchResults=[];
const map=L.map('map',{zoomControl:false}).setView([39.5,-98.35],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const markers=L.layerGroup().addTo(map);const cityIcon=L.divIcon({className:'',html:'<div class="cityIcon"></div>',iconSize:[23,23],iconAnchor:[11,11]});
function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}
function seeded(seed){let h=2166136261;for(const ch of seed)h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>((h=Math.imul(h^h>>>15,2246822507),h=Math.imul(h^h>>>13,3266489909),(h^h>>>16)>>>0)/4294967296)}
function dist(a,b){const R=3958.8,d=x=>x*Math.PI/180,s=Math.sin(d(b.lat-a.lat)/2)**2+Math.cos(d(a.lat))*Math.cos(d(b.lat))*Math.sin(d(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function toLocs(arr,emoji='📍',cat='Custom'){return arr.map((x,i)=>({id:uid(),name:x[0],lat:+x[1],lng:+x[2],emoji,category:cat,color:PAL[i%PAL.length]}))}
async function geocode(q,limit=1){const key='k2geo:'+limit+':'+q;const cached=localStorage.getItem(key);if(cached)return JSON.parse(cached);const g=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit='+limit+'&q='+encodeURIComponent(q)).then(r=>r.json()).catch(()=>[]);const out=g.map(x=>({name:x.display_name,lat:+x.lat,lng:+x.lon,type:x.type}));if(out.length)localStorage.setItem(key,JSON.stringify(out));return out}
async function searchPlaces(q){q=q.trim();if(!q)return;apiStatus.textContent='Searching...';lastSearchResults=await geocode(q,6);searchResults.innerHTML=lastSearchResults.map((x,i)=>`<button class="searchResult" data-i="${i}"><b>${x.name.split(',')[0]}</b><small>${x.name}</small></button>`).join('')||'<div class="searchResult">No results</div>';document.querySelectorAll('.searchResult[data-i]').forEach(b=>b.onclick=()=>addSearchResult(+b.dataset.i));apiStatus.textContent=lastSearchResults.length?`${lastSearchResults.length} matches`:'No matches'}
function addSearchResult(i){const x=lastSearchResults[i];if(!x)return;addLocation(x.name.split(',')[0],x.lat,x.lng,'📍','Search');searchResults.innerHTML=''}
function addLocation(name,lat,lng,emoji='📍',category='Custom'){locations.push({id:uid(),name,lat:+lat,lng:+lng,emoji,category,color:PAL[locations.length%PAL.length]});render();fit()}
function renderMarkers(){markers.clearLayers();locations.forEach(l=>L.marker([l.lat,l.lng],{icon:cityIcon}).bindTooltip(`<span class="cityName">${l.name}</span>`,{permanent:true,direction:'top',offset:[0,-9],className:''}).addTo(markers))}
function drawRoutes(){routesOverlay.innerHTML='';routes.forEach(r=>{const a=locations.find(x=>x.id===r.a),b=locations.find(x=>x.id===r.b);if(!a||!b)return;const p1=map.latLngToContainerPoint([a.lat,a.lng]),p2=map.latLngToContainerPoint([b.lat,b.lng]),dx=p2.x-p1.x,dy=p2.y-p1.y,angle=Math.atan2(dy,dx)*180/Math.PI,d=Math.hypot(dx,dy),n=r.length,carW=Math.min(42,Math.max(25,d/(n+1)*.62));for(let i=1;i<=n;i++){const x=p1.x+dx*i/(n+1),y=p1.y+dy*i/(n+1),car=document.createElement('div');car.className='routeCar';car.style.width=carW+'px';car.style.background=COLORS[r.color];car.style.left=(x-carW/2)+'px';car.style.top=(y-8)+'px';car.style.transform=`rotate(${angle}deg)`;routesOverlay.appendChild(car)}const lab=document.createElement('div');lab.className='routeLabel';lab.textContent=n;lab.style.left=(p1.x+dx*.5-11)+'px';lab.style.top=(p1.y+dy*.5-11)+'px';routesOverlay.appendChild(lab)})}
function fit(){if(locations.length)map.fitBounds(L.latLngBounds(locations.map(l=>[l.lat,l.lng])).pad(.18),{maxZoom:6})}
function updateStats(){locCount.textContent=locations.length;routeStat.textContent=routes.length;spaceStat.textContent=routes.reduce((s,r)=>s+r.length,0);objStat.textContent=objectives.length;locationList.innerHTML=locations.map((l,i)=>`<div class="loc"><b>${i+1}. ${l.name}</b><br><small>${l.category} · ${l.lat.toFixed(2)}, ${l.lng.toFixed(2)}</small></div>`).join('')}
function analyze(){const by=Object.fromEntries(PAL.map(c=>[c,{routes:0,spaces:0,points:0,long:0}]));routes.forEach(r=>{const x=by[r.color];x.routes++;x.spaces+=r.length;x.points+=SCORE[r.length]||r.length*3;if(r.length>=5)x.long++});const regular=REGULAR.map(c=>by[c]);const vals=regular.map(x=>x.spaces).filter(Boolean);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;const spread=vals.length?(Math.max(...vals)-Math.min(...vals))/avg*100:0;const totalSpaces=routes.reduce((s,r)=>s+r.length,0);const grayPct=totalSpaces?by.gray.spaces/totalSpaces*100:0;const degrees=Object.fromEntries(locations.map(l=>[l.id,0]));routes.forEach(r=>{degrees[r.a]=(degrees[r.a]||0)+1;degrees[r.b]=(degrees[r.b]||0)+1});const dead=Object.values(degrees).filter(x=>x<2).length;const grade=Math.max(0,Math.round(100-spread*1.2-Math.abs(grayPct-30)*1.4-dead*4));const cls=grade>=85?'good':grade>=70?'warn':'bad';balanceSummary.innerHTML=`<div class="grade ${cls}"><b>${grade}</b><span>Balance score</span></div><div class="grade"><b>${spread.toFixed(1)}%</b><span>Color spread</span></div><div class="grade"><b>${grayPct.toFixed(1)}%</b><span>Gray spaces</span></div>`;balanceBody.innerHTML=PAL.map(c=>`<tr><td><span class="dot" style="background:${COLORS[c]}"></span>${c}</td><td>${by[c].routes}</td><td>${by[c].spaces}</td><td>${by[c].routes?(by[c].spaces/by[c].routes).toFixed(2):'—'}</td><td>${by[c].points}</td><td>${by[c].long}</td></tr>`).join('');const flags=[];if(!routes.length)flags.push(['warn','Generate routes to analyze the board.']);else{flags.push([spread<=15?'good':'bad',spread<=15?`Regular colors are within ${spread.toFixed(1)}% — inside the 15% target.`:`Regular-color space spread is ${spread.toFixed(1)}%; target is 15% or less.`]);flags.push([grayPct>=25&&grayPct<=32?'good':'warn',`Gray routes use ${grayPct.toFixed(1)}% of spaces; classic-style target is about 25–32%.`]);flags.push([dead===0?'good':dead<=2?'warn':'bad',dead===0?'Every location has at least two connections.':`${dead} location(s) have fewer than two connections.`]);const maxLong=Math.max(...regular.map(x=>x.long)),minLong=Math.min(...regular.map(x=>x.long));flags.push([maxLong-minLong<=1?'good':'warn',`Long-route spread is ${minLong}–${maxLong} per color; target is no more than one route apart.`]);const meanLen=routes.length?totalSpaces/routes.length:0;flags.push([meanLen>=3&&meanLen<=4.2?'good':'warn',`Average route length is ${meanLen.toFixed(2)}; healthy standard-map range is roughly 3.0–4.2.`])}balanceFlags.innerHTML=flags.map(([c,t])=>`<div class="flag ${c}">${t}</div>`).join('')}
function render(){renderMarkers();drawRoutes();updateStats();analyze()}
function pickBalancedColor(stats,r,grayTarget){const total=Object.values(stats).reduce((s,x)=>s+x.spaces,0);const grayNow=total?stats.gray.spaces/total:0;if(grayNow<grayTarget&&r()<.42)return'gray';const candidates=[...REGULAR].sort((a,b)=>(stats[a].spaces-stats[b].spaces)||(stats[a].routes-stats[b].routes));return candidates[Math.floor(r()*Math.min(3,candidates.length))]}
function generateRoutes(){routes=[];if(locations.length<2){render();return}const desired=+routeCount.value||70,maxPer=+maxRoutes.value||5,min=+minLen.value||1,max=+maxLen.value||6,r=seeded(seedInput.value+activePack),grayTarget=Math.max(0,Math.min(60,+grayShare.value||30))/100,counts=Object.fromEntries(locations.map(l=>[l.id,0])),stats=Object.fromEntries(PAL.map(c=>[c,{spaces:0,routes:0}])),pairs=[];for(let i=0;i<locations.length;i++)for(let j=i+1;j<locations.length;j++)pairs.push({a:locations[i],b:locations[j],m:dist(locations[i],locations[j])});pairs.sort((a,b)=>a.m-b.m);for(const p of pairs.slice(0,Math.max(desired*8,locations.length*10)).sort(()=>r()-.5)){if(routes.length>=desired)break;if(counts[p.a.id]>=maxPer||counts[p.b.id]>=maxPer)continue;const length=Math.max(min,Math.min(max,Math.round(p.m/260)+1));let color;if(colorMode.value==='gray')color='gray';else if(colorMode.value==='random')color=PAL[Math.floor(r()*PAL.length)];else color=pickBalancedColor(stats,r,grayTarget);counts[p.a.id]++;counts[p.b.id]++;stats[color].routes++;stats[color].spaces+=length;routes.push({id:uid(),a:p.a.id,b:p.b.id,length,color,miles:Math.round(p.m)})}render()}
function genObjectives(){const pairs=[];for(let i=0;i<locations.length;i++)for(let j=i+1;j<locations.length;j++)pairs.push({from:locations[i].name,to:locations[j].name,m:dist(locations[i],locations[j])});pairs.sort((a,b)=>a.m-b.m);const a=pairs.slice(0,Math.min(10,Math.ceil(pairs.length*.25))),b=pairs.slice(Math.floor(pairs.length*.4),Math.floor(pairs.length*.4)+Math.min(14,Math.ceil(pairs.length*.4))),c=pairs.slice(-Math.min(10,Math.ceil(pairs.length*.25)));objectives=[...a,...b,...c].map(x=>({...x,points:Math.max(4,Math.round(x.m/220))}));alert(objectives.map(o=>`${o.from} → ${o.to}: ${o.points} pts`).join('\n'));render()}
function extractTeams(json){const out=[];(function walk(o){if(!o||out.length>80)return;if(Array.isArray(o))return o.forEach(walk);if(typeof o==='object'){const t=o.team;if(t&&(t.displayName||t.name)&&!out.some(x=>x.id===(t.id||t.displayName)))out.push({id:t.id||t.displayName,name:t.displayName||t.name,venue:t.venue?.fullName||''});Object.values(o).forEach(walk)}})(json);return out}
async function loadPack(key){activePack=key;document.querySelectorAll('.pack').forEach(x=>x.classList.toggle('active',x.dataset.id===key));boardName.textContent=PACKS.find(p=>p[0]===key)?.[1]||'Custom';routes=[];objectives=[];if(key==='custom'){locations=toLocs(FALLBACK.custom);render();fit();return}try{apiStatus.textContent='Loading teams...';const json=await fetch(`https://site.api.espn.com/apis/site/v2/sports/${ESPN[key]}/teams`).then(r=>r.json());const teams=extractTeams(json);locations=[];for(let i=0;i<teams.length;i++){apiStatus.textContent=`Locating ${i+1}/${teams.length}: ${teams[i].name}`;const hits=await geocode((teams[i].venue||teams[i].name)+' stadium arena',1);if(hits[0])locations.push({id:uid(),name:teams[i].name,lat:hits[0].lat,lng:hits[0].lng,emoji:PACKS.find(p=>p[0]===key)[1][0],category:key.toUpperCase(),color:PAL[i%PAL.length]})}if(locations.length<8)throw Error('Too few locations');apiStatus.textContent=`Loaded ${locations.length} locations.`}catch(e){apiStatus.textContent='API unavailable; using fallback sample.';locations=toLocs(FALLBACK[key]||FALLBACK.custom,'📍',key.toUpperCase())}render();fit();generateRoutes()}
function parseCSV(t){const lines=t.trim().split(/\r?\n/),head=lines.shift().split(',').map(x=>x.trim().toLowerCase()),ni=head.findIndex(x=>['name','title','location'].includes(x)),la=head.findIndex(x=>['lat','latitude'].includes(x)),lo=head.findIndex(x=>['lng','lon','long','longitude'].includes(x));lines.forEach((line,i)=>{const c=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(c[la]&&c[lo])addLocation(c[ni]||`Location ${i+1}`,c[la],c[lo])})}
function parseGPX(t){const doc=new DOMParser().parseFromString(t,'text/xml');[...doc.querySelectorAll('wpt,trkpt,rtept')].slice(0,250).forEach((n,i)=>addLocation(n.querySelector('name')?.textContent||`GPX ${i+1}`,n.getAttribute('lat'),n.getAttribute('lon')))}
packGrid.innerHTML=PACKS.map(p=>`<button class="pack" data-id="${p[0]}">${p[1]}<small>${p[2]}</small></button>`).join('');document.querySelectorAll('.pack').forEach(b=>b.onclick=()=>loadPack(b.dataset.id));
searchBtn.onclick=()=>searchPlaces(nameInput.value);quickAddBtn.onclick=async()=>{if(!lastSearchResults.length)await searchPlaces(nameInput.value);addSearchResult(0)};nameInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchPlaces(nameInput.value)}};addBtn.onclick=()=>{if(!nameInput.value||!latInput.value||!lngInput.value)return alert('Name, latitude, and longitude are required.');addLocation(nameInput.value,latInput.value,lngInput.value,'📍','Custom')};fileInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();t.includes('<gpx')?parseGPX(t):parseCSV(t)};routesBtn.onclick=generateRoutes;objectivesBtn.onclick=genObjectives;clearBtn.onclick=()=>{locations=[];routes=[];objectives=[];render()};newBoard.onclick=()=>loadPack('custom');resetCam.onclick=fit;exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify({locations,routes,objectives,analysis:{generated:new Date().toISOString()}},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='k2-map-builder-board.json';a.click();URL.revokeObjectURL(a.href)};map.on('zoom move resize',drawRoutes);loadPack('custom');
</script>
