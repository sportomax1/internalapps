<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>K2 Map Builder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
:root{--bg:#eaf6ff;--panel:#fff;--ink:#17324a;--muted:#6a8298;--line:#d7e7f4;--blue:#0a9fe3;--good:#178b52;--warn:#b76a00;--bad:#bf2f45}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100vh}.mapWrap{position:relative;min-width:0}#map{height:100%;width:100%}.topbar{position:absolute;z-index:900;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}.pill,.topbar button,.topbar a{pointer-events:auto;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:800;text-decoration:none;box-shadow:0 8px 30px rgba(20,55,80,.15)}.pill{margin-right:auto}.side{background:linear-gradient(#fff,#f8fbfe);border-left:1px solid var(--line);overflow:auto;padding:18px}.side h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}.section{border:1px solid var(--line);background:white;border-radius:16px;padding:14px;margin-bottom:12px}.section h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pack{border:1px solid var(--line);background:#f7fbff;border-radius:12px;padding:10px;text-align:left;font-weight:900;cursor:pointer}.pack small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.pack.active{outline:3px solid #b9e9fb;border-color:var(--blue);background:#ecf9ff}.status{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f4f9fd;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted);font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row+.row{margin-top:8px}label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase}input,select,button{font:inherit}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfdff}.btn{border:0;border-radius:11px;padding:11px 12px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:#edf5fb;color:var(--ink)}.danger{background:#ffecef;color:#a51f37}.venueList{display:grid;gap:7px;max-height:260px;overflow:auto}.venue{padding:9px 10px;border-radius:11px;background:#f6faff}.venue b{display:block}.venue small{color:var(--muted)}.routesOverlay{position:absolute;inset:0;z-index:520;pointer-events:none}.routeCar{position:absolute;height:16px;border-radius:6px;border:2px solid rgba(20,35,50,.25);box-shadow:0 2px 3px rgba(0,0,0,.25);transform-origin:center}.legend{position:absolute;z-index:800;left:14px;bottom:14px;background:rgba(255,255,255,.94);padding:10px;border-radius:12px;font-size:11px;box-shadow:0 8px 25px rgba(20,55,80,.18)}.sw{display:inline-block;width:18px;height:10px;border-radius:4px;margin:0 4px 0 8px}.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}@media(max-width:980px){.app{display:block;height:auto}.mapWrap{height:58vh}.side{border-left:0}.legend{display:none}.packs{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.packs{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.topbar{flex-wrap:wrap}.pill{width:100%}}
</style>
</head>
<body>
<div class="app">
<main class="mapWrap"><div class="topbar"><div class="pill" id="boardTitle">🏟️ Big Four Stadium Map</div><button id="fitBtn">Fit</button><a href="/">Home</a></div><div id="map"></div><div id="routesOverlay" class="routesOverlay"></div><div id="legend" class="legend"></div></main>
<aside class="side">
<h1>K2 Map Builder</h1><div class="sub">Complete NFL, MLB, NBA and NHL venue packs. Teams sharing a venue are combined into one map location.</div>
<section class="section"><h2>Major Sports Presets</h2><div id="packs" class="packs"></div><div id="status" class="status"></div></section>
<section class="section"><h2>Loaded Data</h2><div class="stats"><div class="stat"><b id="teamCount">0</b><span>TEAMS</span></div><div class="stat"><b id="venueCount">0</b><span>VENUES</span></div><div class="stat"><b id="sharedCount">0</b><span>SHARED</span></div><div class="stat"><b id="routeCountStat">0</b><span>ROUTES</span></div></div></section>
<section class="section"><h2>Route Generator</h2><div class="row"><div class="field"><label>Total routes</label><input id="routeCount" type="number" min="0" value="72"></div><div class="field"><label>Max per venue</label><input id="maxPer" type="number" min="1" value="5"></div></div><div class="row"><div class="field"><label>Min length</label><input id="minLen" type="number" min="1" value="1"></div><div class="field"><label>Max length</label><input id="maxLen" type="number" min="1" value="6"></div></div><div class="row"><div class="field"><label>Seed</label><input id="seed" value="K2"></div><div class="field"><label>Color mode</label><select id="colorMode"><option value="balanced">Balanced</option><option value="random">Random</option><option value="gray">Gray only</option></select></div></div><div class="row"><button id="routesBtn" class="btn primary">Generate routes</button><button id="clearRoutes" class="btn soft">Clear routes</button></div></section>
<section class="section"><h2>Custom Place</h2><div class="row"><div class="field" style="grid-column:1/-1"><label>Search city, venue or address</label><input id="placeInput" placeholder="Coors Field, Parker CO..."></div></div><div class="row"><button id="searchBtn" class="btn primary">Search & add</button><button id="newBoard" class="btn danger">New custom board</button></div></section>
<section class="section"><h2>Venues</h2><div id="venueList" class="venueList"></div></section>
</aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const LEAGUES={nfl:{label:'🏈 NFL',path:'football/nfl',expected:32},mlb:{label:'⚾ MLB',path:'baseball/mlb',expected:30},nba:{label:'🏀 NBA',path:'basketball/nba',expected:30},nhl:{label:'🏒 NHL',path:'hockey/nhl',expected:32}};
const PACKS=[['big4','🏟️ Big Four','NFL + MLB + NBA + NHL'],['nfl','🏈 NFL','All 32 teams'],['mlb','⚾ MLB','All 30 teams'],['nba','🏀 NBA','All 30 teams'],['nhl','🏒 NHL','All 32 teams'],['custom','📍 Custom','Build your own']];
const COLORS={blue:'#3b82f6',green:'#35c96b',yellow:'#ffd84a',orange:'#f59a19',red:'#ef5a58',purple:'#a85de0',black:'#263442',white:'#f7fbff',gray:'#9aa9b7'},REGULAR=['blue','green','yellow','orange','red','purple','black','white'],ALL=[...REGULAR,'gray'];
let venues=[],routes=[],active='big4';
const map=L.map('map',{zoomControl:false}).setView([39.5,-98.5],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const markers=L.layerGroup().addTo(map);
function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}function seeded(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>((h=Math.imul(h^h>>>15,2246822507),h=Math.imul(h^h>>>13,3266489909),(h^h>>>16)>>>0)/4294967296)}
function dist(a,b){const R=3958.8,d=x=>x*Math.PI/180,s=Math.sin(d(b.lat-a.lat)/2)**2+Math.cos(d(a.lat))*Math.cos(d(b.lat))*Math.sin(d(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function cleanVenue(v){return (v||'').toLowerCase().replace(/\b(stadium|arena|field|park|center|centre|garden|ballpark|coliseum|forum|house|place)\b/g,'').replace(/[^a-z0-9]/g,'').trim()}
function extractTeams(json,league){const out=[];const seen=new Set();(function walk(o){if(!o)return;if(Array.isArray(o))return o.forEach(walk);if(typeof o==='object'){const t=o.team;if(t&&(t.displayName||t.name)){const id=league+':'+(t.id||t.displayName);if(!seen.has(id)){seen.add(id);out.push({id,name:t.displayName||t.name,abbr:t.abbreviation||'',venue:t.venue?.fullName||o.venue?.fullName||'',league})}}Object.values(o).forEach(walk)}})(json);return out}
async function fetchLeague(key){const l=LEAGUES[key],url=`https://site.api.espn.com/apis/site/v2/sports/${l.path}/teams?limit=1000`;const json=await fetch(url).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});const teams=extractTeams(json,key);if(teams.length<l.expected)throw Error(`Only ${teams.length}/${l.expected} teams returned`);return teams.slice(0,l.expected)}
async function geocode(q){const k='k2geo:'+q.toLowerCase();const cached=localStorage.getItem(k);if(cached)return JSON.parse(cached);const data=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)).then(r=>r.json());if(!data[0])return null;const p=[+data[0].lat,+data[0].lon];localStorage.setItem(k,JSON.stringify(p));return p}
async function teamsToVenues(teams){const groups=new Map();for(const t of teams){let key=cleanVenue(t.venue)||('team:'+t.id);if(!groups.has(key))groups.set(key,{venue:t.venue||t.name,teams:[],leagues:new Set()});const g=groups.get(key);g.teams.push(t.name);g.leagues.add(t.league)}const result=[];let i=0;for(const g of groups.values()){status.textContent=`Locating venue ${++i}/${groups.size}: ${g.venue}`;let p=await geocode(g.venue+' sports venue USA Canada').catch(()=>null);if(!p){p=await geocode(g.teams[0]+' home stadium arena').catch(()=>null)}if(p)result.push({id:uid(),name:g.venue,teams:g.teams,leagues:[...g.leagues],lat:p[0],lng:p[1]})}return result}
function mergeNearby(list){const out=[];for(const v of list){const same=out.find(x=>dist(x,v)<0.18||cleanVenue(x.name)===cleanVenue(v.name));if(same){same.teams=[...new Set([...same.teams,...v.teams])];same.leagues=[...new Set([...same.leagues,...v.leagues])];if(v.name.length>same.name.length)same.name=v.name}else out.push(v)}return out}
async function loadPack(key){active=key;routes=[];document.querySelectorAll('.pack').forEach(b=>b.classList.toggle('active',b.dataset.key===key));boardTitle.textContent=PACKS.find(x=>x[0]===key)?.[1]||'K2 Map Builder';if(key==='custom'){venues=[];status.textContent='Custom board ready.';render();return}status.textContent='Loading complete team lists…';try{const keys=key==='big4'?Object.keys(LEAGUES):[key];const arrays=await Promise.all(keys.map(fetchLeague));const teams=arrays.flat();venues=mergeNearby(await teamsToVenues(teams));status.innerHTML=`<span class="ok">Loaded ${teams.length} teams into ${venues.length} unique venues.</span>`;render();fit();generateRoutes();}catch(e){status.innerHTML=`<span class="bad">Could not load full preset: ${e.message}</span>`;venues=[];render()}}
function render(){markers.clearLayers();for(const v of venues){const html=`<div style="width:26px;height:26px;border-radius:50%;background:#12a9df;border:3px solid white;box-shadow:0 3px 9px #2455"></div>`;L.marker([v.lat,v.lng],{icon:L.divIcon({className:'',html,iconSize:[26,26],iconAnchor:[13,13]})}).bindPopup(`<b>${v.name}</b><br>${v.teams.join('<br>')}`).addTo(markers)}teamCount.textContent=venues.reduce((n,v)=>n+v.teams.length,0);venueCount.textContent=venues.length;sharedCount.textContent=venues.filter(v=>v.teams.length>1).length;routeCountStat.textContent=routes.length;venueList.innerHTML=venues.map(v=>`<div class="venue"><b>${v.name}</b><small>${v.teams.join(' • ')}</small></div>`).join('');drawRoutes()}
function fit(){if(venues.length)map.fitBounds(L.latLngBounds(venues.map(v=>[v.lat,v.lng])).pad(.12),{maxZoom:6})}
function generateRoutes(){routes=[];const desired=+routeCount.value||72,max=+maxPer.value||5,minL=+minLen.value||1,maxL=+maxLen.value||6,r=seeded(seed.value+active),degree=Object.fromEntries(venues.map(v=>[v.id,0])),pairs=[];for(let i=0;i<venues.length;i++)for(let j=i+1;j<venues.length;j++)pairs.push({a:venues[i],b:venues[j],m:dist(venues[i],venues[j])});pairs.sort((a,b)=>a.m-b.m);const pool=pairs.slice(0,Math.max(desired*8,venues.length*10)).sort(()=>r()-.5),space=Object.fromEntries(ALL.map(c=>[c,0]));for(const p of pool){if(routes.length>=desired)break;if(degree[p.a.id]>=max||degree[p.b.id]>=max)continue;degree[p.a.id]++;degree[p.b.id]++;const length=Math.max(minL,Math.min(maxL,Math.round(p.m/280)+1));let color;if(colorMode.value==='gray')color='gray';else if(colorMode.value==='random')color=ALL[Math.floor(r()*ALL.length)];else{color=routes.length%3===0?'gray':REGULAR.slice().sort((a,b)=>space[a]-space[b])[0]}space[color]+=length;routes.push({a:p.a.id,b:p.b.id,length,color})}render()}
function drawRoutes(){routesOverlay.innerHTML='';for(const rt of routes){const a=venues.find(v=>v.id===rt.a),b=venues.find(v=>v.id===rt.b);if(!a||!b)continue;const p1=map.latLngToContainerPoint([a.lat,a.lng]),p2=map.latLngToContainerPoint([b.lat,b.lng]),dx=p2.x-p1.x,dy=p2.y-p1.y,ang=Math.atan2(dy,dx)*180/Math.PI,d=Math.hypot(dx,dy),w=Math.min(40,Math.max(20,d/(rt.length+1)*.6));for(let i=1;i<=rt.length;i++){const el=document.createElement('div');el.className='routeCar';el.style.width=w+'px';el.style.background=COLORS[rt.color];el.style.left=(p1.x+dx*i/(rt.length+1)-w/2)+'px';el.style.top=(p1.y+dy*i/(rt.length+1)-8)+'px';el.style.transform=`rotate(${ang}deg)`;routesOverlay.appendChild(el)}}legend.innerHTML='<b>Route colors</b><br>'+ALL.map(c=>`<span class="sw" style="background:${COLORS[c]}"></span>${c}`).join('')}
async function addPlace(){const q=placeInput.value.trim();if(!q)return;status.textContent='Searching…';const p=await geocode(q);if(!p){status.innerHTML='<span class="bad">No location found.</span>';return}venues.push({id:uid(),name:q,teams:[q],leagues:['custom'],lat:p[0],lng:p[1]});render();fit();status.innerHTML='<span class="ok">Location added.</span>'}
packs.innerHTML=PACKS.map(p=>`<button class="pack" data-key="${p[0]}">${p[1]}<small>${p[2]}</small></button>`).join('');document.querySelectorAll('.pack').forEach(b=>b.onclick=()=>loadPack(b.dataset.key));routesBtn.onclick=generateRoutes;clearRoutes.onclick=()=>{routes=[];render()};fitBtn.onclick=fit;searchBtn.onclick=addPlace;placeInput.onkeydown=e=>{if(e.key==='Enter')addPlace()};newBoard.onclick=()=>loadPack('custom');map.on('zoom move resize',drawRoutes);loadPack('big4');
</script>
</body>
</html>
