<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Motion Arcade Controller</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#eaf5ff;font:15px system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #3c5778;background:#18324f;color:#fff;border-radius:10px;padding:11px 15px;touch-action:manipulation}button:active{transform:scale(.98)}button.active,.primary{background:#1478d4;border-color:#3ea1f4}header{padding:12px 18px;background:#102239;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0}main{max-width:1260px;margin:auto;padding:14px}.panel{background:#11253c;border:1px solid #2b4a69;border-radius:14px;padding:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{color:#a6c0d5}.good{color:#78edb5}.warn{color:#ffc579}.games{display:flex;flex-wrap:wrap;gap:7px}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:14px;background:#081629;touch-action:none}a{color:#8ad7ff}.small{font-size:13px}.grow{flex:1}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}.controlbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.controlbar button{min-width:90px}.instructions{line-height:1.5;margin:10px 0}.qr{width:92px;height:92px;background:white;padding:5px;border-radius:8px}@media(max-width:650px){header{padding:10px}main{padding:9px}.games button{padding:9px 10px;font-size:13px}.panel{padding:10px}.qr{width:74px;height:74px}}
</style><style>body{overscroll-behavior:none;touch-action:manipulation}main{max-width:640px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center;margin:22px auto}.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px;aspect-ratio:1;max-width:350px}.pad button{padding:0;font-size:clamp(22px,6vw,40px);font-weight:900;background:#284a6c;touch-action:none}.center{background:#0c1b2c;border-radius:10px}.ab{display:flex;gap:10px;align-items:center;justify-content:center}.ab button{border-radius:50%;aspect-ratio:1;width:min(43%,115px);font-size:34px;font-weight:900;touch-action:none}#a{background:#187bd3}#b{background:#a24969}button.pressed{filter:brightness(1.5)}select{background:#1c3856;color:white;padding:9px;border-radius:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.tip{text-align:center;color:#b3cce0;font-size:13px}.foot{text-align:center}@media(max-width:430px){.layout{gap:8px}.ab button{font-size:28px}.pad{gap:3px}}@media(orientation:landscape) and (max-height:520px){header{padding:6px 12px}main{padding:5px}.layout{margin:5px auto}.pad{max-width:200px}}</style></head><body><header><h1>🎮 Controller</h1><span id="status" class="good">Pairing…</span></header><main><div class="top"><b id="gameName">Bowling</b><select id="choose"><option value="0">🎳 Bowling</option><option value="1">🏎️ Racing</option><option value="2">⛳ Golf</option><option value="3">🎾 Tennis</option><option value="4">☄️ Asteroids</option><option value="5">🐍 Snake</option><option value="6">🏹 Archery</option><option value="7">🏓 Pong</option><option value="8">🧱 Brick Breaker</option></select></div><div id="gamepad" class="layout"><div class="pad"><span></span><button id="up">▲</button><span></span><button id="left">◀</button><div class="center"></div><button id="right">▶</button><span></span><button id="down">▼</button><span></span></div><div><div class="ab"><button id="b">B</button><button id="a">A</button></div><p class="tip" id="tip"></p></div></div><div class="foot"><button id="sensorEnable" hidden>Enable Motion</button> <button id="restart">↻ Restart</button> <button id="levelToggle">Enable Level</button></div><div id="levelPanel" class="panel" hidden style="margin-top:12px;text-align:center"><b>Phone tilt</b><p class="muted small">Hold the phone still and calibrate its current position as zero.</p><p id="angles">X 0° / Y 0°</p><button id="calibrate">Calibrate</button></div></main><script>
const $=id=>document.getElementById(id),room=new URLSearchParams(location.search).get('room'),keys=new Set();let peer,conn,game=0,levelEnabled=false,zeroX=0,zeroY=0,rawX=0,rawY=0,sensorReady=false,lastSwing=0,sensorPower=0,hasMotion=false;const names=['Bowling','Racing','Golf','Tennis','Asteroids','Snake','Archery','Pong','Brick Breaker'],tips=['Tilt to aim · swing to bowl','◀ ▶ steer · hold B boost','Tilt to aim · swing to putt','◀ ▶ move · A swing','◀ ▶ rotate · hold A fire · B thrust','D-pad steer · B restart','Tilt to aim · swing to fire','▲ ▼ move paddle','◀ ▶ paddle · A launch'];function send(d){if(conn&&conn.open)conn.send(d)}function status(t){$('status').textContent=t}function setGame(n){game=n;const isMotion=[0,2,6].includes(n),isHybrid=[1,3,4].includes(n);$('gameName').textContent=names[n];$('choose').value=String(n);$('gamepad').hidden=isMotion;$('sensorEnable').hidden=!(isMotion||isHybrid);$('tip').textContent=isMotion?'MOTION ONLY — Tilt to aim. Make a short, controlled swing to act.':isHybrid?'HYBRID — Tilt phone to steer; A/B for actions.':tips[n];if(isMotion||isHybrid)enableSensor();}
if(!room)status('Scan game QR');else if(typeof Peer==='undefined')status('Connection unavailable');else{peer=new Peer();peer.on('open',()=>{conn=peer.connect(room,{reliable:false});conn.on('open',()=>status('● Connected'));conn.on('data',d=>{if(d.type==='game')setGame(d.game)});conn.on('close',()=>status('Disconnected — rescan'));conn.on('error',()=>status('Connection failed'))});peer.on('error',e=>status('Pairing error: '+e.type))}
async function enableSensor(){if(sensorReady)return;try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Motion unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Motion permission required');if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw Error('Motion permission required');window.addEventListener('deviceorientation',e=>{if(e.gamma!=null)rawX=e.gamma;if(e.beta!=null)rawY=e.beta;hasMotion=true});window.addEventListener('devicemotion',e=>{const a=e.acceleration;if(!a)return;const magnitude=Math.hypot(a.x||0,a.y||0,a.z||0);sensorPower=Math.max(sensorPower*.75,magnitude);if([0,2,6].includes(game)&&magnitude>12&&Date.now()-lastSwing>900){lastSwing=Date.now();send({type:'sensor',x:Math.max(-1,Math.min(1,(rawX-zeroX)/35)),y:Math.max(-1,Math.min(1,(rawY-zeroY)/40)),swing:true,power:Math.min(1,magnitude/26)})}});sensorReady=true;$('sensorEnable').textContent='Calibrate Motion';status('● Motion enabled')}catch(e){status(e.message+' — tap Enable Motion')}}$('sensorEnable').onclick=async()=>{if(!sensorReady)await enableSensor();else{zeroX=rawX;zeroY=rawY;status('● Motion calibrated')}};$('levelToggle').onclick=async()=>{if(levelEnabled){levelEnabled=false;$('levelPanel').hidden=true;$('levelToggle').textContent='Enable Level';return}try{if(typeof DeviceOrientationEvent==='undefined')throw Error('No orientation sensor');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Permission denied');if(!window.__levelListening){window.addEventListener('deviceorientation',e=>{rawX=Number(e.gamma)||0;rawY=Number(e.beta)||0;let x=rawX-zeroX,y=rawY-zeroY;$('angles').textContent='X '+x.toFixed(1)+'° / Y '+y.toFixed(1)+'°'});window.__levelListening=true}levelEnabled=true;$('levelPanel').hidden=false;$('levelToggle').textContent='Disable Level'}catch(e){status(e.message)}};$('calibrate').onclick=()=>{zeroX=rawX;zeroY=rawY};$('choose').onchange=e=>send({type:'select',game:+e.target.value});$('restart').onclick=()=>send({type:'press',key:'restart'});
for(const key of ['up','down','left','right','a','b']){const b=$(key);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(keys.has(key))return;keys.add(key);b.classList.add('pressed');send({type:'press',key,power:.8})});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(!keys.has(key))return;keys.delete(key);b.classList.remove('pressed');send({type:'release',key})})}
setInterval(()=>{if(sensorReady&&[0,1,2,3,4,6].includes(game))send({type:'sensor',x:Math.max(-1,Math.min(1,(rawX-zeroX)/35)),y:Math.max(-1,Math.min(1,(rawY-zeroY)/40))});if(levelEnabled)send({type:'level',x:rawX-zeroX,y:rawY-zeroY});send({type:'motion',tilt:keys.has('left')?-1:keys.has('right')?1:0,gas:keys.has('b'),boost:keys.has('b'),action:keys.has('a'),dir:keys.has('up')?'up':keys.has('down')?'down':keys.has('left')?'left':keys.has('right')?'right':null})},50);setGame(0);
</script></body></html>
