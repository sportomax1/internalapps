<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Motion Arcade Controller</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#eaf5ff;font:15px system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #3c5778;background:#18324f;color:#fff;border-radius:10px;padding:11px 15px;touch-action:manipulation}button:active{transform:scale(.98)}button.active,.primary{background:#1478d4;border-color:#3ea1f4}header{padding:12px 18px;background:#102239;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0}main{max-width:1260px;margin:auto;padding:14px}.panel{background:#11253c;border:1px solid #2b4a69;border-radius:14px;padding:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{color:#a6c0d5}.good{color:#78edb5}.warn{color:#ffc579}.games{display:flex;flex-wrap:wrap;gap:7px}canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:14px;background:#081629;touch-action:none}a{color:#8ad7ff}.small{font-size:13px}.grow{flex:1}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}.controlbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.controlbar button{min-width:90px}.instructions{line-height:1.5;margin:10px 0}.qr{width:92px;height:92px;background:white;padding:5px;border-radius:8px}@media(max-width:650px){header{padding:10px}main{padding:9px}.games button{padding:9px 10px;font-size:13px}.panel{padding:10px}.qr{width:74px;height:74px}}
</style><style>body{touch-action:manipulation}main{max-width:520px}.big{width:100%;min-height:120px;font-size:22px;font-weight:800;background:#1479d3;touch-action:none;user-select:none}.meter{height:15px;background:#26415e;border-radius:15px;overflow:hidden}.meter div{height:100%;width:50%;background:#65e9bc}.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.dpad button{min-height:65px;touch-action:none;user-select:none}.full{width:100%}.controlrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}#boost{min-height:80px;background:#294f75}select{background:#1c3957;color:#fff;padding:9px;border-radius:8px}</style></head><body><header><h1>📱 Motion Controller</h1><span class="good" id="status">Pairing…</span></header><main><div class="panel"><div class="row"><b id="gameName">Bowling</b><span class="grow"></span><select id="choose"><option value="0">🎳 Bowling</option><option value="1">🏎️ Racing</option><option value="2">⛳ Golf</option><option value="3">🎾 Tennis</option><option value="4">☄️ Asteroids</option><option value="5">🐍 Snake</option></select></div><p id="tip" class="muted small"></p><div class="row"><button id="enable" class="primary">Enable Motion</button><button id="calibrate">Calibrate</button></div><p class="small muted">Tilt / steering</p><div class="meter"><div id="meter"></div></div><p id="readout" class="small">Tilt 0° • Swing 0.0</p></div><div style="height:12px"></div><button class="big" id="action">HOLD • SWING • RELEASE</button><div class="controlrow"><button id="boost">🏎️ BOOST / GAS</button><button id="restart">↻ Restart</button></div><div class="dpad"><span></span><button id="up">▲ UP</button><span></span><button id="left">◀ LEFT</button><button id="down">▼ DOWN</button><button id="right">RIGHT ▶</button></div><p class="muted small">Keep this page in the foreground. Grant motion permission on iPhone Safari. Hold your phone securely with a clear area around you. Buttons work without motion sensors.</p></main><script>
const $=id=>document.getElementById(id),room=new URLSearchParams(location.search).get('room');
let peer=null,conn=null,tilt=0,zero=0,gamma=0,motionPower=0,peak=0,holding=false,gas=false,boost=false,actionDown=false,game=0,dir=null,enabled=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function send(data){if(conn?.open)conn.send(data)}
function status(t){$('status').textContent=t}
function setGame(n){game=n;const names=['Bowling','Racing','Golf','Tennis','Asteroids','Snake'];$('gameName').textContent=names[n]||'Controller';$('action').textContent=['HOLD • SWING • RELEASE','HOLD BOOST','HOLD • SWING • RELEASE','SWING / HIT','HOLD FIRE','TURN'][n]||'ACTION';$('boost').textContent=n===4?'🚀 THRUST':'🏎️ BOOST / GAS';$('tip').textContent=['Tilt to aim; swing and release.','Tilt to steer; hold BOOST for speed.','Tilt to aim; swing and release to putt.','Tilt to position your racket; tap HIT.','Tilt to rotate; hold FIRE; hold THRUST to move.','Use directional buttons to steer the snake.'][n]||'';}
if(!room)status('Missing room — scan game QR');else if(typeof Peer==='undefined')status('PeerJS failed to load');else{peer=new Peer();peer.on('open',()=>{conn=peer.connect(room,{reliable:false});conn.on('open',()=>status('● Connected'));conn.on('data',d=>{if(d.type==='game')setGame(d.game)});conn.on('close',()=>status('Disconnected — reload controller'));conn.on('error',()=>status('Connection error'))});peer.on('error',e=>status('Pairing error: '+e.type))}
$('enable').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Motion unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Orientation denied');if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted')throw Error('Motion denied');window.addEventListener('deviceorientation',e=>{gamma=Number(e.gamma)||0;tilt=clamp((gamma-zero)/35,-1,1);$('meter').style.width=(50+tilt*50)+'%';$('readout').textContent='Tilt '+Math.round(gamma-zero)+'° • Swing '+motionPower.toFixed(1)});window.addEventListener('devicemotion',e=>{let a=e.acceleration||e.accelerationIncludingGravity;if(!a)return;let m=Math.hypot(a.x||0,a.y||0,a.z||0);motionPower=e.acceleration?m:Math.abs(m-9.81);if(holding)peak=Math.max(peak,motionPower)});enabled=true;$('enable').textContent='✓ Motion enabled'}catch(e){$('tip').textContent=e.message+' — touchscreen controls still work.'}};
$('calibrate').onclick=()=>{zero=gamma;tilt=0;$('meter').style.width='50%'};
$('choose').onchange=e=>send({type:'select',game:+e.target.value});
function pressAction(e){e.preventDefault();holding=true;actionDown=true;peak=0;try{$('action').setPointerCapture(e.pointerId)}catch{}if(game===1||game===4)send({type:'motion',tilt,gas,action:true,boost})}
function releaseAction(){if(!holding)return;holding=false;actionDown=false;send({type:'release',key:'action',power:clamp(peak/22,.3,1),tilt})}
$('action').addEventListener('pointerdown',pressAction);for(let ev of ['pointerup','pointercancel'])$('action').addEventListener(ev,releaseAction);
$('boost').addEventListener('pointerdown',e=>{gas=true;boost=true;$('boost').setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel'])$('boost').addEventListener(ev,()=>{gas=false;boost=false});
for(let key of ['left','right','up','down']){let b=$(key);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);dir=key;if(key==='left')tilt=-1;if(key==='right')tilt=1;send({type:'press',key})});for(let ev of ['pointerup','pointercancel'])b.addEventListener(ev,()=>{if(key==='left'||key==='right'){tilt=0;send({type:'release',key})}dir=null})}
$('restart').onclick=()=>send({type:'press',key:'restart'});setInterval(()=>{send({type:'motion',tilt,gas,action:actionDown,boost,dir});if(game===5)dir=null},50);setGame(0);
</script></body></html>
