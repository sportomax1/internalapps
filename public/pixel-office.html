<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Office</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef2fa}header{padding:15px 20px;border-bottom:1px solid #354257;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:21px;margin:0}a{color:#9bc7ff}main{max-width:1300px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.panel{background:#1b283a;border:1px solid #3a4b63;border-radius:14px;padding:12px}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #53647c;background:#2a3b52;color:white;border-radius:9px;padding:9px 12px;cursor:pointer;font:inherit}button.active{background:#3976b7;border-color:#87b9ed}canvas{width:100%;height:auto;image-rendering:pixelated;background:#253448;border-radius:8px;touch-action:none}h2{font-size:16px;margin:0 0 12px}.muted{color:#b6c2d3;font-size:13px}#log{font-size:12px;max-height:320px;overflow:auto}#log p{border-bottom:1px solid #354257;padding:6px 0;margin:0}.mobile{display:none;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:850px){main{grid-template-columns:1fr}.mobile{display:flex}} </style></head><body><header><h1>🏢 Pixel Office</h1><span class="muted">Interactive office simulation</span><a href="/">← All Apps</a></header><main><section class="panel"><div id="tabs" class="tabs"></div><canvas id="scene" width="960" height="576" aria-label="Interactive pixel office"></canvas><div class="mobile"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><p class="muted">Use arrow keys or WASD to move the selected character. Tap the floor to move.</p></section><aside class="panel"><h2 id="who">Character</h2><div class="actions"><button data-action="Working">Work</button><button data-action="On break">Break</button><button data-action="In meeting">Meeting</button></div><label><input id="wander" type="checkbox" checked> Other characters wander</label><h2 style="margin-top:20px">Activity</h2><div id="log"></div></aside></main><script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),tabs=document.querySelector('#tabs'),log=document.querySelector('#log');
const names=['Alex','Sam','Jordan','Taylor','Casey','Morgan'],colors=['#f59e78','#74c4f6','#c39cf4','#f2cf68','#7bd7ac','#f7a6ca'];const people=names.map((name,i)=>({name,x:100+i%3*260,y:170+Math.floor(i/3)*230,color:colors[i],status:'Idle'}));let selected=0;
function note(t){const p=document.createElement('p');p.textContent=new Date().toLocaleTimeString()+' · '+t;log.prepend(p);while(log.children.length>25)log.lastChild.remove()}
function tabsDraw(){tabs.replaceChildren();people.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.name;b.className=i===selected?'active':'';b.onclick=()=>{selected=i;tabsDraw()};tabs.append(b)});document.querySelector('#who').textContent=people[selected].name+' · '+people[selected].status}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(){rect(0,0,960,576,'#304455');for(let x=0;x<960;x+=32)for(let y=0;y<576;y+=32){rect(x+1,y+1,30,30,(x+y)%64?'#354c5d':'#395162')}rect(0,0,960,24,'#192b39');rect(0,552,960,24,'#192b39');rect(0,0,24,576,'#192b39');rect(936,0,24,576,'#192b39');for(let i=0;i<6;i++){let x=80+(i%3)*290,y=90+Math.floor(i/3)*265;rect(x,y,150,75,'#6d4b39');rect(x+8,y+7,58,40,'#151f2a');rect(x+13,y+11,48,28,'#5bb2bd');rect(x+90,y+18,40,22,'#e1d3a3');rect(x+50,y+80,52,28,'#27303d')}rect(420,255,120,75,'#5b7449');rect(430,265,100,55,'#8a9d68');for(let i=0;i<people.length;i++){let p=people[i];ctx.fillStyle=i===selected?'#ffec85':'#17212e';ctx.fillRect(p.x-5,p.y-5,30,39);rect(p.x,p.y,20,12,'#f0c59c');rect(p.x,p.y+12,20,17,p.color);rect(p.x+3,p.y+29,5,6,'#1a2535');rect(p.x+12,p.y+29,5,6,'#1a2535');ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x+10,p.y-12)}requestAnimationFrame(draw)}
function move(dx,dy){let p=people[selected];p.x=Math.max(30,Math.min(905,p.x+dx));p.y=Math.max(48,Math.min(510,p.y+dy))}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;let d={ArrowUp:[0,-16],w:[0,-16],ArrowDown:[0,16],s:[0,16],ArrowLeft:[-16,0],a:[-16,0],ArrowRight:[16,0],d:[16,0]}[e.key];if(d){e.preventDefault();move(...d)}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d={up:[0,-16],down:[0,16],left:[-16,0],right:[16,0]};move(...d[b.dataset.dir])});canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),p=people[selected];p.x=Math.max(30,Math.min(905,(e.clientX-r.left)*960/r.width));p.y=Math.max(48,Math.min(510,(e.clientY-r.top)*576/r.height))});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{people[selected].status=b.dataset.action;note(people[selected].name+' · '+b.dataset.action);tabsDraw()});setInterval(()=>{if(!document.querySelector('#wander').checked)return;people.forEach((p,i)=>{if(i!==selected){p.x=Math.max(30,Math.min(905,p.x+(Math.random()-.5)*28));p.y=Math.max(48,Math.min(510,p.y+(Math.random()-.5)*28))}})},1400);tabsDraw();note('Office ready');draw();
</script></body></html>
