<title>API Sandbox</title><meta name="theme-color" content="#07111f">
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#21344d;--text:#f4f7fb;--muted:#8fa5be;--accent:#58a6ff;--good:#3ddc97;--bad:#ff6b7a;--shadow:0 20px 60px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,#102a4a 0,transparent 30%),radial-gradient(circle at 90% 10%,#251c4a 0,transparent 25%),var(--bg);color:var(--text);min-height:100vh}.shell{max-width:1500px;margin:auto;padding:22px}.top{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.brandIcon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#1984ff,#8d62ff);font-size:25px}.brand h1{font-size:1.5rem;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.86rem}.back,.historyBtn,.viewBtn{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 10px;border-radius:9px;background:#0b192a;cursor:pointer}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px}.panel{background:rgba(13,26,43,.94);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panelHead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelHead h2{font-size:.94rem;margin:0}.small{font-size:.72rem;color:var(--muted)}.sidebar{height:calc(100vh - 112px);min-height:650px;display:flex;flex-direction:column}.search{margin:12px;border:1px solid var(--line);background:#091625;color:white;padding:11px 12px;border-radius:11px;outline:none;width:calc(100% - 24px)}.presetList{overflow:auto;padding:0 9px 12px}.groupLabel{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:#69839f;margin:14px 8px 7px}.preset{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;border:1px solid transparent;border-radius:12px;padding:9px;cursor:pointer;margin:3px 0}.preset:hover{background:#12243a;border-color:#1f3a59}.preset.active{background:#102b4a;border-color:#2b6cad}.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#162943;font-size:19px}.presetTitle{font-size:.82rem;font-weight:650}.presetSub{font-size:.68rem;color:var(--muted);margin-top:2px}.badge{font-size:.6rem;padding:3px 6px;border-radius:999px;background:#13253b;color:#9cb4cd;border:1px solid #263d58}.workspace{display:grid;grid-template-rows:auto auto 1fr;min-width:0}.request{padding:16px}.urlrow{display:grid;grid-template-columns:108px minmax(0,1fr) 110px;gap:9px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#081522;color:white;border-radius:10px;padding:11px 12px;font:inherit;outline:none}.run{border:0;border-radius:10px;background:linear-gradient(135deg,#1683ff,#7b61ff);color:white;font-weight:750;cursor:pointer}.tabs{display:flex;gap:5px;margin-top:12px;border-bottom:1px solid var(--line)}.tab{border:0;background:none;color:var(--muted);padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:white;border-color:var(--accent)}.tabPane{display:none;padding-top:12px}.tabPane.active{display:block}.kvrow{display:grid;grid-template-columns:1fr 1fr 34px;gap:7px;margin-bottom:7px}.miniBtn{border:1px solid var(--line);background:#122238;color:#b7c7d8;border-radius:8px;cursor:pointer}.addBtn{margin-top:4px;border:1px dashed #365472;background:transparent;color:#a9c4df;padding:7px 10px;border-radius:8px;cursor:pointer}.textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}.note{background:#0b2239;border:1px solid #1c4568;padding:10px 12px;border-radius:10px;color:#a9c9e6;font-size:.75rem;line-height:1.5}.stats{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0a1726}.stat{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 8px}.stat strong{color:white}.status.good strong{color:var(--good)}.status.bad strong{color:var(--bad)}.responseToolbar{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.viewBtns{display:flex;gap:5px;flex-wrap:wrap}.responseBody{overflow:auto;max-height:calc(100vh - 450px);min-height:300px;background:#07121f}.code{margin:0;padding:16px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}.placeholder{display:grid;place-items:center;text-align:center;color:var(--muted);padding:55px}.placeholder b{display:block;color:#d9e6f3;font-size:1.05rem;margin-bottom:7px}.history{position:fixed;right:18px;top:78px;width:350px;max-height:70vh;background:#0c192a;border:1px solid var(--line);border-radius:15px;box-shadow:0 24px 80px #0008;z-index:20;display:none;overflow:hidden}.history.open{display:block}.historyHead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.historyList{max-height:58vh;overflow:auto;padding:8px}.hist{padding:9px;border-radius:9px;cursor:pointer}.hist:hover{background:#13263e}.histTop{display:flex;justify-content:space-between;font-size:.72rem}.histUrl{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);opacity:0;background:#182b43;border:1px solid #36516d;padding:9px 13px;border-radius:9px;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.shell{padding:12px}.layout{grid-template-columns:1fr}.sidebar{height:auto;min-height:0}.presetList{display:flex;overflow:auto;gap:7px;padding:3px 10px 12px}.groupLabel{display:none}.preset{min-width:205px}.responseBody{max-height:none}.brand p{display:none}}@media(max-width:600px){.urlrow{grid-template-columns:86px 1fr}.run{grid-column:1/-1;height:42px}.hi <body><div class="shell"><div class="top"><div class="brand"><div class="brandIcon">⚡</div><div><h1>API Sandbox</h1><p>Test public APIs, inspect responses, timing, payloads and request formats.</p></div></div><div style="display:flex;gap:8px"><button id="historyBtn" class="historyBtn">History</button><a class="back" href="/">← Apps</a></div></div>
<div class="layout"><aside class="panel sidebar"><div class="panelHead"><h2>API Library</h2><span id="apiCount" class="small"></span></div><input id="presetSearch" class="search" placeholder="Search APIs, categories…"><div id="presetList" class="presetList"></div></aside>
<main class="panel workspace"><div class="request"><div class="urlrow"><select id="method" class="select"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option></select><input id="url" class="input" placeholder="https://api.example.com/data"><button id="run" class="run">▶ Send</button></div><div class="tabs"><button class="tab active" data-tab="params">Params</button><button class="tab" data-tab="headers">Headers</button><button class="tab" data-tab="body">Body</button><button class="tab" data-tab="about">About</button></div><div id="params" class="tabPane active"><div id="paramsRows"></div><button class="addBtn" data-add="params">+ parameter</button></div><div id="headers" class="tabPane"><div id="headersRows"></div><button class="addBtn" data-add="headers">+ header</button></div><div id="body" class="tabPane"><textarea id="bodyText" class="textarea" spellcheck="false" placeholder='{"name":"test"}'></textarea></div><div id="about" class="tabPane"><div id="aboutText" class="note"></div></div></div>
<div class="stats"><div class="stat status"><span>Status </span><strong>—</strong></div><div class="stat"><span>Time </span><strong id="timeStat">—</strong></div><div class="stat"><span>Size </span><strong id="sizeStat">—</strong></div><div class="stat"><span>Type </span><strong id="typeStat">—</strong></div><div class="stat"><span>Rows </span><strong id="rowsStat">—</strong></div></div><section><div class="responseToolbar"><strong style="font-size:.84rem">Response</strong><div class="viewBtns"><button class="viewBtn active" data-view="pretty">Pretty</button><button class="viewBtn" data-view="raw">Raw</button><button id="copyBtn" class="viewBtn">Copy</button><button id="curlBtn" class="viewBtn">cURL</button></div></div><div id="responseBody" class="responseBody"><div class="placeholder"><div><b>Ready to explore</b>Choose an API and press Send.</div></div></div></section></main></div></div>
<div id="history" class="history"><div class="historyHead"><strong>Request history</strong><button id="clearHistory" class="viewBtn">Clear</button></div><div id="historyList" class="historyList"></div></div><div id="toast" class="toast">Copied</div>
<script>
const presets=[
{group:'Weather & Location',id:'weather',icon:'🌦️',title:'Open-Meteo Weather',sub:'Current weather',method:'GET',url:'https://api.open-meteo.com/v1/forecast',params:[['latitude','39.5186'],['longitude','-104.7614'],['current','temperature_2m,apparent_temperature,wind_speed_10m'],['temperature_unit','fahrenheit']],about:'No-key weather forecast. Current Parker, Colorado conditions.'},

{group:'Shopping & Products',id:'productsearch',icon:'🔎',title:'DummyJSON Search',sub:'Product search',method:'GET',url:'https://dummyjson.com/products/search',params:[['q','phone']],about:'Search a demo product catalog.'},

{group:'Sports & Aviation',id:'metar',icon:'🛫',title:'Aviation Weather',sub:'KDEN METAR',method:'GET',url:'https://aviationweather.gov/api/data/metar',params:[['ids','KDEN'],['format','json']],about:'FAA/NOAA aviation-weather style data for Denver International Airport.'},
{group:'Money & Markets',id:'crypto',icon:'🪙',title:'CoinGecko',sub:'Crypto prices',method:'GET',url:'https://api.coingecko.com/api/v3/simple/price',params:[['ids','bitcoin,ethereum'],['vs_currencies','usd']],about:'Public crypto market data; free access is rate limited.'},
{group:'Money & Markets',id:'currency',icon:'💱',title:'Frankfurter FX',sub:'Currency rates',method:'GET',url:'https://api.frankfurter.app/latest',params:[['from','USD'],['to','EUR,GBP,CAD']],about:'No-key foreign-exchange reference rates.'},

{group:'Books, Media & Food',id:'books',icon:'📚',title:'Open Library',sub:'Book search',method:'GET',url:'https://openlibrary.org/search.json',params:[['q','board games'],['limit','5']],about:'Books, authors, editions and identifiers.'},
{group:'Books, Media & Food',id:'itunes',icon:'🎵',title:'iTunes Search',sub:'Music/media search',method:'GET',url:'https://itunes.apple.com/search',params:[['term','Daft Punk'],['limit','5'],['media','music']],about:'Apple iTunes Search API for music and media metadata.'},
{group:'Books, Media & Food',id:'meal',icon:'🍽️',title:'TheMealDB',sub:'Meal search',method:'GET',url:'https://www.themealdb.com/api/json/v1/1/search.php',params:[['s','chicken']],about:'Recipe and meal database with a public development endpoint.'},
{group:'Books, Media & Food',id:'cocktail',icon:'🍹',title:'TheCocktailDB',sub:'Drink search',method:'GET',url:'https://www.thecocktaildb.com/api/json/v1/1/search.php',params:[['s','margarita']],about:'Cocktail and ingredient database using its public development endpoint.'},
{group:'Science & Public Data',id:'earthquake',icon:'🌋',title:'USGS Earthquakes',sub:'Live GeoJSON',method:'GET',url:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',params:[],about:'USGS earthquakes from the last day.'},
{group:'Science & Public Data',id:'nasa',icon:'🚀',title:'NASA Open Data',sub:'NASA dataset search',method:'GET',url:'https://images-api.nasa.gov/search',params:[['q','mars'],['media_type','image']],about:'NASA Images API search; no API key required for this endpoint.'},
{group:'Science & Public Data',id:'gbif',icon:'🦋',title:'GBIF Species',sub:'Biodiversity search',method:'GET',url:'https://api.gbif.org/v1/species/search',params:[['q','Puma concolor'],['limit','5']],about:'Global biodiversity/species search.'},
{group:'Science & Public Data',id:'nps',icon:'🏞️',title:'National Park Service',sub:'API-key example',method:'GET',url:'https://developer.nps.gov/api/v1/parks',params:[['stateCode','CO'],['limit','5']],headers:[['X-Api-Key','YOUR_FREE_NPS_API_KEY']],about:'NPS is a useful FREE-key API example. Replace YOUR_FREE_NPS_API_KEY with a free NPS key. Do not commit a private production key to a public repo.'},
{group:'Countries & People',id:'country',icon:'🌎',title:'REST Countries',sub:'Country lookup',method:'GET',url:'https://restcountries.com/v3.1/name/canada',params:[['fields','name,capital,population,flags,currencies']],about:'Country metadata including capitals, flags and currencies.'},
{group:'Countries & People',id:'age',icon:'🎂',title:'Agify',sub:'Age estimate',method:'GET',url:'https://api.agify.io',params:[['name','kevin']],about:'Estimates age distribution from a first name.'},
{group:'Countries & People',id:'gender',icon:'👤',title:'Genderize',sub:'Name estimate',method:'GET',url:'https://api.genderize.io',params:[['name','alex']],about:'Name-based demographic estimate. Free usage is limited.'},

{group:'Developer & Testing',id:'jsonplaceholder',icon:'🧪',title:'JSONPlaceholder GET',sub:'Fake REST',method:'GET',url:'https://jsonplaceholder.typicode.com/posts',params:[['_limit','5']],about:'Classic fake REST API.'},
{group:'Developer & Testing',id:'post',icon:'📤',title:'JSONPlaceholder POST',sub:'POST JSON body',method:'POST',url:'https://jsonplaceholder.typicode.com/posts',params:[],headers:[['Content-Type','application/json']],body:'{\n  "title": "API Sandbox test",\n  "body": "Hello from Internal Apps",\n  "userId": 1\n}',about:'Tests a JSON POST request.'},
{group:'Developer & Testing',id:'httpbin',icon:'🪞',title:'HTTPBin Anything',sub:'Echo request details',method:'GET',url:'https://httpbin.org/anything',params:[['hello','world']],about:'Echoes request method, headers, URL and parameters.'},
{group:'Developer & Testing',id:'uuid',icon:'🆔',title:'Random UUID',sub:'Tiny JSON API',method:'GET',url:'https://httpbin.org/uuid',params:[],about:'Returns a generated UUID; useful as a minimal response test.'},
{group:'Custom',id:'custom',icon:'🛠️',title:'Custom Request',sub:'Any CORS-enabled API',method:'GET',url:'https://jsonplaceholder.typicode.com/todos/1',params:[],about:'Build your own request. Browser CORS rules apply. Never expose secret production API keys in this public client-side app.'}
];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let lastRaw='',lastPretty='',currentPreset='weather';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPresets(filter=''){const list=$('#presetList');list.innerHTML='';let last='';const f=filter.toLowerCase();const shown=presets.filter(p=>(p.title+' '+p.sub+' '+p.group+' '+p.about).toLowerCase().includes(f));$('#apiCount').textContent=`${shown.length}/${presets.length} APIs`;shown.forEach(p=>{if(p.group!==last){const g=document.createElement('div');g.className='groupLabel';g.textContent=p.group;list.appendChild(g);last=p.group}const el=document.createElement('div');el.className='preset'+(p.id===currentPreset?' active':'');el.innerHTML=`<div class="ico">${p.icon}</div><div><div class="presetTitle">${esc(p.title)}</div><div class="presetSub">${esc(p.sub)}</div></div><span class="badge">${p.method}</span>`;el.onclick=()=>loadPreset(p.id);list.appendChild(el)})}
function addKV(container,key='',value=''){const row=document.createElement('div');row.className='kvrow';row.innerHTML=`<input class="input key" placeholder="Key" value="${esc(key)}"><input class="input value" placeholder="Value" value="${esc(value)}"><button class="miniBtn">×</button>`;row.querySelector('button').onclick=()=>row.remove();$(container).appendChild(row)}
function setRows(container,rows=[]){$(container).innerHTML='';(rows.length?rows:[['','']]).forEach(([k,v])=>addKV(container,k,v))}
function getRows(container){return $$(container+' .kvrow').map(r=>[r.querySelector('.key').value.trim(),r.querySelector('.value').value]).filter(([k])=>k)}
function loadPreset(id){const p=presets.find(x=>x.id===id);currentPreset=id;$('#method').value=p.method;$('#url').value=p.url;setRows('#paramsRows',p.params||[]);setRows('#headersRows',p.headers||[]);$('#bodyText').value=p.body||'';$('#aboutText').textContent=p.about;renderPresets($('#presetSearch').value)}
function buildUrl(){const u=new URL($('#url').value.trim());getRows('#paramsRows').forEach(([k,v])=>u.searchParams.set(k,v));return u.toString()}
function jsonRows(data){if(Array.isArray(data))return data.length;if(data&&typeof data==='object'){for(const k of ['results','items','data','features','products','games'])if(Array.isArray(data[k]))return data[k].length;return Object.keys(data).length}return '—'}
async function send(){let url;try{url=buildUrl()}catch{return toast('Invalid URL')}const method=$('#method').value,headers=Object.fromEntries(getRows('#headersRows')),bodyText=$('#bodyText').value.trim(),options={method,headers};if(!['GET','HEAD'].includes(method)&&bodyText)options.body=bodyText;const btn=$('#run');btn.disabled=true;btn.textContent='Sending…';const start=performance.now();try{const res=await fetch(url,options),ms=Math.round(performance.now()-start),text=await res.text();lastRaw=text;let parsed=null;try{parsed=JSON.parse(text)}catch{}lastPretty=parsed?JSON.stringify(parsed,null,2):text;showResponse(lastPretty);const bytes=new Blob([text]).size,status=$('.status');status.className='stat status '+(res.ok?'good':'bad');status.querySelector('strong').textContent=`${res.status} ${res.statusText}`;$('#timeStat').textContent=ms+' ms';$('#sizeStat').textContent=bytes<1024?bytes+' B':(bytes/1024).toFixed(1)+' KB';$('#typeStat').textContent=(res.headers.get('content-type')||'unknown').split(';')[0];$('#rowsStat').textContent=parsed?jsonRows(parsed):'—';saveHistory({method,url,status:res.status,ms,time:Date.now()})}catch(err){lastRaw=lastPretty=String(err);showResponse(`Request failed\n\n${err}\n\nLikely causes:\n• Browser CORS policy\n• API authentication/key required\n• Rate limit\n• Network failure\n• Endpoint does not allow direct browser calls`);const status=$('.status');status.className='stat status bad';status.querySelector('strong').textContent='Request failed';$('#timeStat').textContent=Math.round(performance.now()-start)+' ms';$('#sizeStat').textContent=$('#typeStat').textContent=$('#rowsStat').textContent='—';saveHistory({method,url,status:'ERR',time:Date.now()})}finally{btn.disabled=false;btn.textContent='▶ Send';renderHistory()}}
function showResponse(text){$('#responseBody').innerHTML=`<pre class="code">${esc(text)}</pre>`}
function curl(){let url;try{url=buildUrl()}catch{return ''}let c=`curl -X ${$('#method').value} '${url}'`;getRows('#headersRows').forEach(([k,v])=>c+=` \\\n  -H '${k}: ${v}'`);const b=$('#bodyText').value.trim();if(!['GET','HEAD'].includes($('#method').value)&&b)c+=` \\\n  -d '${b.replace(/'/g,"'\\''")}'`;return c}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1500)}
function saveHistory(item){const h=JSON.parse(localStorage.getItem('apiSandboxHistory')||'[]');h.unshift(item);localStorage.setItem('apiSandboxHistory',JSON.stringify(h.slice(0,40)))}
function renderHistory(){const h=JSON.parse(localStorage.getItem('apiSandboxHistory')||'[]');$('#historyList').innerHTML=h.length?h.map(x=>`<div class="hist"><div class="histTop"><strong>${x.method} · ${x.status}</strong><span>${new Date(x.time).toLocaleTimeString()}</span></div><div class="histUrl">${esc(x.url)}</div></div>`).join(''):'<div style="padding:25px;color:#8fa5be;text-align:center">No requests yet.</div>'}
