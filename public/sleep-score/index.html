<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sleep Score</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#080b16;--surface:#111729;--surface2:#171f35;--border:rgba(255,255,255,.09);--text:#f7f8ff;--muted:#9aa4bd;--blue:#6c8cff;--purple:#9b79ff;--green:#39d98a;--yellow:#ffc857;--red:#ff647c}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,rgba(108,140,255,.22),transparent 35%),radial-gradient(circle at 100% 0,rgba(155,121,255,.16),transparent 30%),var(--bg);color:var(--text);min-height:100vh}.hidden{display:none!important}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:20px 20px 80px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--blue),var(--purple))}h1{font-size:1.35rem;margin:0}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:.8rem;margin-top:3px}.back{color:var(--muted);text-decoration:none;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03)}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}.range{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);padding:5px;border-radius:14px}.range button,.refresh{border:0;color:var(--muted);background:transparent;padding:9px 13px;border-radius:10px;cursor:pointer}.range button.active{color:white;background:var(--surface2)}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03)}.refresh{margin-left:auto;color:white;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:rgba(17,23,41,.84);border:1px solid var(--border);border-radius:20px}.stat{padding:18px}.label{font-size:.76rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.value{font-size:1.75rem;font-weight:800;margin-top:8px}.detail{font-size:.78rem;color:var(--muted);margin-top:5px}.tabs{display:flex;gap:6px;padding:6px;margin-bottom:14px;overflow:auto}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--surface2);color:white}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-title{font-weight:800}.panel-note{color:var(--muted);font-size:.76rem}.rows{display:flex;flex-direction:column;gap:9px}.row{display:grid;grid-template-columns:92px minmax(150px,1fr) 70px 92px 92px;gap:12px;align-items:center;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.055)}.row.blank{opacity:.55;border-style:dashed}.date{font-weight:700;font-size:.84rem}.bar-track{height:14px;border-radius:999px;background:#202941;overflow:hidden}.bar{height:100%;border-radius:999px;min-width:2px}.blank-track{height:100%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 8px,rgba(255,255,255,.02) 8px 16px)}.score{font-weight:800;text-align:right}.time{color:#dce1f2;font-size:.8rem;text-align:right}.nap-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.nap-card{padding:16px}.nap-time{font-size:1.5rem;font-weight:800;margin:10px 0 4px}.empty,.loading{text-align:center;padding:45px;color:var(--muted)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);padding:28px}.login input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:#0c1120;color:white;margin:10px 0}.login button{width:100%;border:0;border-radius:12px;padding:13px;color:white;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800}.error{color:#ff8da0;font-size:.82rem;margin-top:10px}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:78px 1fr 52px}.row .bed,.row .wake{display:none}}@media(max-width:520px){.shell{padding:15px 12px 70px}.summary{gap:8px}.stat{padding:14px}.value{font-size:1.4rem}.row{grid-template-columns:72px 1fr 48px;gap:8px;padding:10px}.panel{padding:12px}.refresh{margin-left:0}}
</style>
</head>
<body>
<section id="loginView" class="login-wrap"><div class="login card"><div class="brand-icon">🌙</div><h2>Sleep Score</h2><p class="muted">Nightly score, bedtime, wake time, total sleep, and separate nap tracking.</p><form id="loginForm"><input id="password" type="password" placeholder="Internal Apps password" required><button type="submit">Unlock Sleep Data</button></form><div id="loginError" class="error"></div></div></section>
<main id="appView" class="shell hidden">
<header class="topbar"><div class="brand"><div class="brand-icon">🌙</div><div><h1>Sleep Score</h1><div class="subtitle" id="updated">Nightly sleep and nap tracking</div></div></div><a class="back" href="/">Back to Apps</a></header>
<div class="controls"><div class="range"><button data-days="7">7D</button><button data-days="30" class="active">30D</button><button data-days="90">90D</button><button data-days="365">1Y</button></div><label class="toggle"><input id="hideBlankDays" type="checkbox">Hide blank days</label><button id="refresh" class="refresh">Refresh</button></div>
<section class="summary"><div class="stat card"><div class="label">Average Score</div><div id="avgScore" class="value">—</div><div id="scoreDetail" class="detail">No data</div></div><div class="stat card"><div class="label">Average Sleep</div><div id="avgSleep" class="value">—</div><div class="detail">Main sleep only</div></div><div class="stat card"><div class="label">Average Bedtime</div><div id="avgBed" class="value">—</div><div class="detail">Main sleep start</div></div><div class="stat card"><div class="label">Naps</div><div id="napCount" class="value">—</div><div id="napDetail" class="detail">Selected range</div></div></section>
<nav class="tabs card"><button class="tab active" data-tab="scores">Sleep Scores</button><button class="tab" data-tab="schedule">Bed & Wake</button><button class="tab" data-tab="duration">Total Sleep</button><button class="tab" data-tab="naps">Naps</button></nav>
<section class="card panel"><div id="loading" class="loading">Loading sleep data…</div><div id="content"></div></section>
</main>
<script>
const state={password:sessionStorage.getItem('sleepScorePassword')||'',days:30,data:[],tab:'scores',hideBlankDays:false};
const $=id=>document.getElementById(id);const fmtDate=d=>new Date(`${d}T12:00:00`).toLocaleDateString(undefined,{month:'short',day:'numeric'});const fmtTime=v=>v?new Date(v).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
function fmtDuration(s){if(!Number.isFinite(s)||s<=0)return'—';return`${Math.floor(s/3600)}h ${Math.round((s%3600)/60)}m`}
function average(a){const v=a.filter(Number.isFinite);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}
function scoreColor(score){if(!Number.isFinite(score))return'var(--muted)';if(score>=85)return'var(--green)';if(score>=70)return'var(--yellow)';return'var(--red)'}
function dateKey(d){return d.toISOString().slice(0,10)}
function fullDateRange(){const map=new Map(state.data.map(d=>[d.day,d]));const end=new Date();end.setHours(12,0,0,0);const out=[];for(let i=state.days-1;i>=0;i--){const d=new Date(end);d.setDate(end.getDate()-i);const key=dateKey(d);out.push(map.get(key)||{day:key,sleepScore:null,mainSleep:null,naps:[],blank:true})}return out}
function visibleRows(){const rows=fullDateRange();return(state.hideBlankDays?rows.filter(d=>d.mainSleep||Number.isFinite(d.sleepScore)||(d.naps||[]).length):rows).reverse()}
function avgClock(values){const mins=values.filter(Boolean).map(v=>{const d=new Date(v);let m=d.getHours()*60+d.getMinutes();if(m<720)m+=1440;return m});if(!mins.length)return null;let m=Math.round(average(mins))%1440;const d=new Date();d.setHours(Math.floor(m/60),m%60,0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
async function load(){ $('loading').classList.remove('hidden');$('content').innerHTML='';const end=new Date(),start=new Date();start.setDate(end.getDate()-state.days+1);try{const r=await fetch(`/api/sleep-score?start=${dateKey(start)}&end=${dateKey(end)}`,{headers:{'x-app-password':state.password}});const body=await r.json();if(!r.ok)throw new Error(body.error||'Unable to load data');state.data=body.days||[];sessionStorage.setItem('sleepScorePassword',state.password);$('updated').textContent=`Updated ${new Date(body.fetchedAt).toLocaleString()}`;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');render()}catch(e){$('loginError').textContent=e.message}finally{$('loading').classList.add('hidden')}}
function renderSummary(){const main=state.data.filter(d=>d.mainSleep);const scores=state.data.map(d=>d.sleepScore);const avgScore=average(scores),avgSecs=average(main.map(d=>d.mainSleep.totalSleepSeconds));const naps=state.data.flatMap(d=>d.naps||[]);$('avgScore').textContent=avgScore===null?'—':Math.round(avgScore);$('avgScore').style.color=scoreColor(avgScore);$('scoreDetail').textContent=`${scores.filter(Number.isFinite).length} scored nights`;$('avgSleep').textContent=fmtDuration(avgSecs);$('avgBed').textContent=avgClock(main.map(d=>d.mainSleep.bedtimeStart))||'—';$('napCount').textContent=naps.length;$('napDetail').textContent=naps.length?`${fmtDuration(naps.reduce((s,n)=>s+n.totalSleepSeconds,0))} total`:'No naps detected'}
function rows(metric){const data=visibleRows();if(!data.length)return'<div class="empty">No sleep data in this range.</div>';return`<div class="rows">${data.map(d=>{const main=d.mainSleep;const blank=!main&&!Number.isFinite(d.sleepScore);let label='—',bar='<div class="blank-track"></div>',color='';if(metric==='score'&&Number.isFinite(d.sleepScore)){const pct=Math.max(0,Math.min(100,d.sleepScore));color=scoreColor(d.sleepScore);label=d.sleepScore;bar=`<div class="bar" style="width:${pct}%;background:${color}"></div>`}else if(metric==='duration'&&main){const v=main.totalSleepSeconds||0;label=fmtDuration(v);bar=`<div class="bar" style="width:${Math.min(100,v/(10*3600)*100)}%;background:var(--blue)"></div>`}else if(metric==='schedule'&&main){const hrs=Math.max(0,Math.min(12,(new Date(main.bedtimeEnd)-new Date(main.bedtimeStart))/3600000));label=`${fmtTime(main.bedtimeStart)} → ${fmtTime(main.bedtimeEnd)}`;bar=`<div class="bar" style="width:${Math.min(100,hrs/12*100)}%;background:var(--purple)"></div>`}return`<div class="row ${blank?'blank':''}"><div class="date">${fmtDate(d.day)}</div><div class="bar-track">${bar}</div><div class="score" style="color:${color||'inherit'}">${label}</div><div class="time bed">${main?fmtTime(main.bedtimeStart):'—'}</div><div class="time wake">${main?fmtTime(main.bedtimeEnd):'—'}</div></div>`}).join('')}</div>`}
function naps(){const items=[...state.data].reverse().flatMap(d=>(d.naps||[]).map(n=>({...n,day:d.day})));if(!items.length)return'<div class="empty">No naps detected in this range.</div>';return`<div class="nap-list">${items.map(n=>`<article class="nap-card card"><strong>${fmtDate(n.day)}</strong><div class="nap-time">${fmtDuration(n.totalSleepSeconds)}</div><div class="muted">${fmtTime(n.bedtimeStart)} – ${fmtTime(n.bedtimeEnd)}</div></article>`).join('')}</div>`}
function render(){renderSummary();let title,note,html;if(state.tab==='scores'){title='Daily Sleep Scores';note='Bar length = score · low red · mid yellow · high green';html=rows('score')}else if(state.tab==='schedule'){title='Bedtime and Wake Time';note='Main sleep only';html=rows('schedule')}else if(state.tab==='duration'){title='Nightly Total Sleep';note='Naps excluded';html=rows('duration')}else{title='Nap History';note='Separated from nightly sleep';html=naps()}$('content').innerHTML=`<div class="panel-head"><div class="panel-title">${title}</div><div class="panel-note">${note}</div></div>${html}`}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();state.password=$('password').value;load()});document.querySelectorAll('[data-days]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.days=Number(b.dataset.days);load()}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.tab=b.dataset.tab;render()}));$('hideBlankDays').addEventListener('change',e=>{state.hideBlankDays=e.target.checked;render()});$('refresh').addEventListener('click',load);if(state.password)load();
</script>
</body>
</html>
