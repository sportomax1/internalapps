<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cruise Explorer</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#06121d;color:#eef7fb}header{padding:18px 22px;background:linear-gradient(120deg,#073a57,#087e9e);display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}h1{margin:0;font-size:21px}.pill{background:#08755d;padding:5px 9px;border-radius:99px;font-size:11px}.home{margin-left:auto;color:white;text-decoration:none}.wrap{max-width:1400px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel,.result{background:#0d1d29;border:1px solid #233b4a;border-radius:15px}.stat{padding:14px}.num{font-size:22px;font-weight:800}.muted{color:#91a9b8;font-size:12px}.panel{padding:16px;margin:14px 0}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{display:block;color:#9eb1bd;font-size:11px;margin:0 0 5px}input,select,button{width:100%;padding:10px;border-radius:9px;border:1px solid #34505f;background:#071721;color:#fff}button{background:#0780a5;border:0;font-weight:700;cursor:pointer}.quick,.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.quick button,.tabs button{width:auto;background:#163646}.tabs button.active{background:#0780a5}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:11px}.result{padding:15px}.result h3{margin:0 0 4px;font-size:16px}.price{font-size:20px;font-weight:800;margin:10px 0}.route{margin:9px 0}.tag{display:inline-block;background:#17394a;border-radius:99px;padding:4px 7px;margin:2px;font-size:11px}.empty{padding:35px;text-align:center;color:#91a9b8}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar select{width:auto;margin-left:auto}.hidden{display:none}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:18px}.modal.open{display:grid}.modalbox{background:#0c1d29;border:1px solid #355063;border-radius:18px;padding:20px;max-width:720px;width:100%;max-height:85vh;overflow:auto}.close{float:right;width:auto;background:#263d4a}.linegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.line{padding:12px;background:#102735;border-radius:10px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:520px){.filters{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><header><h1>🚢 Cruise Explorer</h1><span class="pill">FREE · NO KEY</span><a class="home" href="/">⌂ Apps</a></header><div class="wrap">
<div class="stats"><div class="stat"><div class="num">70K+</div><div class="muted">voyages cataloged</div></div><div class="stat"><div class="num">678</div><div class="muted">ships</div></div><div class="stat"><div class="num">62</div><div class="muted">cruise lines</div></div><div class="stat"><div class="num">6,700+</div><div class="muted">ports</div></div></div>
<div class="panel"><div class="tabs"><button class="active" onclick="view('cruises',this)">Find Cruises</button><button onclick="view('lines',this)">Cruise Lines</button><button onclick="view('ships',this)">Ships</button></div>
<div id="cruises"><div class="filters"><div><label>DESTINATION</label><input id="destination" placeholder="Caribbean"></div><div><label>DEPARTURE PORT</label><input id="departureCity" placeholder="Miami"></div><div><label>CRUISE LINE</label><input id="brandName" placeholder="Royal Caribbean"></div><div><label>MONTH</label><input id="monthFrom" type="month"></div><div><label>MIN NIGHTS</label><input id="minNights" type="number" min="1" placeholder="3"></div><div><label>MAX NIGHTS</label><input id="maxNights" type="number" min="1" placeholder="14"></div><div><label>MAX PRICE / PERSON</label><input id="maxPrice" type="number" placeholder="3000"></div><div><label>PORT OF CALL</label><input id="viaCity" placeholder="Cozumel"></div></div>
<div class="quick"><button onclick="preset('Caribbean')">🏝 Caribbean</button><button onclick="preset('Alaska')">🏔 Alaska</button><button onclick="preset('Mediterranean')">☀ Mediterranean</button><button onclick="preset('Bahamas')">🌴 Bahamas</button><button onclick="preset('Northern Europe')">🏰 N. Europe</button><button onclick="clearF()">Clear</button></div><button onclick="searchCruises()">Search voyages</button></div>
<div id="lines" class="hidden"><div class="toolbar"><b>Browse cruise lines</b><select id="tier" onchange="loadLines()"><option value="">All tiers</option><option value="popular">Popular</option><option value="luxury">Luxury</option><option value="ultra_luxury">Ultra luxury</option></select></div><div id="linegrid" class="linegrid"></div></div>
<div id="ships" class="hidden"><div class="filters"><div><label>SHIP</label><input id="shipName" placeholder="Icon"></div><div><label>LINE</label><input id="shipBrand" placeholder="Royal Caribbean"></div><div><label>TYPE</label><select id="shipType"><option value="">Any</option><option>ocean</option><option>river</option><option>expedition</option></select></div><div style="align-self:end"><button onclick="loadShips()">Search ships</button></div></div><div id="shipgrid" class="results" style="margin-top:12px"></div></div></div>
<div class="toolbar"><b id="heading">Cruise results</b><span id="status" class="muted"></span><select id="sort" onchange="render()"><option value="date">Departure date</option><option value="price">Lowest price</option><option value="nights">Shortest cruise</option><option value="line">Cruise line</option></select></div><div id="results" class="results"><div class="empty">Choose filters above, or tap a destination.</div></div></div>
<div id="modal" class="modal" onclick="if(event.target===this)this.classList.remove('open')"><div class="modalbox"><button class="close" onclick="modal.classList.remove('open')">✕</button><div id="detail"></div></div></div>
<script>
const $=id=>document.getElementById(id);let voyages=[];
function view(id,b){['cruises','lines','ships'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='lines')loadLines();if(id==='ships')loadShips()}
function preset(x){$('destination').value=x;searchCruises()}function clearF(){['destination','departureCity','brandName','monthFrom','minNights','maxNights','maxPrice','viaCity'].forEach(x=>$(x).value='')}
function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function arr(d){return Array.isArray(d)?d:(d.voyages||d.results||d.data||d.items||[])}
async function api(type,p={}){const q=new URLSearchParams({type,...p});const r=await fetch('/api/cruise?'+q);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function searchCruises(){const p={};['destination','departureCity','brandName','monthFrom','minNights','maxNights','maxPrice','viaCity'].forEach(k=>{if($(k).value)p[k]=$(k).value});$('status').textContent='Searching…';try{voyages=arr(await api('voyages',p));$('status').textContent=voyages.length+' voyages';render()}catch(e){$('status').textContent='Cruise service unavailable: '+e.message}}
function val(v,...ks){for(const k of ks)if(v?.[k]!=null&&v[k]!=='')return v[k];return''}
function render(){let a=[...voyages],s=$('sort').value;if(s==='price')a.sort((x,y)=>(+val(x,'price','fromPrice','lowestPrice')||1e9)-(+val(y,'price','fromPrice','lowestPrice')||1e9));if(s==='nights')a.sort((x,y)=>(+val(x,'nights','duration')||99)-(+val(y,'nights','duration')||99));if(s==='line')a.sort((x,y)=>val(x,'brandName','brand','cruiseLine').localeCompare(val(y,'brandName','brand','cruiseLine')));if(s==='date')a.sort((x,y)=>String(val(x,'departureDate','date')).localeCompare(String(val(y,'departureDate','date'))));$('results').innerHTML=a.length?a.slice(0,100).map((v,i)=>{let ship=val(v,'shipName','ship','name')||'Cruise',line=val(v,'brandName','brand','cruiseLine'),dep=val(v,'departureCity','departurePort','embarkPort'),arrv=val(v,'arrivalCity','arrivalPort','disembarkPort'),date=val(v,'departureDate','date'),n=val(v,'nights','duration'),price=val(v,'price','fromPrice','lowestPrice');return '<div class="result" onclick="details('+i+')"><h3>'+esc(ship)+'</h3><b>'+esc(line)+'</b><div class="route">'+esc(dep)+(arrv?' → '+esc(arrv):'')+'</div><span class="tag">'+esc(date||'Date n/a')+'</span>'+(n?'<span class="tag">'+esc(n)+' nights</span>':'')+(price?'<div class="price">From $'+Number(price).toLocaleString()+'</div>':'<div class="price muted">Price unavailable</div>')+'<div class="muted">Tap for details →</div></div>'}).join(''):'<div class="empty">No voyages matched those filters.</div>'}
function details(i){const v=voyages[i]||{};$('detail').innerHTML='<h2>'+esc(val(v,'shipName','ship','name')||'Cruise')+'</h2><p><b>'+esc(val(v,'brandName','brand','cruiseLine'))+'</b></p><pre style="white-space:pre-wrap;color:#bcd0db">'+esc(JSON.stringify(v,null,2))+'</pre>';modal.classList.add('open')}
async function loadLines(){try{const a=arr(await api('brands',$('tier').value?{tier:$('tier').value}:{}));$('linegrid').innerHTML=a.map(x=>'<div class="line" onclick="pickLine(\''+esc(val(x,'name','brandName'))+'\')"><b>'+esc(val(x,'name','brandName'))+'</b><div class="muted">'+esc(val(x,'tier','type'))+'</div></div>').join('')||'<div class="empty">No lines returned.</div>'}catch(e){$('linegrid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function pickLine(n){$('brandName').value=n;view('cruises',document.querySelector('.tabs button'));searchCruises()}
async function loadShips(){try{const p={};if($('shipName').value)p.name=$('shipName').value;if($('shipBrand').value)p.brandName=$('shipBrand').value;if($('shipType').value)p.shipType=$('shipType').value;const a=arr(await api('ships',p));$('shipgrid').innerHTML=a.slice(0,100).map(x=>'<div class="result"><h3>'+esc(val(x,'name','shipName'))+'</h3><b>'+esc(val(x,'brandName','brand'))+'</b><p class="muted">'+esc(val(x,'shipType','type'))+(val(x,'passengers','capacity')?' · '+esc(val(x,'passengers','capacity'))+' passengers':'')+'</p></div>').join('')||'<div class="empty">No ships returned.</div>'}catch(e){$('shipgrid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
</script></body></html>
