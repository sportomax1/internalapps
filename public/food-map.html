<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui;color:#18202a}body{display:grid;grid-template-rows:auto 1fr}header{display:flex;gap:8px;padding:10px;border-bottom:1px solid #ddd;align-items:center}.brand{font-size:19px;font-weight:800}input,select,button{height:38px;border:1px solid #ccd2d8;border-radius:8px;background:white;padding:0 10px}#q{flex:1;min-width:150px}button{cursor:pointer;font-weight:650}.go{background:#18202a;color:white}.main{min-height:0;display:grid;grid-template-columns:285px 1fr 350px}.side{overflow:auto;padding:14px}.left{border-right:1px solid #ddd}.right{border-left:1px solid #ddd;padding:0}.group{padding:10px 0;border-bottom:1px solid #e5e5e5}h3{font-size:12px;text-transform:uppercase;color:#68717d;letter-spacing:.08em}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{height:auto;padding:6px 9px;border-radius:20px}.chip.on{background:#18202a;color:white}.check{display:block;margin:8px 0}#map{height:100%}.head{position:sticky;top:0;background:white;padding:12px;border-bottom:1px solid #ddd;z-index:2;display:flex;justify-content:space-between}.card{padding:12px;border-bottom:1px solid #e5e5e5;cursor:pointer}.card:hover{background:#f6f7f8}.title{font-weight:750;display:flex;justify-content:space-between;gap:8px}.meta,.small{color:#6b7280;font-size:12px;margin-top:4px}.tag{display:inline-block;background:#eef0f2;padding:2px 6px;border-radius:10px;margin:5px 4px 0 0}.msg{padding:24px;text-align:center;color:#6b7280}@media(max-width:850px){.main{grid-template-columns:1fr;grid-template-rows:230px 55vh auto}.left{border:0;border-bottom:1px solid #ddd}.right{border:0}.brand{display:none}}</style></head><body>
<header><div class="brand">Food Map</div><input id="q" value="Parker, Colorado" placeholder="City, ZIP or address"><button class="go" id="go">Search</button><button id="me">◎ Me</button><select id="radius"><option value="1609">1 mi</option><option value="3219">2 mi</option><option value="8047" selected>5 mi</option><option value="16093">10 mi</option><option value="24140">15 mi</option><option value="40234">25 mi</option></select></header>
<div class="main"><aside class="side left">
<div class="group"><h3>Food type</h3><div class="chips" id="types"><button class="chip on" data-v="restaurant">Restaurant</button><button class="chip on" data-v="fast_food">Fast food</button><button class="chip on" data-v="cafe">Cafe</button><button class="chip on" data-v="ice_cream">Ice cream</button><button class="chip" data-v="food_court">Food court</button><button class="chip" data-v="bar">Bar</button><button class="chip" data-v="pub">Pub</button></div></div>
<div class="group"><h3>Cuisine</h3><input id="cuisine" placeholder="mexican, pizza, sushi" style="width:100%"></div>
<div class="group"><h3>Features</h3><label class="check"><input type="checkbox" id="takeaway"> Takeaway</label><label class="check"><input type="checkbox" id="delivery"> Delivery</label><label class="check"><input type="checkbox" id="drive"> Drive-through</label><label class="check"><input type="checkbox" id="outdoor"> Outdoor seating</label><label class="check"><input type="checkbox" id="wheelchair"> Wheelchair accessible</label><label class="check"><input type="checkbox" id="website"> Website available</label></div>
<div class="group"><h3>Coverage</h3><div id="coverage" class="small">Search to load data.</div></div></aside>
<div id="map"></div><aside class="side right"><div class="head"><div><b id="count">0 places</b><div class="small" id="where"></div></div><select id="sort"><option value="distance">Distance</option><option value="name">Name</option><option value="type">Type</option></select></div><div id="list"><div class="msg">Search an area to begin.</div></div></aside></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let origin={lat:39.5186,lon:-104.7614,label:'Parker, Colorado'},all=[];const map=L.map('map').setView([origin.lat,origin.lon],13),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yes=v=>['yes','true','designated','limited'].includes(String(v||'').toLowerCase());const mi=(a,b,c,d)=>{const R=3958.7613,r=x=>x*Math.PI/180,q=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(q))};const tn=v=>({restaurant:'Restaurant',fast_food:'Fast food',cafe:'Cafe',ice_cream:'Ice cream',food_court:'Food court',bar:'Bar',pub:'Pub'}[v]||v);
async function geocode(){setMsg('Finding location…');const r=await fetch('/api/food-geocode?q='+encodeURIComponent($('#q').value));const d=await r.json();if(!r.ok||!d.results?.length)throw Error(d.error||'Location not found');origin=d.results[0];map.setView([origin.lat,origin.lon],13);await load()}
async function load(){setMsg('Loading food places…');const types=$$('#types .on').map(x=>x.dataset.v).join(',');if(!types){all=[];render();return}const u='/api/food-places?lat='+origin.lat+'&lon='+origin.lon+'&radius='+$('#radius').value+'&types='+encodeURIComponent(types);const r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error||'Place search failed');all=(d.elements||[]).map(x=>{const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;return{id:x.type+x.id,lat,lon,t:x.tags||{},distance:mi(origin.lat,origin.lon,lat,lon)}}).filter(x=>x.lat&&x.lon);render()}
function setMsg(s){$('#list').innerHTML='<div class="msg">'+esc(s)+'</div>'}
function render(){let a=all.filter(x=>{const t=x.t,c=$('#cuisine').value.toLowerCase();return(!c||String(t.cuisine||'').toLowerCase().includes(c))&&(!$('#takeaway').checked||yes(t.takeaway))&&(!$('#delivery').checked||yes(t.delivery))&&(!$('#drive').checked||yes(t.drive_through))&&(!$('#outdoor').checked||yes(t.outdoor_seating))&&(!$('#wheelchair').checked||yes(t.wheelchair))&&(!$('#website').checked||t.website||t['contact:website'])});const s=$('#sort').value;a.sort((x,y)=>s==='name'?String(x.t.name||'').localeCompare(y.t.name||''):s==='type'?String(x.t.amenity).localeCompare(y.t.amenity):x.distance-y.distance);$('#count').textContent=a.length+' places';$('#where').textContent=origin.label||'';$('#coverage').innerHTML=all.length+' total found<br>'+all.filter(x=>x.t.cuisine).length+' with cuisine<br>'+all.filter(x=>x.t.opening_hours).length+' with hours<br>'+all.filter(x=>x.t.website||x.t['contact:website']).length+' with websites';layer.clearLayers();L.circleMarker([origin.lat,origin.lon],{radius:6}).addTo(layer);$('#list').innerHTML='';if(!a.length)return setMsg('No matching places. Broaden filters.');a.forEach(x=>{const t=x.t,n=t.name||'Unnamed '+tn(t.amenity),m=L.marker([x.lat,x.lon]).addTo(layer).bindPopup('<b>'+esc(n)+'</b><br>'+esc(tn(t.amenity))+' · '+x.distance.toFixed(1)+' mi');const c=document.createElement('div');c.className='card';c.innerHTML='<div class="title"><span>'+esc(n)+'</span><span>'+x.distance.toFixed(1)+' mi</span></div><div class="meta">'+esc(tn(t.amenity))+(t.opening_hours?' · '+esc(t.opening_hours):'')+'</div>'+(t.cuisine?'<span class="tag">'+esc(t.cuisine.replaceAll(';',', '))+'</span>':'');c.onclick=()=>{map.setView([x.lat,x.lon],16);m.openPopup()};$('#list').append(c)})}
$('#go').onclick=()=>geocode().catch(e=>setMsg(e.message));$('#q').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};$('#radius').onchange=()=>load().catch(e=>setMsg(e.message));$$('#types .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');load().catch(e=>setMsg(e.message))});['cuisine','takeaway','delivery','drive','outdoor','wheelchair','website','sort'].forEach(id=>$('#'+id).addEventListener(id==='cuisine'?'input':'change',render));$('#me').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lon:p.coords.longitude,label:'Current location'};$('#q').value='Current location';map.setView([origin.lat,origin.lon],13);load().catch(e=>setMsg(e.message))},()=>setMsg('Location permission unavailable.'));geocode().catch(e=>setMsg(e.message));
</script></body></html>
