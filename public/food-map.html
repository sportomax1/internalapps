<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:#18202a;background:#f6f7f9}body{display:grid;grid-template-rows:auto auto 1fr}
button,input,select{font:inherit}button{cursor:pointer}.top{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb;align-items:center;z-index:20}.brand{font-size:20px;font-weight:850;white-space:nowrap}.search{height:42px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;flex:1;min-width:140px}.btn,.select{height:42px;border:1px solid #d1d5db;border-radius:12px;background:#fff;padding:0 13px;font-weight:700}.primary{background:#17212d;color:#fff;border-color:#17212d}.quickbar{display:flex;gap:7px;padding:9px 12px;background:#fff;border-bottom:1px solid #e5e7eb;overflow-x:auto;align-items:center;white-space:nowrap}.chip{height:34px;border:1px solid #d1d5db;background:#fff;border-radius:18px;padding:0 11px;font-weight:700;white-space:nowrap}.chip.on{background:#17212d;color:#fff;border-color:#17212d}.chip:disabled{opacity:.45;cursor:not-allowed}.summary{margin-left:auto;color:#667085;font-size:12px}.reset{border:0;background:transparent;text-decoration:underline;color:#475467;font-weight:700}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:10px;padding:10px}.mapwrap{position:relative;min-width:0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 1px 4px #10182818}#map{height:100%;min-height:420px}.results{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 1px 4px #10182818}.resulthead{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eaecf0;padding:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#667085;font-size:12px}.card{padding:13px;border-bottom:1px solid #eaecf0;cursor:pointer;scroll-margin-top:76px}.card:hover,.card.selected{background:#f3f7fb}.brandrow{display:flex;gap:10px;align-items:flex-start}.logoimg{width:42px;height:42px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid #e5e7eb;padding:4px;flex:0 0 auto}.fallbacklogo{display:grid;place-items:center;font-weight:850;background:#f2f4f7;color:#344054}.name{font-weight:800;font-size:15px}.distance{font-weight:750;white-space:nowrap}.row{display:flex;justify-content:space-between;gap:8px}.meta{color:#667085;font-size:12px;margin-top:3px}.badge{display:inline-flex;align-items:center;border-radius:12px;padding:2px 7px;font-size:11px;font-weight:800;margin-right:5px}.open{background:#dcfae6;color:#067647}.closed{background:#f2f4f7;color:#475467}.unknown{background:#f2f4f7;color:#667085}.actions{display:flex;gap:6px;margin-top:9px}.action{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:6px 9px;font-weight:700;text-decoration:none;color:#344054;font-size:12px}.drawer{position:fixed;right:16px;top:112px;width:340px;max-height:calc(100vh - 130px);overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 16px 40px #10182830;z-index:1000;padding:16px;display:none}.drawer.open{display:block}.drawerhead{display:flex;justify-content:space-between;align-items:center}.section{padding:13px 0;border-bottom:1px solid #eaecf0}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085;margin:0 0 9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;gap:7px;align-items:center;white-space:nowrap}.cuisines{display:flex;flex-wrap:wrap;gap:6px}.debug{font:11px/1.45 ui-monospace,monospace;background:#111827;color:#d1d5db;border-radius:9px;padding:9px;max-height:160px;overflow:auto;white-space:pre-wrap}.dev{margin-top:12px}.skeleton{padding:13px}.sk{height:72px;border-radius:10px;margin-bottom:10px;background:linear-gradient(90deg,#f2f4f7,#e4e7ec,#f2f4f7);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}.selected-marker{filter:drop-shadow(0 0 5px #1570ef)}.pinlogo{width:32px;height:32px;border-radius:50%;object-fit:contain;background:#fff;border:2px solid #fff;box-shadow:0 2px 8px #0005}.leaflet-div-icon{background:transparent;border:0}.filtersearch{width:100%;height:38px;border:1px solid #d1d5db;border-radius:9px;padding:0 10px;margin-bottom:8px}.cluster{background:#17212d;color:white;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:850;border:3px solid #fff;box-shadow:0 2px 8px #0004}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #84adff;outline-offset:2px}
@media(max-width:800px){body{grid-template-rows:auto auto 1fr}.brand{display:none}.top{flex-wrap:wrap}.search{order:0;width:calc(100% - 82px)}.main{display:block;padding:0;position:relative}.mapwrap{border-radius:0;height:58vh}.results{position:absolute;left:0;right:0;top:50vh;height:50vh;border-radius:20px 20px 0 0;z-index:500;box-shadow:0 -4px 20px #10182825}.drawer{left:10px;right:10px;top:90px;width:auto}.summary{display:none}.quickbar{padding:8px}.card{padding:12px}}
</style></head><body>
<div class="top"><div class="brand">Food Map</div><input id="q" class="search" value="Parker, Colorado" aria-label="Location" placeholder="City, ZIP or address"><button id="go" class="btn primary">Search</button><button id="me" class="btn">◎ Me</button><select id="radius" class="select" aria-label="Search radius"><option value="1609">1 mi</option><option value="3219">2 mi</option><option value="8047" selected>5 mi</option><option value="16093">10 mi</option><option value="24140">15 mi</option><option value="40234">25 mi</option></select></div>
<div class="quickbar"><button class="chip" id="openNow">Open now</button><button class="chip" id="quickDelivery">Delivery</button><button class="chip" id="quickOutdoor">Outdoor</button><button class="chip" id="quickCoffee">Coffee</button><button class="chip" id="quickNear">Under 1 mi</button><button class="chip" disabled title="Ratings are not available from OpenStreetMap">Top rated</button><button class="chip" id="filters">☰ All filters</button><span id="filterSummary" class="summary">No filters applied</span><button id="reset" class="reset">Reset</button></div>
<div class="main"><div class="mapwrap"><div id="map"></div></div><aside class="results"><div class="resulthead"><div><b id="count">0 places</b><div id="where" class="muted"></div></div><select id="sort" class="select"><option value="distance">Distance</option><option value="name">Name</option><option value="type">Type</option></select></div><div id="list"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></aside></div>
<div id="drawer" class="drawer" aria-hidden="true"><div class="drawerhead"><b>All filters</b><button id="closeFilters" class="btn">Done</button></div>
<div class="section"><h3>Cuisine</h3><input id="cuisineSearch" class="filtersearch" placeholder="Search cuisines"><div id="cuisines" class="cuisines"></div></div>
<div class="section"><h3>Food type</h3><div id="types" class="cuisines"><button class="chip on" data-v="restaurant">Restaurant</button><button class="chip on" data-v="fast_food">Fast food</button><button class="chip on" data-v="cafe">Cafe</button><button class="chip on" data-v="ice_cream">Ice cream</button><button class="chip" data-v="food_court">Food court</button><button class="chip" data-v="bar">Bar</button><button class="chip" data-v="pub">Pub</button></div></div>
<div class="section"><h3>Features</h3><div class="checks"><label class="check"><input type="checkbox" id="takeaway"> Takeaway</label><label class="check"><input type="checkbox" id="delivery"> Delivery</label><label class="check"><input type="checkbox" id="drive"> Drive-through</label><label class="check"><input type="checkbox" id="outdoor"> Outdoor seating</label><label class="check"><input type="checkbox" id="wheelchair"> Wheelchair</label><label class="check"><input type="checkbox" id="website"> Website</label></div></div>
<details class="dev"><summary>Developer diagnostics</summary><div style="display:flex;justify-content:flex-end;margin:8px 0"><button id="copylog" class="btn">Copy log</button></div><div id="debug" class="debug">Ready.</div></details></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const qs=s=>document.querySelector(s),qsa=s=>[...document.querySelectorAll(s)];
let origin={lat:39.5186,lon:-104.7614,label:'Parker, Colorado'},all=[],logs=[],selectedCuisines=new Set(),markers=new Map(),selectedId=null;
const common=['Mexican','Pizza','Sushi','Thai','Chinese','Indian','Italian','Burgers','Sandwich','Breakfast','Coffee'];
const map=L.map('map').setView([origin.lat,origin.lon],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const clusters=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:c=>L.divIcon({html:'<div class="cluster">'+c.getChildCount()+'</div>',className:'',iconSize:[40,40]})}).addTo(map);
const originLayer=L.layerGroup().addTo(map);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yes=v=>['yes','true','designated','limited'].includes(String(v||'').toLowerCase());
const miles=(a,b,c,d)=>{const R=3958.7613,r=x=>x*Math.PI/180,q=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const tn=v=>({restaurant:'Restaurant',fast_food:'Fast food',cafe:'Cafe',ice_cream:'Ice cream',food_court:'Food court',bar:'Bar',pub:'Pub'}[v]||v);
function log(s){const line=new Date().toLocaleTimeString()+'  '+s;logs.push(line);qs('#debug').textContent=logs.slice(-50).join('\n')}
function domain(t){let u=t.website||t['contact:website'];if(!u)return '';try{return new URL(u.startsWith('http')?u:'https://'+u).hostname.replace(/^www\./,'')}catch{return ''}}
function logo(t){const d=domain(t);return d?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=64':''}
function initials(n){return String(n||'Food').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function logoBox(lg,n){return lg?'<img class="logoimg" src="'+esc(lg)+'" onerror="this.outerHTML=\'<div class=&quot;logoimg fallbacklogo&quot;>'+esc(initials(n))+'</div>\'">':'<div class="logoimg fallbacklogo">'+esc(initials(n))+'</div>'}
function site(t){let u=t.website||t['contact:website'];if(!u)return '';return u.startsWith('http')?u:'https://'+u}
function hourStatus(raw){if(!raw)return {state:'unknown',label:'Hours unknown'};const s=raw.trim();if(s==='24/7')return {state:'open',label:'Open 24 hours'};const days=['Su','Mo','Tu','We','Th','Fr','Sa'],d=days[new Date().getDay()];let matches=[...s.matchAll(/(?:(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?\s+)?(\d{2}:\d{2})-(\d{2}:\d{2})/g)];if(!matches.length)return {state:'unknown',label:s};const idx=x=>days.indexOf(x);const relevant=matches.filter(m=>!m[1]||(!m[2]&&m[1]===d)||(m[2]&&((idx(m[1])<=idx(m[2])&&idx(d)>=idx(m[1])&&idx(d)<=idx(m[2]))||(idx(m[1])>idx(m[2])&&(idx(d)>=idx(m[1])||idx(d)<=idx(m[2]))))));if(!relevant.length)return {state:'closed',label:'Closed'};const now=new Date().getHours()*60+new Date().getMinutes(),toMin=x=>{const [h,m]=x.split(':').map(Number);return h*60+m};const open=relevant.some(m=>{let a=toMin(m[3]),b=toMin(m[4]);return b<a?now>=a||now<b:now>=a&&now<b});return {state:open?'open':'closed',label:open?'Open now':'Closed'}}
function activeCount(){let n=selectedCuisines.size;n+=['takeaway','delivery','drive','outdoor','wheelchair','website'].filter(id=>qs('#'+id).checked).length;n+=qsa('#types .chip:not(.on)').length?1:0;n+=qs('#openNow').classList.contains('on')?1:0;n+=qs('#quickCoffee').classList.contains('on')?1:0;n+=qs('#quickNear').classList.contains('on')?1:0;return n}
function syncQuick(){qs('#quickDelivery').classList.toggle('on',qs('#delivery').checked);qs('#quickOutdoor').classList.toggle('on',qs('#outdoor').checked);const n=activeCount();qs('#filterSummary').textContent=n?n+' filter'+(n===1?'':'s')+' applied':'No filters applied'}
function renderCuisines(){const q=qs('#cuisineSearch').value.toLowerCase();const fromData=[...new Set(all.flatMap(x=>String(x.t.cuisine||'').split(';')).map(x=>x.trim()).filter(Boolean))];const vals=[...new Set([...common,...fromData])].filter(x=>!q||x.toLowerCase().includes(q)).slice(0,30);qs('#cuisines').innerHTML=vals.map(v=>'<button class="chip cuisine '+(selectedCuisines.has(v.toLowerCase())?'on':'')+'" data-v="'+esc(v.toLowerCase())+'">'+esc(v)+'</button>').join('');qsa('.cuisine').forEach(b=>b.onclick=()=>{const v=b.dataset.v;selectedCuisines.has(v)?selectedCuisines.delete(v):selectedCuisines.add(v);renderCuisines();render()})}
function skeleton(msg='Finding food nearby…'){qs('#list').innerHTML='<div class="muted" style="padding:13px">'+esc(msg)+'</div><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>'}
async function geocode(){logs=[];log('Geocoding '+qs('#q').value);skeleton('Finding location…');const r=await fetch('/api/food-geocode?q='+encodeURIComponent(qs('#q').value));const d=await r.json();if(!r.ok||!d.results?.length)throw Error(d.error||'Location not found');origin=d.results[0];log('Location '+origin.lat.toFixed(5)+','+origin.lon.toFixed(5));map.setView([origin.lat,origin.lon],13);await load()}
async function load(){skeleton();const types=qsa('#types .on').map(x=>x.dataset.v).join(',');if(!types){all=[];render();return}const u='/api/food-places?lat='+origin.lat+'&lon='+origin.lon+'&radius='+qs('#radius').value+'&types='+encodeURIComponent(types);log('GET '+u);const st=performance.now(),r=await fetch(u);log('HTTP '+r.status+' '+((performance.now()-st)/1000).toFixed(2)+'s');const d=await r.json();(d.attempts||[]).forEach(a=>log(a.provider+' → '+a.status+(a.count!=null?' · '+a.count:'')+(a.error?' · '+a.error:'')));if(!r.ok)throw Error(d.error||'Place search failed');all=(d.elements||[]).map(x=>{const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;return{id:x.type+x.id,lat,lon,t:x.tags||{},distance:miles(origin.lat,origin.lon,lat,lon)}}).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon));log('Valid places '+all.length);renderCuisines();render()}
function selectPlace(id,fromMap=false){selectedId=id;qsa('.card').forEach(c=>c.classList.toggle('selected',c.dataset.id===id));const card=qs('.card[data-id="'+CSS.escape(id)+'"]');if(card&&!fromMap)card.scrollIntoView({behavior:'smooth',block:'nearest'});const x=all.find(v=>v.id===id),m=markers.get(id);if(x){map.flyTo([x.lat,x.lon],Math.max(map.getZoom(),16),{duration:.45});if(m)setTimeout(()=>m.openPopup(),300)}}
function render(){let a=all.filter(x=>{const t=x.t,c=String(t.cuisine||'').toLowerCase(),hs=hourStatus(t.opening_hours);return(!selectedCuisines.size||[...selectedCuisines].some(v=>c.includes(v)))&&(!qs('#takeaway').checked||yes(t.takeaway))&&(!qs('#delivery').checked||yes(t.delivery))&&(!qs('#drive').checked||yes(t.drive_through))&&(!qs('#outdoor').checked||yes(t.outdoor_seating))&&(!qs('#wheelchair').checked||yes(t.wheelchair))&&(!qs('#website').checked||site(t))&&(!qs('#openNow').classList.contains('on')||hs.state==='open')&&(!qs('#quickCoffee').classList.contains('on')||(t.amenity==='cafe'||c.includes('coffee')))&&(!qs('#quickNear').classList.contains('on')||x.distance<=1)});const s=qs('#sort').value;a.sort((x,y)=>s==='name'?String(x.t.name||'').localeCompare(y.t.name||''):s==='type'?String(x.t.amenity||'').localeCompare(y.t.amenity||''):x.distance-y.distance);qs('#count').textContent=a.length+' places';qs('#where').textContent=origin.label||'';syncQuick();clusters.clearLayers();markers.clear();originLayer.clearLayers();L.circleMarker([origin.lat,origin.lon],{radius:6,weight:3,color:'#1570ef',fillColor:'#fff',fillOpacity:1}).addTo(originLayer).bindTooltip('Search center');qs('#list').innerHTML='';if(!a.length){qs('#list').innerHTML='<div class="muted" style="padding:24px">No matching places. Remove a filter or expand the radius.</div>';return}a.forEach(x=>{const t=x.t,n=t.name||'Unnamed '+tn(t.amenity),lg=logo(t),hs=hourStatus(t.opening_hours),web=site(t),directions='https://www.google.com/maps/dir/?api=1&destination='+x.lat+','+x.lon;const icon=lg?L.divIcon({html:'<img class="pinlogo" src="'+esc(lg)+'" onerror="this.parentElement.textContent=\'🍴\'">',className:'',iconSize:[36,36],iconAnchor:[18,18]}):undefined;const m=L.marker([x.lat,x.lon],icon?{icon}:{});m.bindPopup('<b>'+esc(n)+'</b><br><span class="badge '+hs.state+'">'+esc(hs.label)+'</span><br>'+x.distance.toFixed(1)+' mi');m.on('click',()=>{selectedId=x.id;const card=qs('.card[data-id="'+CSS.escape(x.id)+'"]');qsa('.card').forEach(c=>c.classList.toggle('selected',c===card));card?.scrollIntoView({behavior:'smooth',block:'center'})});clusters.addLayer(m);markers.set(x.id,m);const card=document.createElement('article');card.className='card'+(selectedId===x.id?' selected':'');card.dataset.id=x.id;card.tabIndex=0;card.innerHTML='<div class="brandrow">'+logoBox(lg,n)+'<div style="flex:1;min-width:0"><div class="row"><span class="name">'+esc(n)+'</span><span class="distance">'+x.distance.toFixed(1)+' mi</span></div><div class="meta"><span class="badge '+hs.state+'">'+esc(hs.label)+'</span>'+esc((t.cuisine||tn(t.amenity)).replaceAll(';',', '))+'</div>'+(t.opening_hours&&hs.state==='unknown'?'<div class="meta">'+esc(t.opening_hours)+'</div>':'')+'<div class="actions"><a class="action" target="_blank" rel="noopener" href="'+directions+'">Directions</a>'+(web?'<a class="action" target="_blank" rel="noopener" href="'+esc(web)+'">Website</a>':'')+'</div></div></div>';card.onclick=e=>{if(!e.target.closest('a'))selectPlace(x.id)};card.onkeydown=e=>{if(e.key==='Enter')selectPlace(x.id)};qs('#list').append(card)});}
function toggleChip(id){qs(id).classList.toggle('on');render()}
qs('#go').onclick=()=>geocode().catch(e=>{log('ERROR '+e.message);qs('#list').innerHTML='<div class="muted" style="padding:24px">'+esc(e.message)+'</div>'});qs('#q').onkeydown=e=>{if(e.key==='Enter')qs('#go').click()};qs('#radius').onchange=()=>load().catch(e=>log('ERROR '+e.message));qs('#me').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lon:p.coords.longitude,label:'Current location'};qs('#q').value='Current location';map.setView([origin.lat,origin.lon],13);load().catch(e=>log(e.message))},()=>alert('Location permission unavailable.'));
qs('#openNow').onclick=()=>toggleChip('#openNow');qs('#quickCoffee').onclick=()=>toggleChip('#quickCoffee');qs('#quickNear').onclick=()=>toggleChip('#quickNear');qs('#quickDelivery').onclick=()=>{qs('#delivery').checked=!qs('#delivery').checked;render()};qs('#quickOutdoor').onclick=()=>{qs('#outdoor').checked=!qs('#outdoor').checked;render()};
qs('#filters').onclick=()=>{qs('#drawer').classList.add('open');qs('#drawer').setAttribute('aria-hidden','false')};qs('#closeFilters').onclick=()=>{qs('#drawer').classList.remove('open');qs('#drawer').setAttribute('aria-hidden','true')};qs('#cuisineSearch').oninput=renderCuisines();qs('#cuisineSearch').oninput=renderCuisines;
qsa('#types .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');load().catch(e=>log(e.message))});['takeaway','delivery','drive','outdoor','wheelchair','website','sort'].forEach(id=>qs('#'+id).addEventListener('change',render));qs('#copylog').onclick=()=>navigator.clipboard.writeText(logs.join('\n'));
qs('#reset').onclick=()=>{selectedCuisines.clear();['takeaway','delivery','drive','outdoor','wheelchair','website'].forEach(id=>qs('#'+id).checked=false);['openNow','quickCoffee','quickNear'].forEach(id=>qs('#'+id).classList.remove('on'));qsa('#types .chip').forEach((b,i)=>b.classList.toggle('on',i<4));renderCuisines();load().catch(e=>log(e.message))};
geocode().catch(e=>{log('ERROR '+e.message);qs('#list').innerHTML='<div class="muted" style="padding:24px">'+esc(e.message)+'</div>'});
</script></body></html>
