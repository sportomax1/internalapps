<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocDesk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.2/mammoth.browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.14.0/html2pdf.bundle.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#eef1f5;color:#18202a}.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}.bar,.tools,.status{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid #d7dce3;flex-wrap:wrap}.logo{font-weight:800;font-size:18px}.name{flex:1;min-width:150px;border:1px solid transparent;padding:7px;border-radius:6px;font-weight:650}.name:focus{outline:0;border-color:#9fb2cf}.btn,select{border:1px solid #d7dce3;background:#fff;border-radius:7px;padding:7px 9px;cursor:pointer}.btn:hover{background:#f3f6fb}.primary{background:#235ee7;color:#fff;border-color:#235ee7}.work{overflow:auto;padding:28px}.page{width:8.5in;min-height:11in;margin:auto;background:#fff;padding:.72in .78in;box-shadow:0 10px 30px #20304022;outline:0;font:11pt Arial;line-height:1.3}.page img{max-width:100%}.page table{border-collapse:collapse}.page td,.page th{border:1px solid #999;padding:5px}.field{background:#fff1a8;outline:1px solid #d4ad24;border-radius:3px;padding:0 2px}.panel{position:fixed;right:16px;top:108px;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #ccd3dc;border-radius:10px;box-shadow:0 10px 30px #0002;padding:12px;display:none;z-index:10}.panel.open{display:block}.frow{display:grid;grid-template-columns:1fr auto;gap:6px;margin:8px 0}.frow input{min-width:0;padding:7px;border:1px solid #ccd3dc;border-radius:6px}.badge{background:#fff1b8;border:1px solid #e4c45f;border-radius:999px;padding:1px 6px;font-size:11px}.status{border-top:1px solid #d7dce3;border-bottom:0;color:#687484;font-size:12px}.hidden{display:none}@media(max-width:800px){.work{padding:10px}.page{margin:0}.label{display:none}}@media print{.bar,.tools,.status,.panel{display:none!important}.work{padding:0;overflow:visible}.page{box-shadow:none;margin:0}.field{background:transparent!important;outline:0!important}}</style></head>
<body><div class="app"><div class="bar"><span class="logo">📄 DocDesk</span><input id="name" class="name" value="Untitled Document"><button class="btn" id="new">New</button><button class="btn" id="open">Open</button><input id="file" class="hidden" type="file" accept=".docx,.html,.htm,.txt"><button class="btn" id="fields">Fields <span id="count" class="badge hidden">0</span></button><button class="btn primary" id="save">Save DOCX</button><button class="btn" id="pdf">PDF</button><button class="btn" id="print">Print</button></div>
<div class="tools"><select id="block"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select><button class="btn" data-cmd="bold"><b>B</b></button><button class="btn" data-cmd="italic"><i>I</i></button><button class="btn" data-cmd="underline"><u>U</u></button><button class="btn" data-cmd="insertUnorderedList">• List</button><button class="btn" data-cmd="insertOrderedList">1. List</button><button class="btn" data-cmd="justifyLeft">Left</button><button class="btn" data-cmd="justifyCenter">Center</button><button class="btn" data-cmd="justifyRight">Right</button><button class="btn" id="link">Link</button><button class="btn" id="table">Table</button></div>
<div class="work"><article id="ed" class="page" contenteditable spellcheck="true"><h1>Untitled Document</h1><p>Start typing, paste text, or open a Word document.</p></article></div><div class="status"><span id="state">Ready</span><span id="stats"></span></div></div>
<aside id="panel" class="panel"><b>Fields to complete</b><p id="summary"></p><div id="list"></div><button class="btn" id="rescan">Rescan</button><button class="btn" id="next">Next</button><button class="btn" id="hide">Hide highlights</button></aside>
<script>(()=>{'use strict';const $=x=>document.getElementById(x),ed=$('ed'),name=$('name'),panel=$('panel'),RX=/(\[[A-Za-z][A-Za-z0-9 _./&'’\-]{1,60}\]|\{\{[^{}\n]{1,60}\}\}|<<[^<>\n]{1,60}>>|_{3,})/g;let dirty=false,lastRange=null,nextI=0;
const stat=m=>{$('state').textContent=m;const t=ed.innerText.trim(),w=t?t.split(/\s+/).length:0;$('stats').textContent=`${w} words · ${t.length} chars`};function changed(){dirty=true;stat('Unsaved');clearTimeout(changed.t);changed.t=setTimeout(()=>{localStorage.setItem('docdesk.html',ed.innerHTML);localStorage.setItem('docdesk.name',name.value);stat('Autosaved')},500)}function saveSel(){const s=getSelection();if(s.rangeCount&&ed.contains(s.getRangeAt(0).commonAncestorContainer))lastRange=s.getRangeAt(0).cloneRange()}function restore(){ed.focus();if(lastRange){const s=getSelection();s.removeAllRanges();try{s.addRange(lastRange)}catch{}}}function cmd(c,v=null){restore();document.execCommand(c,false,v);changed();saveSel()}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>cmd(b.dataset.cmd));$('block').onchange=e=>cmd('formatBlock',e.target.value);ed.oninput=changed;ed.onmouseup=saveSel;ed.onkeyup=saveSel;name.oninput=changed;
$('link').onclick=()=>{saveSel();const u=prompt('URL','https://');if(u)cmd('createLink',u)};$('table').onclick=()=>{const r=Math.max(1,+prompt('Rows','3')||3),c=Math.max(1,+prompt('Columns','3')||3);let h='<table>';for(let y=0;y<r;y++){h+='<tr>';for(let x=0;x<c;x++)h+='<td><br></td>';h+='</tr>'}h+='</table><p><br></p>';restore();document.execCommand('insertHTML',false,h);changed()};
function unwrap(){ed.querySelectorAll('.field').forEach(s=>s.replaceWith(document.createTextNode(s.textContent)));ed.normalize()}function label(s){return /^_+$/.test(s)?'Blank field':s.replace(/^\[|\]$/g,'').replace(/^\{\{|\}\}$/g,'').replace(/^<<|>>$/g,'').trim()}function scan(open=false){unwrap();const ws=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT),nodes=[];while(ws.nextNode())nodes.push(ws.currentNode);for(const n of nodes){RX.lastIndex=0;if(!RX.test(n.nodeValue)){RX.lastIndex=0;continue}RX.lastIndex=0;const f=document.createDocumentFragment();let p=0,m;while(m=RX.exec(n.nodeValue)){if(m.index>p)f.append(document.createTextNode(n.nodeValue.slice(p,m.index)));const s=document.createElement('span');s.className='field';s.dataset.raw=m[0];s.textContent=m[0];f.append(s);p=m.index+m[0].length}if(p<n.nodeValue.length)f.append(document.createTextNode(n.nodeValue.slice(p)));n.replaceWith(f)}build();if(open)panel.classList.add('open')}function build(){const spans=[...ed.querySelectorAll('.field')],map=new Map();for(const s of spans){const r=s.dataset.raw;if(!map.has(r))map.set(r,[]);map.get(r).push(s)}$('count').textContent=spans.length;$('count').classList.toggle('hidden',!spans.length);$('summary').textContent=spans.length?`${spans.length} placeholder${spans.length===1?'':'s'} detected.`:'No placeholders detected.';$('list').innerHTML='';for(const [raw,arr] of map){const row=document.createElement('div');row.innerHTML=`<small><b>${label(raw)}</b> · ${arr.length} occurrence${arr.length===1?'':'s'}</small>`;const f=document.createElement('div');f.className='frow';const i=document.createElement('input');i.placeholder=raw;const b=document.createElement('button');b.className='btn';b.textContent='Fill';b.onclick=()=>{if(!i.value.trim())return;arr.filter(x=>x.isConnected).forEach(x=>x.replaceWith(document.createTextNode(i.value)));changed();scan()};f.append(i,b);row.append(f);$('list').append(row)}}$('fields').onclick=()=>{scan();panel.classList.toggle('open')};$('rescan').onclick=()=>scan();$('hide').onclick=()=>{unwrap();panel.classList.remove('open');$('count').classList.add('hidden')};$('next').onclick=()=>{const a=[...ed.querySelectorAll('.field')];if(!a.length)return;const x=a[nextI++%a.length];x.scrollIntoView({behavior:'smooth',block:'center'})};
async function openFile(f){try{let h='';if(f.name.toLowerCase().endsWith('.docx')){const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{convertImage:mammoth.images.imgElement(async i=>({src:`data:${i.contentType};base64,${await i.read('base64')}`}))});h=r.value}else if(f.name.match(/\.html?$/i))h=(new DOMParser().parseFromString(await f.text(),'text/html')).body.innerHTML;else h=(await f.text()).split(/\r?\n/).map(x=>`<p>${x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))||'<br>'}</p>`).join('');ed.innerHTML=DOMPurify.sanitize(h,{ADD_ATTR:['target']});name.value=f.name.replace(/\.[^.]+$/,'');dirty=false;scan();stat('Opened')}catch(e){alert('Could not open file: '+e.message)}}$('open').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)};$('new').onclick=()=>{if(dirty&&!confirm('Start a new document?'))return;ed.innerHTML='<h1>Untitled Document</h1><p><br></p>';name.value='Untitled Document';changed()};
async function saveDocx(){const d=docx,parts=[];for(const el of ed.children){if(el.matches('ul,ol')){for(const li of el.children)parts.push(new d.Paragraph({text:li.innerText,bullet:el.tagName==='UL'?{level:0}:undefined,numbering:el.tagName==='OL'?{reference:'n',level:0}:undefined}))}else if(el.tagName==='TABLE'){for(const tr of el.rows)parts.push(new d.Paragraph({text:[...tr.cells].map(c=>c.innerText).join(' | ')}))}else{const o={children:[new d.TextRun(el.innerText||'')]};if(el.tagName==='H1')o.heading=d.HeadingLevel.HEADING_1;if(el.tagName==='H2')o.heading=d.HeadingLevel.HEADING_2;if(el.tagName==='H3')o.heading=d.HeadingLevel.HEADING_3;parts.push(new d.Paragraph(o))}}const doc=new d.Document({numbering:{config:[{reference:'n',levels:[{level:0,format:d.LevelFormat.DECIMAL,text:'%1.'}]}]},sections:[{children:parts}]});const blob=await d.Packer.toBlob(doc),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(name.value||'document').replace(/\.[^.]+$/,'')+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);dirty=false;stat('DOCX downloaded')}$('save').onclick=saveDocx;
$('pdf').onclick=async()=>{const c=ed.cloneNode(true);c.querySelectorAll('.field').forEach(x=>x.className='');c.style.boxShadow='none';c.style.transform='none';const w=document.createElement('div');w.style.position='fixed';w.style.left='-100000px';w.append(c);document.body.append(w);try{await html2pdf().set({margin:0,filename:(name.value||'document')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,backgroundColor:'#fff'},jsPDF:{unit:'in',format:'letter',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(c).save()}finally{w.remove()}};$('print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveDocx()}});const auto=localStorage.getItem('docdesk.html');if(auto){ed.innerHTML=auto;name.value=localStorage.getItem('docdesk.name')||'Recovered Document'}scan();stat('Ready')})();</script></body></html>
