<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Arcade — Games</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#071321;color:#f0f7ff;font:15px system-ui}header{padding:12px 20px;display:flex;align-items:center;gap:15px;background:#10243a;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select,input{background:#203e5d;color:white;border:1px solid #436383;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button:hover{background:#326395}.active{background:#1677d3}main{max-width:1180px;margin:auto;padding:16px}.panel{background:#102238;border:1px solid #294563;border-radius:14px;padding:14px}.muted{color:#a7bed2}canvas{width:100%;display:block;background:#09182a;border-radius:12px;touch-action:none}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.stat{font-weight:800;color:#79d9ff}.games button{min-width:110px}.help{line-height:1.6}#status{color:#83e9b5}</style><header><h1>🎮 Motion Arcade</h1><div class="row games" id="tabs"></div><span id="status">Connecting…</span></header><main><div class="panel row"><div><b>Phone pairing</b><div class="muted">Scan QR or open the link on your phone.</div></div><div id="qr"></div><div><a id="link" style="color:#7ad5ff" target="_blank">Controller link</a><div id="players" class="stat">0 controllers</div></div><button id="reset">Restart game</button></div><p id="help" class="help"></p><canvas id="screen" width="1100" height="630"></canvas><p class="muted">Desktop fallback: ← → or A/D to steer/aim, SPACE to swing, throw or hit. Controller requires internet access to PeerJS signaling and a compatible browser.</p></main><script>
const $=id=>document.getElementById(id),cv=$('screen'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const names=['Bowling','Racing','Golf','Tennis'];let game=0,frame=0,score=0,shots=0,round=1,ball=null,carX=0,road=0,obstacles=[],golfDist=0,tennisBall=null,tennisHits=0,controllers=new Map(),lastInput={tilt:0,swing:0},lastSwing=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){score=0;shots=0;round=1;frame=0;ball=null;carX=0;road=0;obstacles=[];golfDist=0;tennisBall=null;tennisHits=0;lastSwing=0;}
function setGame(i){game=i;reset();$('tabs').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',i===j));$('help').textContent=[
'🎳 BOWLING: Hold THROW on your phone, swing forward, then release. Tilt to aim. Ten frames simplified: each throw resets all ten pins.',
'🏎️ RACING: Tilt phone left/right to steer. Hold GAS. Avoid red cars. Survive as long as possible.',
'⛳ GOLF: Tilt to choose direction, hold SWING and swing the phone, then release. Reach the green in as few strokes as possible.',
'🎾 TENNIS: Swing when the ball approaches your side. Tilt to aim your return. Time each shot carefully.'
][i];}
names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>setGame(i);$('tabs').append(b)});$('reset').onclick=reset;setGame(0);
function receive(d){if(!d||typeof d!=='object')return;lastInput={...lastInput,...d};if(d.type==='release'||d.type==='swing')act(clamp(Number(d.power)||.55,.15,1),Number(d.tilt)||0);if(d.type==='reset')reset();}
function act(power,tilt){if(performance.now()-lastSwing<350)return;lastSwing=performance.now();if(game===0&&!ball){shots++;ball={x:W/2+clamp(tilt,-1,1)*160,y:570,vx:clamp(tilt,-1,1)*1.5,vy:-7-power*10,power};}if(game===2&&!ball){shots++;ball={x:120,y:490,vx:6+power*15,vy:-6-power*9,angle:clamp(tilt,-1,1)};}if(game===3&&tennisBall&&tennisBall.vy>0&&tennisBall.y>350&&tennisBall.y<590){tennisBall.vy=-Math.abs(tennisBall.vy)*(0.9+power*.3);tennisBall.vx=clamp(tilt,-1,1)*5;tennisHits++;score+=10;}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')lastInput.tilt=clamp(lastInput.tilt-.15,-1,1);if(e.key==='ArrowRight'||e.key==='d')lastInput.tilt=clamp(lastInput.tilt+.15,-1,1);if(e.code==='Space'){e.preventDefault();if(game===1)lastInput.gas=true;else act(.7,lastInput.tilt)}});
document.addEventListener('keyup',e=>{if(e.code==='Space')lastInput.gas=false});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function txt(s,x,y,size=22,color='#fff'){ctx.fillStyle=color;ctx.font='bold '+size+'px system-ui';ctx.fillText(s,x,y)}function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function drawBowling(dt){rect(0,0,W,H,'#16293c');rect(270,0,560,H,'#c99a61');for(let i=0;i<8;i++)rect(270+i*80,0,2,H,'#a67848');rect(260,0,10,H,'#16283e');rect(830,0,10,H,'#16283e');for(let r=0;r<4;r++)for(let j=0;j<=r;j++){let x=W/2+(j-r/2)*40,y=105+r*40;circle(x,y,11,'#f7f7ee');circle(x,y-5,4,'#d52e40')}if(ball){ball.y+=ball.vy*dt;ball.x+=ball.vx*dt;circle(ball.x,ball.y,20,'#253d85');circle(ball.x-6,ball.y-5,4,'#09142c');if(ball.y<80){let hit=clamp(Math.round(10*ball.power-Math.abs(ball.x-W/2)/65+rnd(-2,3)),0,10);score+=hit;ball=null;round++;}}else{circle(W/2+lastInput.tilt*160,565,20,'#263e86');txt('Aim with tilt • Swing to throw',370,610,20)}txt('BOWLING  •  Throw '+shots+'  •  Pins '+score,25,43,28);}
function drawRacing(dt){rect(0,0,W,H,'#267448');rect(260,0,580,H,'#444a55');rect(270,0,7,H,'#eee');rect(823,0,7,H,'#eee');road=(road+dt*(lastInput.gas?14:5))%100;for(let y=-100+road;y<H;y+=100){rect(450,y,8,55,'#e8e6d7');rect(640,y,8,55,'#e8e6d7')}carX=clamp(carX+lastInput.tilt*dt*8,-235,235);let speed=lastInput.gas?9:3;frame+=dt;if(Math.random()<.014*dt)obstacles.push({x:rnd(-215,215),y:-80});for(let o of obstacles){o.y+=speed*dt*2.3;rect(W/2+o.x-25,o.y,50,75,'#f05258');if(Math.abs(o.x-carX)<47&&Math.abs(o.y-500)<62){score=Math.max(0,score-100);o.y=900}}obstacles=obstacles.filter(o=>o.y<700);rect(W/2+carX-28,480,56,90,'#21c8ff');rect(W/2+carX-19,492,38,22,'#0e3e62');score+=speed*dt*.04;txt('RACING  •  Distance '+Math.floor(score)+'m',25,43,28);txt('Tilt to steer • Hold GAS',25,85,19);}
function drawGolf(dt){rect(0,0,W,H,'#286c48');ctx.fillStyle='#49a56a';ctx.beginPath();ctx.ellipse(900,220,155,115,0,0,Math.PI*2);ctx.fill();rect(905,105,5,115,'#eee');ctx.beginPath();ctx.moveTo(910,105);ctx.lineTo(965,122);ctx.lineTo(910,143);ctx.fillStyle='#ffdc5c';ctx.fill();circle(900,220,10,'#111');rect(0,500,W,130,'#277344');if(ball){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vy+=.35*dt;ball.vx*=Math.pow(.991,dt);if(ball.y>=490){golfDist+=Math.max(0,(ball.x-120)/2);if(golfDist>=380){score=shots;golfDist=0;shots=0;round++;}ball=null}}circle(ball?ball.x:120+golfDist*1.8,ball?ball.y:490,10,'#fff');txt('GOLF  •  Hole '+round+'  •  Strokes '+shots,25,43,28);txt('Distance '+Math.floor(golfDist)+' / 380 yards',25,82,20);txt('Swing phone to hit • Tilt to aim',25,115,18);}
function drawTennis(dt){rect(0,0,W,H,'#1e7467');rect(230,40,640,550,'#2361a1');ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(255,60,590,510);rect(255,310,590,5,'#f2f2f2');rect(540,60,4,510,'#fff');rect(255,165,590,3,'#fff');rect(255,455,590,3,'#fff');circle(550,530,24,'#ffd35e');circle(550,90,24,'#ff6e6e');if(!tennisBall)tennisBall={x:550,y:170,vx:3,vy:5};tennisBall.x+=tennisBall.vx*dt;tennisBall.y+=tennisBall.vy*dt;if(tennisBall.x<270||tennisBall.x>830)tennisBall.vx*=-1;if(tennisBall.y<100)tennisBall.vy=Math.abs(tennisBall.vy);if(tennisBall.y>590){tennisBall=null;score=Math.max(0,score-5)}if(tennisBall&&tennisBall.vy<0&&tennisBall.y<115){tennisBall.vy=Math.abs(tennisBall.vy);score+=5}if(tennisBall)circle(tennisBall.x,tennisBall.y,13,'#edfa4d');txt('TENNIS  •  Score '+score+'  •  Returns '+tennisHits,25,35,27);txt('Swing when ball reaches your half',25,610,18);}
let previous=performance.now();function loop(t){let dt=Math.min(2.2,(t-previous)/16.67);previous=t;ctx.clearRect(0,0,W,H);[drawBowling,drawRacing,drawGolf,drawTennis][game](dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
const peerId='motionarcade-'+Math.random().toString(36).slice(2,10);const url=new URL('controller.html',location.href);url.searchParams.set('room',peerId);$('link').href=url.href;$('link').textContent=url.href;
const qr=document.createElement('img');qr.width=108;qr.height=108;qr.alt='Scan to join';qr.src='https://api.qrserver.com/v1/create-qr-code/?size=216x216&data='+encodeURIComponent(url.href);$('qr').append(qr);
if(typeof Peer==='undefined')$('status').textContent='PeerJS did not load';else{const peer=new Peer(peerId);peer.on('open',()=>{$('status').textContent='Ready to pair'});peer.on('connection',conn=>{controllers.set(conn.peer,conn);$('players').textContent=controllers.size+' controller(s)';conn.on('data',receive);conn.on('close',()=>{controllers.delete(conn.peer);$('players').textContent=controllers.size+' controller(s)'});conn.on('open',()=>conn.send({type:'welcome'}))});peer.on('error',e=>{$('status').textContent='Connection error: '+e.type})}
</script></html>
