<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STL Plate Builder</title><style>:root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#2b3648;--text:#f8fafc;--muted:#94a3b8;--accent:#34d399}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input{font:inherit}.app{height:100%;display:grid;grid-template-columns:340px 1fr}.side{display:flex;flex-direction:column;min-height:0;background:linear-gradient(#141c2a,#0d131d);border-right:1px solid var(--line)}header{padding:18px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0 0 4px}p{margin:0;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line)}button,.pick{border:1px solid var(--line);background:#182131;color:var(--text);border-radius:10px;padding:10px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);border-color:transparent;color:#052e24}.wide{grid-column:1/-1}.pick{position:relative;display:flex;align-items:center;justify-content:center;text-align:center}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:.001;cursor:pointer;font-size:100px}.plate,.edit{padding:12px;border-bottom:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 3px}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#080c13;color:var(--text)}.models{flex:1;overflow:auto;padding:10px}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.card{padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer}.card.active{border-color:var(--accent)}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dims{font-size:11px;color:var(--muted);margin-top:4px}.row{display:flex;gap:7px;margin-top:8px}.row button{flex:1;padding:7px}.hidden{display:none}.view{position:relative;min-width:0}.canvas{position:absolute;inset:0}.toolbar{position:absolute;z-index:2;left:14px;top:14px;display:flex;gap:7px;flex-wrap:wrap}.chip{border-radius:999px;background:rgba(17,24,39,.82);backdrop-filter:blur(10px)}.chip.on{background:var(--accent);color:#052e24}.status{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;pointer-events:none}.drop{display:none;position:absolute;inset:18px;z-index:4;place-items:center;border:2px dashed var(--accent);border-radius:18px;background:rgba(9,13,20,.8);font-size:20px;font-weight:800}.drag .drop{display:grid}.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#182131;border:1px solid var(--line);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}@media(max-width:760px){html,body{height:auto;min-height:100%;overflow:auto}.app{display:flex;flex-direction:column;height:auto;min-height:100svh}.view{order:1;height:46svh;min-height:310px;border-bottom:1px solid var(--line)}.side{order:2;border-right:0;min-height:54svh;padding-bottom:env(safe-area-inset-bottom)}header{padding:12px 14px}.actions{padding:10px}.pick,button{min-height:44px}.models{max-height:300px;flex:none}.field input{font-size:16px;min-height:44px}.toolbar{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;flex-wrap:nowrap;overflow-x:auto}.chip{flex:0 0 auto}.status span:last-child{display:none}}@media(orientation:landscape) and (max-height:520px){.app{display:grid;grid-template-columns:290px 1fr;height:100svh}.side{order:1;height:100svh;overflow:auto}.view{order:2;height:100svh;min-height:0}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div class="app"><aside class="side"><header><h1>STL Plate Builder</h1><p>Arrange multiple STL models and export one combined file.</p></header><div class="actions"><label class="pick primary wide">＋ Add STL files<input id="files" type="file" accept=".stl,model/stl,application/sla,application/vnd.ms-pki.stl,application/octet-stream" multiple aria-label="Choose STL files"></label><button id="auto">Auto arrange</button><button id="center">Center all</button><button id="clear">Clear</button><button id="export" class="primary" disabled>Export STL</button></div><div class="plate"><b>Build plate</b><div class="grid" style="margin-top:8px"><div class="field"><label>Width mm</label><input id="pw" type="number" value="220"></div><div class="field"><label>Depth mm</label><input id="pd" type="number" value="220"></div><div class="field"><label>Grid mm</label><input id="gs" type="number" value="10"></div></div></div><div id="models" class="models"><div class="empty">Tap Add STL files and choose one or more files from the Files app.</div></div><div id="edit" class="edit hidden"><b id="selName">Selected model</b><div class="grid" style="margin-top:8px"><div class="field"><label>X</label><input id="x" type="number" step=".1"></div><div class="field"><label>Y</label><input id="y" type="number" step=".1"></div><div class="field"><label>Z</label><input id="z" type="number" step=".1"></div><div class="field"><label>Rotate X°</label><input id="rx" type="number"></div><div class="field"><label>Rotate Y°</label><input id="ry" type="number"></div><div class="field"><label>Rotate Z°</label><input id="rz" type="number"></div><div class="field"><label>Scale X</label><input id="sx" type="number" step=".01"></div><div class="field"><label>Scale Y</label><input id="sy" type="number" step=".01"></div><div class="field"><label>Scale Z</label><input id="sz" type="number" step=".01"></div></div><div class="row"><button id="dropBtn">Drop</button><button id="dup">Duplicate</button><button id="del">Delete</button></div></div></aside><main id="view" class="view"><div id="canvas" class="canvas"></div><div class="toolbar"><button class="chip on" data-mode="translate">Move</button><button class="chip" data-mode="rotate">Rotate</button><button class="chip" data-mode="scale">Scale</button><button id="top" class="chip">Top</button><button id="fit" class="chip">Fit</button><button id="wire" class="chip">Wireframe</button></div><div class="status"><span><b id="count">0</b> models · <b id="tris">0</b> triangles</span><span>Drag orbit · Right-drag pan · Wheel zoom</span></div><div class="drop">Drop STL files to add them</div><div id="toast" class="toast"></div></main></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{TransformControls}from'three/addons/controls/TransformControls.js';import{STLLoader}from'three/addons/loaders/STLLoader.js';import{STLExporter}from'three/addons/exporters/STLExporter.js';const $=x=>document.getElementById(x),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,5000),renderer=new THREE.WebGLRenderer({antialias:true}),orbit=new OrbitControls(camera,renderer.domElement),transform=new TransformControls(camera,renderer.domElement),loader=new STLLoader(),exporter=new STLExporter(),group=new THREE.Group(),models=[];let selected=null,wire=false,color=0;scene.background=new THREE.Color(0x090d14);camera.position.set(240,190,240);renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('canvas').appendChild(renderer.domElement);scene.add(group,new THREE.HemisphereLight(0xffffff,0x293348,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(180,220,160);scene.add(sun);scene.add(transform.getHelper());transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);transform.addEventListener('objectChange',()=>{sync();renderList();stats()});const plate=new THREE.Mesh(new THREE.BoxGeometry(220,220,2),new THREE.MeshStandardMaterial({color:0x263246,transparent:true,opacity:.75}));plate.position.z=-1;scene.add(plate);let grid=new THREE.GridHelper(220,22,0x62708a,0x334156);grid.rotation.x=Math.PI/2;scene.add(grid);const colors=[0x34d399,0x60a5fa,0xf59e0b,0xf472b6,0xa78bfa,0xfb7185];function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}function size(m){return new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3())}function floor(m){m.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(m);m.position.z-=b.min.z}function select(m){selected=m;transform.attach(m);$('edit').classList.remove('hidden');sync();renderList()}function sync(){if(!selected)return;$('selName').textContent=selected.name;const v={x:selected.position.x,y:selected.position.y,z:selected.position.z,rx:THREE.MathUtils.radToDeg(selected.rotation.x),ry:THREE.MathUtils.radToDeg(selected.rotation.y),rz:THREE.MathUtils.radToDeg(selected.rotation.z),sx:selected.scale.x,sy:selected.scale.y,sz:selected.scale.z};for(const[k,n]of Object.entries(v))$(k).value=Number(n.toFixed(3))}function apply(){if(!selected)return;selected.position.set(+$('x').value||0,+$('y').value||0,+$('z').value||0);selected.rotation.set(THREE.MathUtils.degToRad(+$('rx').value||0),THREE.MathUtils.degToRad(+$('ry').value||0),THREE.MathUtils.degToRad(+$('rz').value||0));selected.scale.set(Math.max(.001,+$('sx').value||1),Math.max(.001,+$('sy').value||1),Math.max(.001,+$('sz').value||1));renderList();stats()}['x','y','z','rx','ry','rz','sx','sy','sz'].forEach(i=>$(i).oninput=apply);async function addFiles(fs){const picked=[...fs];if(!picked.length)return;let added=0;for(const f of picked){try{const g=loader.parse(await f.arrayBuffer());g.computeVertexNormals();g.computeBoundingBox();const c=g.boundingBox.getCenter(new THREE.Vector3());g.translate(-c.x,-c.y,-g.boundingBox.min.z);const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:colors[color++%colors.length],roughness:.55,side:THREE.DoubleSide,wireframe:wire}));m.name=f.name.replace(/\.stl$/i,'')||'STL model';m.position.set((models.length%4)*18-27,Math.floor(models.length/4)*18,0);group.add(m);models.push(m);floor(m);select(m);added++}catch(e){console.error(e);toast('Could not read '+f.name)}}renderList();stats();fit();if(added)toast('Added '+added+' file'+(added===1?'':'s'))}function renderList(){const box=$('models');if(!models.length){box.innerHTML='<div class="empty">Tap Add STL files and choose one or more files from the Files app.</div>';$('export').disabled=true;return}$('export').disabled=false;box.innerHTML='';models.forEach(m=>{const d=size(m),c=document.createElement('div');c.className='card'+(m===selected?' active':'');c.innerHTML='<div class="name">'+m.name+'</div><div class="dims">'+d.x.toFixed(1)+' × '+d.y.toFixed(1)+' × '+d.z.toFixed(1)+' mm</div>';c.onclick=()=>select(m);box.appendChild(c)})}function remove(m){if(!m)return;if(selected===m){selected=null;transform.detach();$('edit').classList.add('hidden')}group.remove(m);models.splice(models.indexOf(m),1);m.geometry.dispose();m.material.dispose();renderList();stats()}function duplicate(){if(!selected)return;const m=new THREE.Mesh(selected.geometry.clone(),selected.material.clone());m.name=selected.name+' copy';m.position.copy(selected.position).add(new THREE.Vector3(10,10,0));m.rotation.copy(selected.rotation);m.scale.copy(selected.scale);group.add(m);models.push(m);floor(m);select(m);stats()}function auto(){let x=-+$('pw').value/2+6,y=+$('pd').value/2-6,row=0;for(const m of models){m.rotation.set(0,0,0);const s=size(m);if(x+s.x>+$('pw').value/2-6){x=-+$('pw').value/2+6;y-=row+6;row=0}m.position.x=x+s.x/2;m.position.y=y-s.y/2;floor(m);x+=s.x+6;row=Math.max(row,s.y)}renderList();sync();fit()}function center(){const b=new THREE.Box3();models.forEach(m=>b.expandByObject(m));const c=b.getCenter(new THREE.Vector3());models.forEach(m=>{m.position.x-=c.x;m.position.y-=c.y});sync();renderList()}function fit(){const b=new THREE.Box3();models.length?models.forEach(m=>b.expandByObject(m)):b.setFromObject(plate);const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),q=Math.max(s.x,s.y,s.z,100);orbit.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(q,q*.8,q));camera.updateProjectionMatrix();orbit.update()}function stats(){let t=0;models.forEach(m=>t+=(m.geometry.index?m.geometry.index.count:m.geometry.attributes.position.count)/3);$('count').textContent=models.length;$('tris').textContent=Math.round(t).toLocaleString()}function exportStl(){const root=new THREE.Group();models.forEach(m=>{m.updateMatrixWorld(true);const g=m.geometry.clone();g.applyMatrix4(m.matrixWorld);root.add(new THREE.Mesh(g))});const data=exporter.parse(root,{binary:true}),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));a.download='combined-plate.stl';a.click()}function resize(){const r=$('canvas').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe($('canvas'));function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera)}loop();resize();fit();$('files').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});$('auto').onclick=auto;$('center').onclick=center;$('clear').onclick=()=>[...models].forEach(remove);$('export').onclick=exportStl;$('dropBtn').onclick=()=>{floor(selected);sync();renderList()};$('dup').onclick=duplicate;$('del').onclick=()=>remove(selected);$('fit').onclick=fit;$('top').onclick=()=>{camera.position.set(0,0,Math.max(+$('pw').value,+$('pd').value)*1.4);orbit.target.set(0,0,0);orbit.update()};$('wire').onclick=()=>{wire=!wire;models.forEach(m=>m.material.wireframe=wire);$('wire').classList.toggle('on',wire)};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{transform.setMode(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});renderer.domElement.onpointerdown=e=>{if(e.button)return;const r=renderer.domElement.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(v,camera);const hit=ray.intersectObjects(models)[0];if(hit)select(hit.object)};['dragenter','dragover'].forEach(n=>$('view').addEventListener(n,e=>{e.preventDefault();$('view').classList.add('drag')}));['dragleave','drop'].forEach(n=>$('view').addEventListener(n,e=>{e.preventDefault();$('view').classList.remove('drag')}));$('view').addEventListener('drop',e=>addFiles(e.dataTransfer.files));</script></body></html>
