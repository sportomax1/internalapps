<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STL Plate Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0a0d12; --panel:#111722; --panel2:#171f2d; --line:#2a3547;
      --text:#f5f7fb; --muted:#9eacc2; --accent:#55d6be; --danger:#ff6b7a;
      --shadow:0 18px 50px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{height:100%;display:grid;grid-template-columns:340px minmax(0,1fr)}
    .sidebar{min-height:0;background:linear-gradient(180deg,#131a25,#0e141d);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);z-index:3}
    .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
    .brand h1{font-size:20px;margin:0 0 3px}.brand p{margin:0;color:var(--muted);font-size:12px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 11px;font-weight:700;transition:.15s}
    .btn:hover{transform:translateY(-1px);border-color:#42516a}.btn.primary{background:var(--accent);color:#07110f;border-color:transparent}.btn.danger{color:#ffd8dd}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .wide{grid-column:1/-1}.hidden{display:none!important}
    .section{padding:12px 14px;border-bottom:1px solid var(--line)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-weight:800}.count{color:var(--muted);font-weight:600;font-size:12px}
    .models{overflow:auto;min-height:100px;flex:1;padding:10px}
    .empty{border:1px dashed #344157;border-radius:12px;padding:24px 15px;text-align:center;color:var(--muted)}
    .model-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;margin-bottom:8px;padding:10px;transition:.15s}
    .model-card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(85,214,190,.25)}
    .model-top{display:flex;gap:9px;align-items:center}.swatch{width:13px;height:13px;border-radius:4px;flex:0 0 auto}.model-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750;flex:1}.icon-btn{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:7px}.icon-btn:hover{background:#202a3a;color:var(--text)}
    .dims{font-size:11px;color:var(--muted);margin:5px 0 8px 22px}
    .mini-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mini-actions button{padding:6px;border-radius:7px;border:1px solid var(--line);background:#171f2c;color:var(--text);font-size:11px}.mini-actions button.on{border-color:var(--accent);color:var(--accent)}
    .controls{padding:12px 14px;border-top:1px solid var(--line);background:#0d131c;max-height:44vh;overflow:auto}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input{width:100%;background:#080d14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.field input:focus{outline:none;border-color:var(--accent)}
    .row{display:flex;gap:8px;margin-top:9px}.row .btn{flex:1;padding:8px}
    .viewer{position:relative;min-width:0;min-height:0;touch-action:none}.canvas-wrap{position:absolute;inset:0}.drop-overlay{position:absolute;inset:18px;border:2px dashed rgba(85,214,190,.7);border-radius:18px;display:none;place-items:center;background:rgba(10,13,18,.78);z-index:5;font-size:20px;font-weight:800}.dragging .drop-overlay{display:grid}
    .toolbar{position:absolute;left:16px;top:16px;display:flex;flex-wrap:wrap;gap:7px;z-index:2}.chip{border:1px solid rgba(255,255,255,.13);background:rgba(15,21,31,.78);backdrop-filter:blur(12px);color:var(--text);border-radius:999px;padding:8px 11px;font-weight:700}.chip.on{background:var(--accent);color:#07110f;border-color:transparent}
    .status{position:absolute;left:16px;bottom:15px;right:16px;display:flex;justify-content:space-between;pointer-events:none;color:var(--muted);font-size:12px;text-shadow:0 1px 3px #000}.status strong{color:var(--text)}
    .toast{position:absolute;right:16px;top:16px;z-index:10;background:#182233;border:1px solid #33425a;border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    .notice{font-size:11px;color:var(--muted);margin-top:9px}.kbd{border:1px solid #3b485d;background:#1a2330;border-radius:5px;padding:1px 5px;color:#d9e2ef}
    @media(max-width:900px) and (min-width:761px){.app{grid-template-columns:310px minmax(0,1fr)}.brand{padding:14px}.actions,.section{padding:10px}.controls{padding:10px;max-height:48vh}}
    @media(max-width:760px){
      html,body{height:auto;min-height:100%;overflow:auto;overscroll-behavior-y:auto}
      body{padding-bottom:env(safe-area-inset-bottom)}
      .app{height:auto;min-height:100svh;display:flex;flex-direction:column}
      .viewer{order:1;height:48svh;min-height:330px;max-height:520px;touch-action:none;border-bottom:1px solid var(--line)}
      .sidebar{order:2;border:0;box-shadow:none;min-height:52svh;padding-bottom:env(safe-area-inset-bottom)}
      .brand{padding:12px 14px 10px}.brand h1{font-size:18px}.brand p{font-size:11px}
      .actions{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;gap:7px}
      .btn{min-height:44px;padding:9px 8px}.wide{grid-column:1/-1}
      .section{padding:10px 12px}.section-title{margin-bottom:7px}
      .models{flex:none;max-height:300px;padding:8px 10px}
      .model-card{padding:9px}.mini-actions button{min-height:38px;font-size:12px}
      .controls{max-height:none;overflow:visible;padding:12px;background:#0d131c}
      .grid{gap:7px}.field input{min-height:44px;font-size:16px;padding:8px}
      .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row .btn:last-child{grid-column:1/-1}
      .toolbar{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
      .toolbar::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:40px;padding:8px 12px}
      .status{left:10px;right:10px;bottom:9px;font-size:10px}.status span:last-child{display:none}
      .drop-overlay{inset:10px;font-size:17px}.toast{top:60px;left:10px;right:10px;text-align:center}
    }
    @media(max-width:390px){.viewer{height:45svh;min-height:300px}.grid{grid-template-columns:repeat(2,1fr)}.plate-grid{grid-template-columns:repeat(3,1fr)}.brand p{display:none}}
    @media(orientation:landscape) and (max-height:520px) and (max-width:900px){.app{display:grid;grid-template-columns:290px 1fr;height:100svh;min-height:0}.sidebar{order:1;height:100svh;overflow:auto;border-right:1px solid var(--line)}.viewer{order:2;height:100svh;max-height:none;min-height:0}.models{max-height:180px}.brand p{display:none}}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>STL Plate Builder</h1><p>Arrange multiple models and export one STL file.</p></div>
    <div class="actions">
      <button class="btn primary wide" id="uploadBtn">＋ Add STL files</button>
      <input class="hidden" id="fileInput" type="file" accept=".stl,model/stl" multiple>
      <button class="btn" id="autoBtn">Auto arrange</button>
      <button class="btn" id="centerAllBtn">Center all</button>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn primary" id="exportBtn" disabled>Export STL</button>
    </div>
    <div class="section">
      <div class="section-title">Build plate <span class="count">millimeters</span></div>
      <div class="grid plate-grid">
        <div class="field"><label>Width</label><input id="plateW" type="number" min="20" max="1000" step="1" value="220"></div>
        <div class="field"><label>Depth</label><input id="plateD" type="number" min="20" max="1000" step="1" value="220"></div>
        <div class="field"><label>Grid</label><input id="gridSize" type="number" min="1" max="100" step="1" value="10"></div>
      </div>
    </div>
    <div class="models" id="models"><div class="empty">Drop STL files here<br>or tap <b>Add STL files</b>.</div></div>
    <div class="controls hidden" id="controls">
      <div class="section-title"><span id="selectedName">Selected model</span><span class="count" id="selectedDims"></span></div>
      <div class="grid">
        <div class="field"><label>X</label><input id="posX" type="number" step="0.1"></div>
        <div class="field"><label>Y</label><input id="posY" type="number" step="0.1"></div>
        <div class="field"><label>Z</label><input id="posZ" type="number" step="0.1"></div>
        <div class="field"><label>Rotate X°</label><input id="rotX" type="number" step="1"></div>
        <div class="field"><label>Rotate Y°</label><input id="rotY" type="number" step="1"></div>
        <div class="field"><label>Rotate Z°</label><input id="rotZ" type="number" step="1"></div>
        <div class="field"><label>Scale X</label><input id="scaleX" type="number" step="0.01" min="0.001"></div>
        <div class="field"><label>Scale Y</label><input id="scaleY" type="number" step="0.01" min="0.001"></div>
        <div class="field"><label>Scale Z</label><input id="scaleZ" type="number" step="0.01" min="0.001"></div>
      </div>
      <div class="row"><button class="btn" id="uniformBtn">Uniform scale</button><button class="btn" id="dropBtn">Drop to plate</button><button class="btn danger" id="deleteBtn">Delete</button></div>
      <div class="notice">Shortcuts: <span class="kbd">W</span> move, <span class="kbd">E</span> rotate, <span class="kbd">R</span> scale, <span class="kbd">Delete</span> remove.</div>
    </div>
  </aside>
  <main class="viewer" id="viewer">
    <div class="canvas-wrap" id="canvasWrap"></div>
    <div class="drop-overlay">Drop STL files to add them</div>
    <div class="toolbar">
      <button class="chip on" data-mode="translate">Move</button><button class="chip" data-mode="rotate">Rotate</button><button class="chip" data-mode="scale">Scale</button>
      <button class="chip" id="topBtn">Top</button><button class="chip" id="fitBtn">Fit</button><button class="chip on" id="gridBtn">Grid</button><button class="chip" id="wireBtn">Wireframe</button>
    </div>
    <div class="status"><span><strong id="modelCount">0</strong> models · <strong id="triCount">0</strong> triangles</span><span>Orbit: drag · Pan: right-drag · Zoom: wheel</span></div>
    <div class="toast" id="toast"></div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

const $ = id => document.getElementById(id);
const viewer = $('viewer'), host = $('canvasWrap');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0d12);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000); camera.position.set(240,190,240);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; host.appendChild(renderer.domElement);
const orbit = new OrbitControls(camera, renderer.domElement); orbit.enableDamping=true; orbit.target.set(0,0,20); orbit.maxPolarAngle=Math.PI/2-.015;
const transform = new TransformControls(camera, renderer.domElement); scene.add(transform.getHelper());
transform.addEventListener('dragging-changed', e=>orbit.enabled=!e.value); transform.addEventListener('objectChange', ()=>{syncInputs(); refreshCards(); updateStats();});
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x273142,2.2)); const sun=new THREE.DirectionalLight(0xffffff,3); sun.position.set(180,220,140); sun.castShadow=true; scene.add(sun);
const fill=new THREE.DirectionalLight(0x79a7ff,1.2); fill.position.set(-150,80,-120); scene.add(fill);
const plateGroup=new THREE.Group(); scene.add(plateGroup); let gridHelper, plateMesh;
const modelGroup=new THREE.Group(); scene.add(modelGroup);
const loader=new STLLoader(); const exporter=new STLExporter(); const models=[]; let selected=null; let wireframe=false; let colorIndex=0;
const colors=[0x55d6be,0x6ea8fe,0xffc857,0xff7b89,0xb59cff,0x79df82,0xff9f5b,0x67d5ff];

function updatePlate(){
  const w=Math.max(20,+$('plateW').value||220), d=Math.max(20,+$('plateD').value||220), step=Math.max(1,+$('gridSize').value||10);
  if(plateMesh){plateMesh.geometry.dispose();plateMesh.material.dispose();plateGroup.remove(plateMesh)} if(gridHelper){gridHelper.geometry.dispose();gridHelper.material.dispose();plateGroup.remove(gridHelper)}
  plateMesh=new THREE.Mesh(new THREE.BoxGeometry(w,d,2),new THREE.MeshStandardMaterial({color:0x243043,roughness:.86,metalness:.05,transparent:true,opacity:.88})); plateMesh.position.z=-1; plateMesh.receiveShadow=true; plateGroup.add(plateMesh);
  gridHelper=new THREE.GridHelper(Math.max(w,d),Math.max(2,Math.round(Math.max(w,d)/step)),0x65738a,0x334056);gridHelper.rotation.x=Math.PI/2;gridHelper.scale.x=w/Math.max(w,d);gridHelper.scale.z=d/Math.max(w,d);gridHelper.position.z=.02;plateGroup.add(gridHelper);
}
updatePlate(); ['plateW','plateD','gridSize'].forEach(id=>$(id).addEventListener('change',updatePlate));

function flash(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>t.classList.remove('show'),2200)}
function meshSize(mesh){return new THREE.Box3().setFromObject(mesh).getSize(new THREE.Vector3())}
function floorMesh(mesh){mesh.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(mesh);mesh.position.z-=b.min.z;mesh.updateMatrixWorld(true)}
function centerGeometry(g){g.computeBoundingBox();const b=g.boundingBox,c=b.getCenter(new THREE.Vector3());g.translate(-c.x,-c.y,-b.min.z);g.computeBoundingBox();g.computeBoundingSphere()}
function selectModel(mesh){selected=mesh;transform.attach(mesh);$('controls').classList.remove('hidden');syncInputs();refreshCards()}
function syncInputs(){if(!selected)return;const s=meshSize(selected);$('selectedName').textContent=selected.userData.name;$('selectedDims').textContent=`${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} mm`;const vals={posX:selected.position.x,posY:selected.position.y,posZ:selected.position.z,rotX:THREE.MathUtils.radToDeg(selected.rotation.x),rotY:THREE.MathUtils.radToDeg(selected.rotation.y),rotZ:THREE.MathUtils.radToDeg(selected.rotation.z),scaleX:selected.scale.x,scaleY:selected.scale.y,scaleZ:selected.scale.z};Object.entries(vals).forEach(([k,v])=>$(k).value=Number(v.toFixed(3)))}
function applyInputs(){if(!selected)return;selected.position.set(+$('posX').value||0,+$('posY').value||0,+$('posZ').value||0);selected.rotation.set(THREE.MathUtils.degToRad(+$('rotX').value||0),THREE.MathUtils.degToRad(+$('rotY').value||0),THREE.MathUtils.degToRad(+$('rotZ').value||0));selected.scale.set(Math.max(.001,+$('scaleX').value||1),Math.max(.001,+$('scaleY').value||1),Math.max(.001,+$('scaleZ').value||1));selected.updateMatrixWorld(true);refreshCards();updateStats()}
['posX','posY','posZ','rotX','rotY','rotZ','scaleX','scaleY','scaleZ'].forEach(id=>$(id).addEventListener('input',applyInputs));

async function loadFiles(fileList){const files=[...fileList].filter(f=>f.name.toLowerCase().endsWith('.stl'));if(!files.length){flash('Choose STL files');return}for(const file of files){try{const buffer=await file.arrayBuffer(), geometry=loader.parse(buffer);geometry.computeVertexNormals();centerGeometry(geometry);const material=new THREE.MeshStandardMaterial({color:colors[colorIndex++%colors.length],roughness:.56,metalness:.08,side:THREE.DoubleSide,wireframe});const mesh=new THREE.Mesh(geometry,material);mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData={name:file.name.replace(/\.stl$/i,''),source:file.name};const n=models.length;mesh.position.set((n%4)*18-27,Math.floor(n/4)*18-18,0);modelGroup.add(mesh);models.push(mesh);floorMesh(mesh);selectModel(mesh)}catch(err){console.error(err);flash(`Could not read ${file.name}`)}}refreshCards();updateStats();fitView();$('fileInput').value=''}

function refreshCards(){const box=$('models');if(!models.length){box.innerHTML='<div class="empty">Drop STL files here<br>or tap <b>Add STL files</b>.</div>';$('exportBtn').disabled=true;return}$('exportBtn').disabled=false;box.innerHTML='';models.forEach((m,i)=>{const s=meshSize(m),card=document.createElement('div');card.className='model-card'+(m===selected?' active':'');card.innerHTML=`<div class="model-top"><span class="swatch" style="background:#${m.material.color.getHexString()}"></span><span class="model-name" title="${m.userData.name}">${m.userData.name}</span><button class="icon-btn" data-act="delete" title="Delete">✕</button></div><div class="dims">${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} mm</div><div class="mini-actions"><button data-act="select">Edit</button><button data-act="floor">Drop</button><button data-act="duplicate">Copy</button><button data-act="center">Center</button></div>`;card.addEventListener('click',e=>{const act=e.target.dataset.act;if(!act){selectModel(m);return}e.stopPropagation();if(act==='delete')removeModel(m);if(act==='select')selectModel(m);if(act==='floor'){floorMesh(m);syncInputs();refreshCards()}if(act==='duplicate')duplicateModel(m);if(act==='center'){m.position.x=0;m.position.y=0;floorMesh(m);selectModel(m)}});box.appendChild(card)})}
function removeModel(mesh){const i=models.indexOf(mesh);if(i<0)return;if(selected===mesh){selected=null;transform.detach();$('controls').classList.add('hidden')}modelGroup.remove(mesh);models.splice(i,1);mesh.geometry.dispose();mesh.material.dispose();refreshCards();updateStats()}
function duplicateModel(mesh=selected){if(!mesh)return;const copy=new THREE.Mesh(mesh.geometry.clone(),mesh.material.clone());copy.userData={...mesh.userData,name:`${mesh.userData.name} copy`};copy.position.copy(mesh.position).add(new THREE.Vector3(10,10,0));copy.rotation.copy(mesh.rotation);copy.scale.copy(mesh.scale);copy.castShadow=copy.receiveShadow=true;modelGroup.add(copy);models.push(copy);floorMesh(copy);selectModel(copy);updateStats()}
function updateStats(){let triangles=0;models.forEach(m=>triangles+=(m.geometry.index?m.geometry.index.count:m.geometry.attributes.position.count)/3);$('modelCount').textContent=models.length;$('triCount').textContent=Math.round(triangles).toLocaleString()}
function autoArrange(){const w=Math.max(20,+$('plateW').value||220),d=Math.max(20,+$('plateD').value||220),margin=5,gap=6;let x=-w/2+margin,y=d/2-margin,rowH=0,overflow=false;for(const m of models){m.rotation.set(0,0,0);m.scale.set(m.scale.x,m.scale.y,m.scale.z);floorMesh(m);const s=meshSize(m);if(x+s.x>w/2-margin){x=-w/2+margin;y-=rowH+gap;rowH=0}if(y-s.y<-d/2+margin)overflow=true;m.position.x=x+s.x/2;m.position.y=y-s.y/2;floorMesh(m);x+=s.x+gap;rowH=Math.max(rowH,s.y)}syncInputs();refreshCards();fitView();flash(overflow?'Arranged, but some models exceed the plate':'Models arranged')}
function centerAll(){if(!models.length)return;const box=new THREE.Box3();models.forEach(m=>box.expandByObject(m));const c=box.getCenter(new THREE.Vector3());models.forEach(m=>{m.position.x-=c.x;m.position.y-=c.y});syncInputs();refreshCards();flash('Models centered')}
function fitView(){const box=new THREE.Box3();if(models.length)models.forEach(m=>box.expandByObject(m));else box.setFromObject(plateMesh);const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z,80);orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(max*.95,max*.75,max*.95));camera.near=Math.max(.1,max/1000);camera.far=Math.max(5000,max*20);camera.updateProjectionMatrix();orbit.update()}
function setTop(){const w=+$('plateW').value||220,d=+$('plateD').value||220;orbit.target.set(0,0,0);camera.position.set(0,0,Math.max(w,d)*1.35);camera.up.set(0,1,0);camera.lookAt(orbit.target);orbit.update()}
function exportCombined(){if(!models.length)return;const exportRoot=new THREE.Group();models.forEach(m=>{m.updateMatrixWorld(true);const g=m.geometry.clone();g.applyMatrix4(m.matrixWorld);const temp=new THREE.Mesh(g);exportRoot.add(temp)});const result=exporter.parse(exportRoot,{binary:true});const blob=new Blob([result],{type:'model/stl'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='combined-plate.stl';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);exportRoot.children.forEach(c=>c.geometry.dispose());flash('Combined STL exported')}

$('uploadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>loadFiles(e.target.files);$('autoBtn').onclick=autoArrange;$('centerAllBtn').onclick=centerAll;$('clearBtn').onclick=()=>{[...models].forEach(removeModel);flash('Plate cleared')};$('exportBtn').onclick=exportCombined;$('deleteBtn').onclick=()=>removeModel(selected);$('dropBtn').onclick=()=>{if(selected){floorMesh(selected);syncInputs();refreshCards()}};$('uniformBtn').onclick=()=>{if(!selected)return;const v=Math.max(.001,+$('scaleX').value||1);selected.scale.setScalar(v);syncInputs();refreshCards();updateStats()};$('fitBtn').onclick=fitView;$('topBtn').onclick=setTop;$('gridBtn').onclick=e=>{gridHelper.visible=!gridHelper.visible;e.currentTarget.classList.toggle('on',gridHelper.visible)};$('wireBtn').onclick=e=>{wireframe=!wireframe;models.forEach(m=>m.material.wireframe=wireframe);e.currentTarget.classList.toggle('on',wireframe)};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{transform.setMode(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0||transform.dragging)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(models,false)[0];if(hit)selectModel(hit.object)});
['dragenter','dragover'].forEach(name=>viewer.addEventListener(name,e=>{e.preventDefault();viewer.classList.add('dragging')}));['dragleave','drop'].forEach(name=>viewer.addEventListener(name,e=>{e.preventDefault();viewer.classList.remove('dragging')}));viewer.addEventListener('drop',e=>loadFiles(e.dataTransfer.files));
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='w')transform.setMode('translate');if(e.key.toLowerCase()==='e')transform.setMode('rotate');if(e.key.toLowerCase()==='r')transform.setMode('scale');if((e.key==='Delete'||e.key==='Backspace')&&selected)removeModel(selected)});
function resize(){const r=host.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);
function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}resize();fitView();animate();
</script>
</body>
</html>
