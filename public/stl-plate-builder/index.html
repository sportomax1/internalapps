$('del').onclick=()=>selected&&remove(selected);
for(const [id,direction] of [['iso','iso'],['top','top'],['front','front'],['side','side']]) $(id).onclick=()=>view(direction);
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{
  transform.setMode(button.dataset.mode);
  transform.setSpace(button.dataset.mode === 'rotate' ? 'local' : 'world');
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b===button));
});
function exportSTL() {
  if(!models.length)return;
  const output=new THREE.Group();
  for(const model of models){model.updateMatrixWorld(true);const geometry=model.geometry.clone();geometry.applyMatrix4(model.matrixWorld);output.add(new THREE.Mesh(geometry));}
  const url=URL.createObjectURL(new Blob([exporter.parse(output,{binary:true})],{type:'model/stl'}));
  const link=document.createElement('a');link.href=url;link.download='combined-plate.stl';document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  output.traverse(object=>object.geometry?.dispose());
}
$('export').onclick=$('exportm').onclick=exportSTL;
const raycaster=new THREE.Raycaster(), point=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',event=>{
  pointerStart={x:event.clientX,y:event.clientY};
  if (transform.axis) setTransformGesture(true);
},{capture:true});
renderer.domElement.addEventListener('pointerup',event=>{
  const wasTransforming = transformGesture || transform.dragging;
  if (!transform.dragging) setTransformGesture(false);
  if(!pointerStart || Math.hypot(event.clientX-pointerStart.x,event.clientY-pointerStart.y)>8 || !models.length || wasTransforming) return;
  const rect=renderer.domElement.getBoundingClientRect();
  point.set((event.clientX-rect.left)/rect.width*2-1,-(event.clientY-rect.top)/rect.height*2+1);
  raycaster.setFromCamera(point,camera);
  const hit=raycaster.intersectObjects(models,false)[0];
  if(hit){select(hit.object);if(matchMedia('(max-width:760px)').matches)panel('edit');}
});
function resize() {
  const r=host.getBoundingClientRect();
  renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),true);
  camera.aspect=Math.max(.1,r.width/Math.max(1,r.height));
  camera.updateProjectionMatrix();
  transform.setSize(matchMedia('(max-width:760px)').matches ? .72 : 1);
}
for (const id of ['pw','pd','gs']) $(id).addEventListener('change', () => { plateUp(); fit(); });
plateUp(); cards(); resize(); fit();
new ResizeObserver(resize).observe(host);
window.visualViewport?.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); fit(); }, 120));
function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera);} loop();
</script></body></html>
