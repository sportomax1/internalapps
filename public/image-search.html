<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Image Finder</title><style>
:root{color-scheme:dark;--bg:#090b0f;--p:#151922;--line:#2b3340;--t:#f5f7fb;--m:#98a4b5;--a:#8ab4f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#090b0fee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.wrap{max-width:1450px;margin:auto;padding:12px}.top{display:flex;gap:8px}.search{flex:1;display:flex;background:var(--p);border:1px solid var(--line);border-radius:14px;overflow:hidden}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--t);font:inherit;padding:13px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#222936;color:var(--t);font:inherit;font-weight:700}.primary{background:var(--a);color:#07101e}.tabs{display:flex;gap:7px;margin-top:10px}.tab{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--p);color:var(--t)}.tab.on{background:var(--a);color:#07101e;font-weight:800}.note,.status{max-width:1450px;margin:auto;padding:11px 12px;color:var(--m);font-size:13px}.status.err{color:#ff928a}.grid{max-width:1450px;margin:auto;padding:3px 10px 50px;columns:5 190px;column-gap:8px}.card{break-inside:avoid;margin:0 0 8px;background:var(--p);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer}.card img{display:block;width:100%;min-height:90px;background:#1d222b}.meta{padding:7px}.title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.host{font-size:10px;color:var(--m);margin-top:3px}.empty{column-span:all;text-align:center;padding:90px 15px;color:var(--m)}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;padding:20px;align-items:center;justify-content:center}.modal.on{display:flex}.modal img{max-width:94vw;max-height:80vh}.actions{display:flex;justify-content:center;gap:8px;margin-top:10px}.x{position:absolute;right:14px;top:14px;font-size:24px}@media(max-width:650px){.grid{columns:2 140px;padding:3px 7px 40px}.wrap{padding:9px}.btn{padding:11px}.note{font-size:11px}}</style></head><body>
<header><div class="wrap"><form id="form" class="top"><div class="search"><input id="q" value="Journey church Colorado logo" placeholder="Search web images…"></div><button class="btn primary">Search</button></form><div class="tabs"><button class="tab on" data-p="ddg">DuckDuckGo Web</button><button class="tab" data-p="wiki">Wikimedia</button></div></div><div class="note" id="note">DuckDuckGo uses the Internal Apps Vercel backend, so your browser no longer calls DDG directly. No API key.</div></header>
<div class="status" id="status">Ready.</div><main class="grid" id="grid"><div class="empty">Search for an image, logo, company, place, or anything else.</div></main>
<div class="modal" id="modal"><button class="btn x" id="x">×</button><div><img id="large"><div class="actions"><button class="btn" id="copy">Copy URL</button><button class="btn primary" id="source">Open source</button></div></div></div>
<script>
const $=s=>document.querySelector(s);let provider='ddg',active=null;
function h(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return''}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{provider=b.dataset.p;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('#note').textContent=provider==='ddg'?'DuckDuckGo uses the Internal Apps Vercel backend, so your browser no longer calls DDG directly. No API key.':'Wikimedia Commons uses its official public API. No key, but it is not a general-web index.'});
function render(a){$('#grid').innerHTML=a.length?'':'<div class="empty">No results.</div>';a.forEach(it=>{const c=document.createElement('article');c.className='card';c.innerHTML='<img loading="lazy" src="'+(it.thumbnail||it.image)+'"><div class="meta"><div class="title"></div><div class="host">'+h(it.source||it.image)+'</div></div>';c.querySelector('.title').textContent=it.title||'Image';c.onclick=()=>{active=it;$('#large').src=it.image;$('#modal').classList.add('on')};$('#grid').appendChild(c)})}
async function go(){const q=$('#q').value.trim();if(!q)return;$('#status').className='status';$('#status').textContent='Searching…';try{let a;if(provider==='ddg'){const r=await fetch('/api/tools?action=images&q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');a=d.results||[]}else{const u='https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url&iiurlwidth=500&format=json';const d=await(await fetch(u)).json();a=Object.values(d.query?.pages||{}).map(x=>({title:(x.title||'').replace(/^File:/,''),image:x.imageinfo?.[0]?.url,thumbnail:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url,source:x.imageinfo?.[0]?.descriptionurl})).filter(x=>x.image)}render(a);$('#status').textContent=a.length+' results from '+(provider==='ddg'?'DuckDuckGo':'Wikimedia')+'.'}catch(e){$('#grid').innerHTML='<div class="empty">Search failed.</div>';$('#status').className='status err';$('#status').textContent=e.message}}
$('#form').onsubmit=e=>{e.preventDefault();go()};$('#x').onclick=()=>$('#modal').classList.remove('on');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};$('#copy').onclick=()=>active&&navigator.clipboard.writeText(active.image);$('#source').onclick=()=>active&&window.open(active.source||active.image,'_blank','noopener');
</script></body></html>
