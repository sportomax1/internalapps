<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Image Finder</title><style>
:root{color-scheme:dark;--bg:#090b0f;--p:#151922;--line:#2b3340;--t:#f5f7fb;--m:#98a4b5;--a:#8ab4f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#090b0fee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.wrap{max-width:1450px;margin:auto;padding:12px}.top{display:flex;gap:8px}.search{flex:1;display:flex;background:var(--p);border:1px solid var(--line);border-radius:14px;overflow:hidden}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--t);font:inherit;padding:13px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#222936;color:var(--t);font:inherit;font-weight:700}.primary{background:var(--a);color:#07101e}.tabs{display:flex;gap:7px;margin-top:10px}.tab{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--p);color:var(--t)}.tab.on{background:var(--a);color:#07101e;font-weight:800}.note,.status{max-width:1450px;margin:auto;padding:11px 12px;color:var(--m);font-size:13px}.status.err{color:#ff928a}.grid{max-width:1450px;margin:auto;padding:3px 10px 50px;columns:5 190px;column-gap:8px}.card{break-inside:avoid;margin:0 0 8px;background:var(--p);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer}.card img{display:block;width:100%;min-height:90px;background:#1d222b}.meta{padding:7px}.title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.host{font-size:10px;color:var(--m);margin-top:3px}.empty{column-span:all;text-align:center;padding:90px 15px;color:var(--m)}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000e;padding:20px;align-items:center;justify-content:center}.modal.on{display:flex}.modal img{max-width:94vw;max-height:80vh}.actions{display:flex;justify-content:center;gap:8px;margin-top:10px}.x{position:absolute;right:14px;top:14px;font-size:24px}@media(max-width:650px){.grid{columns:2 140px;padding:3px 7px 40px}.wrap{padding:9px}.btn{padding:11px}.note{font-size:11px}}</style></head><body>
<header><div class="wrap"><form id="form" class="top"><div class="search"><input id="q" value="Journey church Colorado logo" placeholder="Search web images…"></div><button class="btn primary">Search</button></form></div><div class="note" id="note">Search opens the real DuckDuckGo Images results — the same results you get directly on DuckDuckGo.</div></header>
<div class="status" id="status">Ready.</div><main class="grid" id="grid"><div class="empty">Enter a search above. Results open in DuckDuckGo Images.</div></main>
<div class="modal" id="modal"><button class="btn x" id="x">×</button><div><img id="large"><div class="actions"><button class="btn" id="copy">Copy URL</button><button class="btn primary" id="source">Open source</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
function go(){
  const q=$('#q').value.trim();
  if(!q)return;
  const url='https://duckduckgo.com/?q='+encodeURIComponent(q)+'&iax=images&ia=images';
  $('#status').className='status';
  $('#status').textContent='Opening DuckDuckGo Images…';
  window.location.assign(url);
}
$('#form').onsubmit=e=>{e.preventDefault();go()};

</script></body></html>
