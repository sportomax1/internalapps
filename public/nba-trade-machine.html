<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA Trade Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07111f;--panel:#102239;--line:#27415f;--text:#f7f9fc;--muted:#9eb1c8;--accent:#f36b2f;--good:#42d895;--bad:#ff6878}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#102944,#07111f 42%);color:var(--text);font:15px/1.4 system-ui,sans-serif;min-height:100vh}.app{max-width:1500px;margin:auto;padding:16px}button,input,select{font:inherit}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.brand{display:flex;gap:11px;align-items:center}.ball{font-size:28px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#152a43;color:white;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);border-color:transparent}.btn.good{background:#174737}.btn.bad{background:#421e29}.layout{display:grid;grid-template-columns:350px 1fr;gap:15px}.panel{background:rgba(13,28,47,.98);border:1px solid var(--line);border-radius:15px}.browser{padding:13px;height:calc(100vh - 92px);position:sticky;top:12px;display:flex;flex-direction:column;overflow:hidden}.row{display:flex;gap:8px}.row select{flex:1}input,select{width:100%;background:#071522;color:white;border:1px solid var(--line);border-radius:10px;padding:10px}.teamhead{display:flex;align-items:center;gap:10px;padding:12px 2px}.teamhead img,.teamlogo{width:45px;height:45px;object-fit:contain}.players{display:grid;gap:8px;overflow:auto}.player,.tradeplayer{display:grid;grid-template-columns:52px 1fr auto;gap:9px;align-items:center;background:#081624;border:1px solid #203a57;border-radius:12px;padding:8px}.player img,.tradeplayer img{width:52px;height:52px;object-fit:cover;border-radius:9px;background:#18293d}.name{font-weight:800}.stats{font-size:12px;color:var(--muted);margin-top:4px}.stats b{color:white}.add,.remove{border:0;border-radius:9px;width:34px;height:34px;color:white;cursor:pointer}.add{background:var(--accent);font-size:22px}.remove{background:#421a25;font-size:19px}.workspace{display:grid;gap:13px}.toolbar{padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.counts{display:flex;gap:7px}.pill{border:1px solid var(--line);background:#0b1828;color:white;border-radius:999px;padding:7px 10px;cursor:pointer}.pill.active{background:var(--accent)}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tradebox{padding:13px;min-height:280px}.tradehead{display:grid;grid-template-columns:46px 1fr minmax(120px,170px);gap:9px;align-items:center}.tradehead h2{font-size:18px;margin:0}.outgoing{display:grid;gap:8px;margin-top:12px}.empty,.loading{padding:22px;text-align:center;color:var(--muted);border:1px dashed #375776;border-radius:11px}.totals{display:flex;gap:15px;border-top:1px solid var(--line);margin-top:11px;padding-top:10px;color:var(--muted);font-size:12px}.totals b{display:block;color:white;font-size:17px}.summary{padding:14px}.summarygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.summarycard{background:#081624;border:1px solid #213b57;border-radius:11px;padding:11px}.positive{color:var(--good)}.negative{color:var(--bad)}.status{margin-top:10px;padding:9px 11px;border-radius:10px;background:#102942;color:var(--muted);font-size:13px}.status.ok{color:#b9f7d8}.status.err{color:#ffb4bd}.modalwrap{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:16px}.modalwrap.show{display:flex}.modal{width:min(520px,100%);padding:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.toast{position:fixed;right:15px;bottom:15px;background:white;color:#07111f;padding:10px 13px;border-radius:10px;font-weight:800;transform:translateY(100px);transition:.2s;z-index:20}.toast.show{transform:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.browser{height:550px;position:relative;top:auto}.teams{grid-template-columns:1fr}}@media(min-width:1200px){.teams.cols-3{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="ball">🏀</div><div><h1 style="margin:0">NBA Trade Lab</h1><div class="muted">ESPN rosters through a Supabase proxy</div></div></div><div class="actions"><button class="btn good" id="saveBtn">Save</button><button class="btn" id="loadBtn">Load</button><button class="btn bad" id="resetBtn">Reset</button></div></header>
<div class="layout">
<aside class="panel browser"><div class="row"><select id="browseTeam"></select><button class="btn" id="refreshBtn">↻</button></div><input id="search" placeholder="Search roster…" style="margin-top:9px"><div id="teamHead" class="teamhead"></div><div id="playerList" class="players"><div class="loading">Loading teams…</div></div><div id="apiStatus" class="status">Connecting to ESPN…</div></aside>
<main class="workspace"><section class="panel toolbar"><div><strong>Trade participants</strong><div class="muted">Select 2–4 teams and add outgoing players.</div></div><div class="counts" id="teamCount"></div></section><section id="teamsGrid" class="teams"></section><section class="panel summary"><h2 style="margin-top:0">Trade Snapshot</h2><div id="summaryGrid" class="summarygrid"></div></section></main>
</div></div>
<div id="modalWrap" class="modalwrap"><div class="panel modal"><h2 id="modalTitle"></h2><div id="modalFields"></div><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="confirmModal">Continue</button></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://jadyqyrpgcmaixroizov.supabase.co';
const SUPABASE_KEY='sb_publishable_1aiH7EnJyY7XtXYVbSWvjg_NIBK0kYz';
const PROXY=SUPABASE_URL+'/functions/v1/espn-nba-proxy?url=';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ESPN='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const WEB='https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';
const $=s=>document.querySelector(s);
const state={teams:[],teamCount:2,participants:[],rosters:{},trade:{},browseTeamId:null,query:'',title:'Untitled Trade',saveCode:null};
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}
function status(m,ok=true){const e=$('#apiStatus');e.textContent=m;e.className='status '+(ok?'ok':'err')}
function proxyUrl(url){return PROXY+encodeURIComponent(url)}
async function getJSON(url){const r=await fetch(proxyUrl(url),{headers:{apikey:SUPABASE_KEY}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error('Proxy returned invalid JSON')}if(!r.ok)throw new Error(j?.error||('HTTP '+r.status));return j}
function logo(t){return t?.logos?.[0]?.href||`https://a.espncdn.com/i/teamlogos/nba/500/${(t?.abbreviation||'nba').toLowerCase()}.png`}
function normalizeTeam(raw){const t=raw.team||raw;return{id:String(t.id),name:t.displayName||t.name||'Unknown',short:t.shortDisplayName||t.nickname||t.name,abbreviation:t.abbreviation||'',logos:t.logos||[]}}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function parseStats(raw){const map={};const walk=x=>{if(!x)return;if(Array.isArray(x)){x.forEach(walk);return}if(typeof x==='object'){if(x.name&&x.value!=null)map[x.name]=x.value;if(x.abbreviation&&x.value!=null)map[x.abbreviation]=x.value;if(x.displayName&&x.value!=null)map[x.displayName]=x.value;if(Array.isArray(x.labels)&&Array.isArray(x.stats)){x.labels.forEach((k,i)=>map[k]=x.stats[i])}Object.values(x).forEach(v=>typeof v==='object'&&walk(v))}};walk(raw?.statistics||raw?.stats||raw?.athlete?.statistics||raw);const pick=(...ks)=>{for(const k of ks)if(map[k]!=null&&map[k]!=='')return num(map[k]);return 0};return{ppg:pick('avgPoints','pointsPerGame','PPG','PTS','Points Per Game','points'),rpg:pick('avgRebounds','reboundsPerGame','RPG','REB','Rebounds Per Game','rebounds'),apg:pick('avgAssists','assistsPerGame','APG','AST','Assists Per Game','assists')}}
function normalizePlayer(x,teamId){const a=x.athlete||x;const s=parseStats(x);return{id:String(a.id),teamId,name:a.fullName||a.displayName||a.shortName||'Unknown Player',position:a.position?.abbreviation||a.position?.name||'',jersey:a.jersey||'',headshot:a.headshot?.href||`https://a.espncdn.com/i/headshots/nba/players/full/${a.id}.png`,ppg:s.ppg,rpg:s.rpg,apg:s.apg,statsLoaded:(s.ppg+s.rpg+s.apg)>0}}
async function loadTeams(){status('Loading NBA teams…');try{const d=await getJSON(`${ESPN}/teams?limit=100`);const rows=d?.sports?.[0]?.leagues?.[0]?.teams||d?.teams||[];state.teams=rows.map(normalizeTeam).filter(t=>t.id).sort((a,b)=>a.name.localeCompare(b.name));if(!state.teams.length)throw new Error('ESPN returned no teams');const local=restoreLocal();if(!local){const pref=['7','13','17','2'];state.participants=pref.filter(id=>state.teams.some(t=>t.id===id)).slice(0,2);while(state.participants.length<2)state.participants.push(state.teams.find(t=>!state.participants.includes(t.id)).id)}state.browseTeamId=state.participants[0]||state.teams[0].id;renderAll();await loadRoster(state.browseTeamId);status(`ESPN connected • ${state.teams.length} teams loaded`)}catch(e){console.error(e);status('ESPN connection failed: '+e.message,false);$('#playerList').innerHTML='<div class="empty">Could not load ESPN teams. Tap refresh.</div>'}}
async function loadRoster(teamId,force=false){if(state.rosters[teamId]&&!force){renderBrowser();return}$('#playerList').innerHTML='<div class="loading">Loading roster…</div>';const endpoints=[`${ESPN}/teams/${teamId}/roster`,`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${teamId}?enable=roster`];let last;for(const url of endpoints){try{const d=await getJSON(url);let groups=d?.athletes||d?.team?.athletes||d?.team?.roster?.athletes||[];let rows=[];if(Array.isArray(groups))for(const g of groups){if(Array.isArray(g?.items))rows.push(...g.items);else if(Array.isArray(g?.athletes))rows.push(...g.athletes);else if(g?.athlete||g?.id)rows.push(g)}if(!rows.length&&Array.isArray(d?.roster?.entries))rows=d.roster.entries;const roster=rows.map(x=>normalizePlayer(x,teamId)).filter(p=>p.id&&p.name!=='Unknown Player').sort((a,b)=>a.name.localeCompare(b.name));if(!roster.length)throw new Error('No roster rows');state.rosters[teamId]=roster;renderBrowser();status(`ESPN connected • ${roster.length} players loaded`);return}catch(e){last=e}}console.error(last);status('Roster failed: '+(last?.message||'Unknown error'),false);$('#playerList').innerHTML='<div class="empty">Roster unavailable. Tap refresh.</div>'}
async function hydrateStats(p){if(p.statsLoaded)return;const endpoints=[`${WEB}/athletes/${p.id}/overview`,`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/athletes/${p.id}`];for(const url of endpoints){try{const d=await getJSON(url);const s=parseStats(d);if(s.ppg+s.rpg+s.apg>0){Object.assign(p,s,{statsLoaded:true});renderAll();return}}catch(e){console.warn(e)}}p.statsLoaded=true;renderAll()}
function playerById(id){for(const r of Object.values(state.rosters)){const p=r.find(x=>x.id===id);if(p)return p}return null}
function usedIds(){return new Set(Object.values(state.trade).flat())}
function renderAll(){renderTeamSelect();renderCounts();renderBrowser();renderTrades();renderSummary();persistLocal()}
function renderTeamSelect(){$('#browseTeam').innerHTML=state.teams.map(t=>`<option value="${t.id}" ${t.id===state.browseTeamId?'selected':''}>${t.name}</option>`).join('')}
function renderCounts(){$('#teamCount').innerHTML=[2,3,4].map(n=>`<button class="pill ${n===state.teamCount?'active':''}" data-count="${n}">${n} teams</button>`).join('')}
function renderBrowser(){if(!state.teams.length)return;const t=state.teams.find(x=>x.id===state.browseTeamId);$('#teamHead').innerHTML=`<img src="${logo(t)}"><div><strong>${t.name}</strong><div class="muted">Select players to trade</div></div>`;const q=state.query.toLowerCase(),used=usedIds(),r=(state.rosters[state.browseTeamId]||[]).filter(p=>p.name.toLowerCase().includes(q)||p.position.toLowerCase().includes(q));$('#playerList').innerHTML=r.length?r.map(p=>`<div class="player"><img src="${p.headshot}" onerror="this.style.visibility='hidden'"><div><div class="name">${p.name}</div><div class="muted">${p.position}${p.jersey?' • #'+p.jersey:''}</div><div class="stats"><b>${p.ppg.toFixed(1)}</b> PTS · <b>${p.rpg.toFixed(1)}</b> REB · <b>${p.apg.toFixed(1)}</b> AST</div></div><button class="add" data-add="${p.id}" ${used.has(p.id)?'disabled style="opacity:.35"':''}>+</button></div>`).join(''):'<div class="empty">No matching players.</div>'}
function ensureTrade(){state.participants.forEach(id=>state.trade[id]??=[]);Object.keys(state.trade).forEach(id=>{if(!state.participants.includes(id))delete state.trade[id]})}
function renderTrades(){ensureTrade();const grid=$('#teamsGrid');grid.className=`teams cols-${state.teamCount}`;grid.innerHTML=state.participants.map((id,i)=>{const t=state.teams.find(x=>x.id===id),ps=(state.trade[id]||[]).map(playerById).filter(Boolean),sum=ps.reduce((a,p)=>({p:a.p+p.ppg,r:a.r+p.rpg,a:a.a+p.apg}),{p:0,r:0,a:0});return`<article class="panel tradebox"><div class="tradehead"><img class="teamlogo" src="${logo(t)}"><div><h2>${t.name}</h2><div class="muted">Sending ${ps.length}</div></div><select data-participant="${i}">${state.teams.map(o=>`<option value="${o.id}" ${o.id===id?'selected':''} ${state.participants.includes(o.id)&&o.id!==id?'disabled':''}>${o.short}</option>`).join('')}</select></div><div class="outgoing">${ps.length?ps.map(p=>`<div class="tradeplayer"><img src="${p.headshot}"><div><div class="name">${p.name}</div><div class="stats">${p.ppg.toFixed(1)} PTS · ${p.rpg.toFixed(1)} REB · ${p.apg.toFixed(1)} AST</div></div><button class="remove" data-remove="${p.id}" data-team="${id}">×</button></div>`).join(''):'<div class="empty">Add players from the roster browser.</div>'}</div><div class="totals"><span><b>${sum.p.toFixed(1)}</b>PTS out</span><span><b>${sum.r.toFixed(1)}</b>REB out</span><span><b>${sum.a.toFixed(1)}</b>AST out</span></div></article>`}).join('')}
function renderSummary(){ensureTrade();const incoming={};state.participants.forEach(id=>incoming[id]=[]);state.participants.forEach((from,i)=>{const to=state.participants[(i+1)%state.participants.length];(state.trade[from]||[]).forEach(pid=>{const p=playerById(pid);if(p)incoming[to].push(p)})});const sum=a=>a.reduce((x,p)=>({p:x.p+p.ppg,r:x.r+p.rpg,a:x.a+p.apg}),{p:0,r:0,a:0});$('#summaryGrid').innerHTML=state.participants.map(id=>{const t=state.teams.find(x=>x.id===id),out=(state.trade[id]||[]).map(playerById).filter(Boolean),inc=incoming[id],o=sum(out),n=sum(inc),f=v=>`<span class="${v>=0?'positive':'negative'}">${v>=0?'+':''}${v.toFixed(1)}</span>`;return`<div class="summarycard"><strong>${t.abbreviation}: receives ${inc.length}</strong><div class="muted">${inc.length?inc.map(p=>p.name).join(', '):'No incoming players'}</div><div class="stats">Net ${f(n.p-o.p)} PTS · ${f(n.r-o.r)} REB · ${f(n.a-o.a)} AST</div></div>`}).join('')}
function addPlayer(id){const p=playerById(id);if(!p||usedIds().has(id))return;if(!state.participants.includes(p.teamId)){toast('Add that player’s team first');return}state.trade[p.teamId]??=[];state.trade[p.teamId].push(id);hydrateStats(p);renderAll()}
function removePlayer(team,id){state.trade[team]=(state.trade[team]||[]).filter(x=>x!==id);renderAll()}
function setCount(n){state.teamCount=n;while(state.participants.length<n){const t=state.teams.find(x=>!state.participants.includes(x.id));if(t)state.participants.push(t.id)}state.participants=state.participants.slice(0,n);renderAll()}
function setParticipant(i,id){const old=state.participants[i];state.participants[i]=id;delete state.trade[old];state.browseTeamId=id;renderAll();loadRoster(id)}
function snapshot(){return{version:2,teamCount:state.teamCount,participants:state.participants,trade:state.trade,rosters:state.rosters,title:state.title}}
function persistLocal(){if(state.teams.length)localStorage.setItem('nbaTradeLab',JSON.stringify(snapshot()))}
function restoreLocal(){try{const x=JSON.parse(localStorage.getItem('nbaTradeLab'));if(!x)return false;Object.assign(state,{teamCount:x.teamCount||2,participants:x.participants||[],trade:x.trade||{},rosters:x.rosters||{},title:x.title||'Untitled Trade'});return true}catch{return false}}
function reset(){localStorage.removeItem('nbaTradeLab');state.teamCount=2;state.participants=state.teams.slice(0,2).map(t=>t.id);state.trade={};state.rosters={};state.browseTeamId=state.participants[0];state.title='Untitled Trade';state.saveCode=null;renderAll();loadRoster(state.browseTeamId);toast('Reset complete')}
function code(){return crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase()}
function modal(mode){const w=$('#modalWrap');w.dataset.mode=mode;$('#modalTitle').textContent=mode==='save'?'Save Trade':'Load Trade';$('#modalFields').innerHTML=mode==='save'?`<label>Name</label><input id="tradeTitle" value="${state.title}"><label style="display:block;margin-top:10px">Save code</label><input id="tradeCode" value="${state.saveCode||code()}">`:`<label>Save code</label><input id="tradeCode" placeholder="A1B2C3D4E5">`;w.classList.add('show')}
async function saveTrade(){const c=$('#tradeCode').value.trim().toUpperCase(),title=$('#tradeTitle').value.trim()||'Untitled Trade';if(c.length<6)return toast('Code must be at least 6 characters');const {error}=await db.from('nba_trade_saves').upsert({save_code:c,title,trade_data:snapshot()},{onConflict:'save_code'});if(error)return toast(error.message);state.saveCode=c;state.title=title;$('#modalWrap').classList.remove('show');toast('Saved '+c)}
async function loadTrade(){const c=$('#tradeCode').value.trim().toUpperCase();const {data,error}=await db.from('nba_trade_saves').select('*').eq('save_code',c).maybeSingle();if(error||!data)return toast(error?.message||'Save not found');const x=data.trade_data||{};Object.assign(state,{teamCount:x.teamCount||2,participants:x.participants||[],trade:x.trade||{},rosters:x.rosters||{},title:data.title||x.title||'Untitled Trade',saveCode:data.save_code});state.browseTeamId=state.participants[0];$('#modalWrap').classList.remove('show');renderAll();loadRoster(state.browseTeamId);toast('Loaded '+data.title)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a)addPlayer(a.dataset.add);const r=e.target.closest('[data-remove]');if(r)removePlayer(r.dataset.team,r.dataset.remove);const c=e.target.closest('[data-count]');if(c)setCount(Number(c.dataset.count))});
$('#browseTeam').onchange=e=>{state.browseTeamId=e.target.value;renderBrowser();loadRoster(state.browseTeamId)};$('#search').oninput=e=>{state.query=e.target.value;renderBrowser()};$('#teamsGrid').onchange=e=>{if(e.target.dataset.participant!=null)setParticipant(Number(e.target.dataset.participant),e.target.value)};$('#refreshBtn').onclick=()=>state.teams.length?loadRoster(state.browseTeamId,true):loadTeams();$('#resetBtn').onclick=()=>confirm('Reset the trade and cached ESPN data?')&&reset();$('#saveBtn').onclick=()=>modal('save');$('#loadBtn').onclick=()=>modal('load');$('#cancelModal').onclick=()=>$('#modalWrap').classList.remove('show');$('#confirmModal').onclick=()=>$('#modalWrap').dataset.mode==='save'?saveTrade():loadTrade();$('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')e.currentTarget.classList.remove('show')};
loadTeams();
</script></body></html>
