<style>

1px solid var(--line);border-radius:7px;position:relative;display:grid;place-items:center;overflow:hidden;font-weight:800}.color input{position:absolute;inset:0;opacity:0;cursor:pointer}.formula-strip{padding-top:5px;padding-bottom:5px}.name-box{width:82px;height:31px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;text-align:center;font-weight:700}.fx{font-weight:800;font-style:italic;color:var(--muted)}.formula{flex:1;height:31px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:100px}.formula:focus,.name-box:focus{outline:2px solid rgba(22,131,75,.18);border-color:#5ba67c}.sheet-area{min-height:0;display:grid;grid-template-rows:1fr auto;background:#eef1f5}.grid-wrap{min-height:0;overflow:auto;position:relative;background:white}.grid{display:grid;position:relative;width:max-content;min-width:100%}.corner,.col-head,.row-head,.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:0;height:auto}.corner,.col-head,.row-head{background:var(--header);font-size:12px;color:#4a5563;display:flex;align-items:center;justify-content:center;font-weight:650;user-select:none}.corner{position:sticky;top:0;left:0;z-index:8}.col-head{position:sticky;top:0;z-index:6}.row-head{position:sticky;left:0;z-index:5}.col-head,.row-head{position:sticky}.col-resize,.row-resize{position:absolute;z-index:12}.col-resize{right:-4px;top:0;width:8px;height:100%;cursor:col-resize}.row-resize{left:0;bottom:-4px;width:100%;height:8px;cursor:row-resize}.cell.freeze-row{position:sticky;top:var(--rowH);z-index:4}.cell.freeze-col{position:sticky;left:var(--rowHead);z-index:3}.cell.freeze-row.freeze-col{z-index:5}.cell.freeze-row,.cell.freeze-col{box-shadow:0 1px 0 #b7c0ca,1px 0 0 #b7c0ca}.cell{background:#fff;position:relative;padding:4px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;outline:0;font-size:13px;user-select:none}.cell.selected{background:var(--select);box-shadow:inset 0 0 0 1px rgba(23,131,75,.25)}.cell.activ <body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand"><div class="mark">S</div><span>SheetDesk</span></div>
  <input id="fileName" class="filename" value="Untitled Workbook" aria-label="Workbook name">
  <div class="actions">
    <button class="btn" id="newBtn">New</button><button class="btn" id="openBtn">Open</button>
    <input id="fileInput" class="hidden" type="file" accept=".xlsx,.xls,.xlsm,.xlsb,.csv,.tsv,.txt,.ods,.fods,.numbers,.xml,.slk,.sylk,.dif,.dbf,.wk1,.wk3,.wks,.xlr">
    <button class="btn primary" id="saveBtn"><span class="label">Save XLSX</span></button>
    <button class="btn" id="pdfBtn"><span class="label">PDF</span></button>
    <div class="menu-wrap"><button class="btn" id="moreBtn">More ▾</button><div class="menu" id="moreMenu">
      <button id="findBtn">Find / Replace</button>
      <button id="insertRowBtn">Insert row above</button><button id="deleteRowBtn">Delete row</button>
      <button id="insertColBtn">Insert column left</button><button id="deleteColBtn">Delete column</button>
      <button id="freezeRowBtn">Freeze first row</button><button id="freezeColBtn">Freeze first column</button>
      <button id="autoFitColBtn">Auto-fit current column</button><button id="setRowHeightBtn">Set current row height…</button>
      <button id="deleteSheetBtn">Delete current sheet</button>
      <button id="csvBtn">Export active sheet as CSV</button><button id="odsBtn">Export workbook as ODS</button><button id="printBtn">Print / Save as PDF</button><button id="restoreBtn">Restore autosave</button><button id="clearAutosaveBtn">Clear autosave</button>
    </div></div>
  </div>
</header>
<section class="toolbar">
  <div class="group"><button class="btn icon" id="undoBtn">↶</button><button class="btn icon" id="redoBtn">↷</button></div><div class="divider"></div>
  <select id="fontFamily"><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option>Courier New</option></select>
  <select id="fontSize"><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>24</option></select>
  <div class="divider"></div>
  <div class="group"><button class="btn icon" id="boldBtn">B</button><button class="btn icon" id="italicBtn"><i>I</i></button><button class="btn icon" id="underlineBtn"><u>U</u></button><label class="color" title="Text color">A<input id="textColor" type="color" value="#111111"></label><label class="color" title="Fill color"><span style="background:#fff09a;padding:1px 4px;border-radius:3px">F</span><input id="fillColor" type="color" value="#fff09a"></label></div>
  <div class="divider"></div>
  <div class="group"><button class="btn icon" data-align="left">⇤</button><button class="btn icon" data-align="center">≡</button><button class="btn icon" data-align="right">⇥</button></div>
  <div class="divider"></div>
  <select id="numFormat"><option value="general">General</option><option value="number">Number</option><option value="integer">Integer</option><option value="currency">Currency</option><option value="percent">Percent</option><option value="date">Date</option></select>
  <div class="divider"></div>
  <button class="btn" id="sortAsc">Sort A→Z</button><button class="btn" id="sortDesc">Sort Z→A</button><button class="btn" id="clearBtn">Clear cells</button>
</section>
<section class="formula-strip"><input id="nameBox" class="name-box" value="A1"><span class="fx">fx</span><input id="formulaBar" class="formula" placeholder="Value or formula, e.g. =SUM(A1:A10)"></section>
<main class="sheet-area"><div class="grid-wrap" id="gridWrap"><div class="grid" id="grid" tabindex="0"></div></div><div class="tabs" id="tabs"><button class="btn tab-add" id="addSheetBtn" title="Add sheet">+</button></div></main>
<footer class="statusbar"><span id="status">Ready</span><span id="selectionInfo">A1</span><span id="quickStats"></span><div class="status-right"><span id="dimensions">100 rows × 26 columns</span><span id="sheetInfo">1 sheet</span></div></footer>
<div class="drop">Drop a spreadsheet file here</div><div class="toast" id="toast"></div>
<div id="findModal" class="sheet-modal-bg"><div class="sheet-modal"><div class="sheet-modal-head"><span>Find & Replace</span><button class="btn" id="closeFind">×</button></div><div class="sheet-modal-body"><label>Find<input id="findText" autocomplete="off" placeholder="Text or formula"></label><label>Replace with<input id="replaceText" autocomplete="off" placeholder="Replacement"></label><label style="display:flex;grid-template-columns:auto 1fr;align-items:center"><input id="findAllSheets" type="checkbox"> Search all sheets</label><div class="sheet-modal-actions"><button class="btn" id="findPrev">Previous</button><button class="btn" id="findNext">Next</button><button class="btn" id="replaceOne">Replace</button><button class="btn" id="replaceAll">Replace all</button></div><div id="findResult" class="find-result">Enter text to search.</div></div></div></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),grid=$('grid'),gridWrap=$('gridWrap'),tabs=$('tabs'),formulaBar=$('formulaBar'),nameBox=$('nameBox'),fileName=$('fileName'),app=$('app');
const BASE_ROWS=100,BASE_COLS=26,AUTOSAVE='sheetdesk.autosave.v1';
let wb={sheets:{Sheet1:newSheet()},order:['Sheet1'],active:'Sheet1'},sel={r1:0,c1:0,r2:0,c2:0},editing=null,dirty=false,history=[],future=[],dragSelecting=false,saveTimer=null,resizeState=null,findHits=[],findAt=-1;
function newSheet(){return{cells:{},styles:{},rows:BASE_ROWS,cols:BASE_COLS,colWidths:{},rowHeights:{},freezeRow:false,freezeCol:false}}
const key=(r,c)=>`${r},${c}`; const active=()=>wb.sheets[wb.active];
function colName(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function addr(r,c){return colName(c)+(r+1)}
function parseAddr(a){const m=String(a).trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return{r:+m[2]-1,c:c-1}}
function rangeNorm(){return{r1:Math.min(sel.r1,sel.r2),r2:Math.max(sel.r1,sel.r2),c1:Math.min(sel.c1,sel.c2),c2:Math.max(sel.c1,sel.c2)}}
function eachSelected(fn){const q=rangeNorm();for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)fn(r,c)}
function rawCell(r,c){return active().cells[key(r,c)]||{raw:''}}
function setRaw(r,c,raw,record=true){if(record)pushHistory();const k=key(r,c);if(raw===''||raw==null)delete active().cells[k];else active().cells[k]={raw:String(raw)};dirty=true;scheduleSave()}
function styleAt(r,c){return active().styles[key(r,c)]||{}}
function setStyle(prop,val){pushHistory();eachSelected((r,c)=>{const k=key(r,c),s=active().styles[k]||{};s[prop]=val;active().styles[k]=s});dirty=true;scheduleSave();renderCellsOnly()}
function snapshot(){return JSON.stringify({wb,sel})}
function pushHistory(){history.push(snapshot());if(history.length>35)history.shift();future=[]}
function restoreSnap(s){const o=JSON.parse(s);wb=o.wb;sel=o.sel||sel;renderAll();dirty=true;scheduleSave()}
function undo(){if(!history.length)return;future.push(snapshot());restoreSnap(history.pop())}
function redo(){if(!future.length)return;history.push(snapshot());restoreSnap(future.pop())}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3500)}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(AUTOSAVE,JSON.stringify({wb,fileName:fileName.value}));$('status').textContent='Autosaved locally'}catch(e){$('status').textContent='Autosave unavailable'}},600)}
function cellValue(r,c,stack=new Set()){const cell=rawCell(r,c),raw=cell.raw??'';if(typeof raw!=='string'||!raw.startsWith('='))return parseLiteral(raw);const a=addr(r,c);if(stack.has(a))return'#CYCLE!';const next=new Set(stack);next.add(a);try{return evalFormula(raw.slice(1),next)}catch(e){return'#ERROR!'}}
function parseLiteral(v){if(v===''||v==null)return'';if(typeof v==='number')return v;const s=String(v);if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);return s}
function evalFormula(src,stack){let expr=src.trim();
  const RANGE=(a,b)=>{const A=parseAddr(a),B=parseAddr(b);if(!A||!B)return[];const out=[];for(let r=Math.min(A.r,B.r);r<=Math.max(A.r,B.r);r++)for(let c=Math.min(A.c,B.c);c<=Math.max(A.c,B.c);c++)out.push(cellValue(r,c,stack));return out};
  const CELL=a=>{const A=parseAddr(a);return A?cellValue(A.r,A.c,stack):0};
  expr=expr.replace(/([A-Z]+\d+):([A-Z]+\d+)/gi,(_,a,b)=>`RANGE("${a.toUpperCase()}","${b.toUpperCase()}")`);
  expr=expr.replace(/\b([A-Z]+\d+)\b/gi,(_,a)=>`CELL("${a.toUpperCase()}")`);
  expr=expr.replace(/<>/g,'!=').replace(/\^/g,'**').replace(/(?<![<>=!])=(?!=)/g,'==');
  const ids=[...expr.matchAll(/\b([A-Za-z_][A-Za-z0-9_]*)\b/g)].map(m=>m[1].toUpperCase()).filter(x=>!['RANGE','CELL','TRUE','FALSE','SUM','AVERAGE','MIN','MAX','COUNT','COUNTA','ROUND','ABS','IF','AND','OR','CONCAT','LEN','LEFT','RIGHT','MID','UPPER','LOWER','TRIM','SQRT','TODAY','NOW'].includes(x));if(ids.length)throw Error('unsupported');
  if(!/^[0-9A-Za-z_+\-*/%**().,!<>=?:'"\s]+$/.test(expr))throw Error('bad chars');
  const flat=a=>a.flat(Infinity).filter(v=>v!==''&&v!=null);const nums=a=>flat(a).map(Number).filter(Number.isFinite);
  const SUM=(...a)=>nums(a).reduce((x,y)=>x+y,0),AVERAGE=(...a)=>{const n=nums(a);return n.length?SUM(n)/n.length:0},MIN=(...a)=>Math.min(...nums(a)),MAX=(...a)=>Math.max(...nums(a)),COUNT=(...a)=>nums(a).length,COUNTA=(...a)=>flat(a).length,ROUND=(n,d=0)=>{const p=10**Number(d);return Math.round(Number(n)*p)/p},ABS=n=>Math.abs(Number(n)),IF=(q,a,b)=>q?a:b,AND=(...a)=>flat(a).every(Boolean),OR=(...a)=>flat(a).some(Boolean),CONCAT=(...a)=>flat(a).join(''),LEN=a=>String(a??'').length,LEFT=(a,n=1)=>String(a??'').slice(0,Number(n)),RIGHT=(a,n=1)=>String(a??'').slice(-Number(n)),MID=(a,start,n)=>String(a??'').substr(Math.max(0,Number(start)-1),Number(n)),UPPER=a=>String(a??'').toUpperCase(),LOWER=a=>String(a??'').toLowerCase(),TRIM=a=>String(a??'').trim().replace(/\s+/g,' '),SQRT=n=>Math.sqrt(Number(n)),TODAY=()=>new Date().toISOString().slice(0,10),NOW=()=>new Date().toISOString();
  return Function('RANGE','CELL','SUM','AVERAGE','MIN','MAX','COUNT','COUNTA','ROUND','ABS','IF','AND','OR','CONCAT','LEN','LEFT','RIGHT','MID','UPPER','LOWER','TRIM','SQRT','TODAY','NOW','TRUE','FALSE',`"use strict";return (${expr})`)(RANGE,CELL,SUM,AVERAGE,MIN,MAX,COUNT,COUNTA,ROUND,ABS,IF,AND,OR,CONCAT,LEN,LEFT,RIGHT,MID,UPPER,LOWER,TRIM,SQRT,TODAY,NOW,true,false)
}
function formatValue(v,style){if(v===''||v==null)return'';if(typeof v==='string'&&v.startsWith('#'))return v;const f=style.numFormat||'general';if(f==='integer'&&Number.isFinite(Number(v)))return Math.round(Number(v)).toLocaleString();if(f==='number'&&Number.isFinite(Number(v)))return Number(v).toLocaleString(undefined,{maximumFractionDigits:2});if(f==='currency'&&Number.isFinite(Number(v)))return Number(v).toLocaleString(undefined,{style:'currency',currency:'USD'});if(f==='percent'&&Number.isFinite(Number(v)))return Number(v).toLocaleString(undefined,{style:'percent',maximumFractionDigits:2});if(f==='date'){const d=v instanceof Date?v:new Date(v);if(!isNaN(d))return d.toLocaleDateString()}return String(v)}
function renderAll(){renderGrid();renderTabs();updateFormula();updateStatus()}
function applyGridTracks(){const sh=active();sh.colWidths=sh.colWidths||{};sh.rowHeights=sh.rowHeights||{};grid.style.gridTemplateColumns=`var(--rowHead) ${Array.from({length:sh.cols},(_,c)=>(sh.colWidths[c]||110)+'px').join(' ')}`;grid.style.gridTemplateRows=`var(--rowH) ${Array.from({length:sh.rows},(_,r)=>(sh.rowHeights[r]||28)+'px').join(' ')}`}
function renderGrid(){const sh=active(),rows=Math.max(BASE_ROWS,sh.rows||BASE_ROWS),cols=Math.max(BASE_COLS,sh.cols||BASE_COLS);sh.rows=rows;sh.cols=cols;sh.colWidths=sh.colWidths||{};sh.rowHeights=sh.rowHeights||{};applyGridTracks();const frag=document.createDocumentFragment();const corner=document.createElement('div');corner.className='corner';corner.title='Select all';frag.append(corner);for(let c=0;c<cols;c++){const h=document.createElement('div');h.className='col-head';h.textContent=colName(c);h.dataset.c=c;const z=document.createElement('span');z.className='col-resize';z.dataset.c=c;z.title='Drag to resize column';h.append(z);frag.append(h)}for(let r=0;r<rows;r++){const rh=document.createElement('div');rh.className='row-head';rh.textContent=r+1;rh.dataset.r=r;const z=document.createElement('span');z.className='row-resize';z.dataset.r=r;z.title='Drag to resize row';rh.append(z);frag.append(rh);for(let c=0;c<cols;c++)frag.append(makeCell(r,c))}grid.replaceChildren(frag);updateSelectionClasses()}
function makeCell(r,c){const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;d.tabIndex=-1;applyCellAppearance(d,r,c);return d}
